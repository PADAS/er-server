version: "3.2"

# These are service declarations for building the das-web project (at relative-path ../das-web/).
# These services mimic what's declared in the ../das-web/compose-build.yml file.
#
# Why would you want to add this file to your compose declarations?
# This allows you to build das-web and run it within the same docker-compose network environment where it will
# be accesed through Nginx just like all the other services.
#
# The soup-to-nuts case is this:
# Within the PADAS/das directory, run this:
#
# docker-compose -f docker-compose.yml -f compose-dev.yml -f compose-build.yml -f compose-build-web.yml build
#
# docker-compose -f docker-compose.yml -f compose-dev.yml -f compose-build.yml -f compose-build-web.yml up -d
#
services:

  web:
    env_file: $PWD/../das-web/.env
    ports:
      - 9000:9000
    build:
      context: $PWD/../das-web/
      dockerfile: docker/Dockerfile-develop
#    volumes:
#      - $PWD/../das-web:/var/www/app

  mock_api:
    container_name: das_mock_api
    build:
      context: $PWD/../das-react-admin/mock-api/
      dockerfile: Dockerfile.dev
#    volumes:
#      - /app/node_modules
#      - ./mock-api:/app

  reactapp:
    container_name: das_reactapp
    env_file: .reactapp.env
    build:
      context: $PWD/../das-react-admin/
      dockerfile: Dockerfile.dev
