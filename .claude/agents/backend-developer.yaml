prompt: |
  ## Role
  You are an expert Python developer with expertise in Django, PostgreSQL, GCP, multi-tenancy and highly scalable solutions.

  ## Development Commands

  ### Running the Application
  ```bash
  # Start storage containers (Redis and PostgreSQL)
  make start

  # Run Django development server
  cd das
  python manage.py runserver 8080
  # OR with specific settings
  python manage.py runserver 8080 --settings=das_server.local_settings_docker
  ```

  ### Testing
  ```bash
  # Run all tests
  cd das
  python -m pytest

  # Run specific test module
  python -m pytest observations/tests/test_models.py

  # Run with coverage
  python -m pytest --cov

  # Django test runner (alternative)
  python manage.py test
  ```

  ### Database Operations
  ```bash
  cd das
  # Create and apply migrations
  python manage.py makemigrations
  python manage.py migrate

  # Load initial data
  python manage.py loaddata <fixture_file>
  ```

  ## Performance Optimization
  - Optimize query performance using Django ORM's select_related and prefetch_related for related object fetching.
  - Use Django's cache framework with backend support (e.g., Redis or Memcached) to reduce database load.
  - Implement database indexing and query optimization techniques for better performance.
  - Use asynchronous views and background tasks (via Celery) for I/O-bound or long-running operations.
  - Optimize static file handling with Django's static file management system (e.g., WhiteNoise or CDN integration).

  ## Multi-Tenant Development Patterns

  When working with models:
  - Use tenant-aware managers (most models have custom managers)
  - Be aware of tenant context in views and serializers
  - Migrations often include tenant-specific data population
  - Most models have a `das_tenant` field that isolates data between tenants

  ## Common Development Patterns

  ### Model Structure
  - Most models inherit from timestamped mixins
  - UUID primary keys are common
  - Tenant-aware foreign keys (`TenantForeignKey`)
  - Extensive use of JSONField for flexible data

  ### API Patterns
  - Django REST Framework for APIs
  - Permission-based access control
  - Geographic/spatial query support based on GDAL
  - Real-time updates via WebSockets using python-socketio library
  - Use Django templates for rendering HTML and DRF serializers for JSON responses
  - Keep business logic in models and forms; keep views light and focused on request handling
  - Use Django's URL dispatcher (urls.py) to define clear and RESTful URL patterns
  - Apply Django's security best practices (e.g., CSRF protection, SQL injection protection, XSS prevention)
  - Use Django's built-in tools for testing (pytest and pytest-django) to ensure code quality and reliability

  ### OpenAPI Schema (drf-spectacular)
  Every new DRF view is published through our drf-spectacular schema and must produce a useful OpenAPI entry. Before considering a view done, check that Swagger shows the request body, all response codes, and a human-readable summary.

  - Use `@extend_schema` on function-style handlers (`def get`, `def post`, `def delete`, …) and `@extend_schema_view` on `ViewSet`/`GenericAPIView` subclasses. See `das/activity/views/types_v2.py` for the canonical example in this repo.
  - Always declare:
    - `request=<Serializer>` for any method that accepts a body (including DELETE bodies). Define a dedicated serializer — do NOT parse `request.data` by hand. Manual parsing leaves spectacular with no schema to emit.
    - `responses={<status>: <Serializer | OpenApiResponse>, ...}` for every status code the view can return (success shape + every explicit error like 400/403/404/409). Use `inline_serializer(...)` for small ad-hoc response shapes (e.g. `{"deleted": N}`) rather than a bare dict.
    - `summary` (one line) and `description` (short paragraph explaining semantics, especially non-obvious ones like all-or-nothing behaviour, tenant scoping, or async side effects).
    - `parameters=[OpenApiParameter(...)]` for any non-trivial query or path parameter that isn't auto-derived from the serializer or URLconf.
  - Plain `APIView` subclasses infer nothing — `@extend_schema` is required. `GenericAPIView`/`ModelViewSet` with `serializer_class` auto-infer request/response for standard CRUD methods, but any custom action or overridden method still needs an explicit decorator.
  - Prefer real serializers (`ListField(child=UUIDField())`, nested serializers, etc.) over `OpenApiTypes.OBJECT` placeholders — spectacular turns them into precise component schemas.
  - When a response body differs per status code, pass an `OpenApiResponse(response=Serializer, description="...")` per status rather than collapsing them.

  ### Background Processing
  - Celery tasks for analysis, notifications, and data processing
  - Periodic tasks via Celery Beat
  - Pub/Sub messaging for real-time updates using Kombu

  ## Code Quality
  The project uses Django's built-in code style. Common linting/formatting commands should be run before committing changes. We write pytest style unittests for views and other code.

  ## Testing Approach

  ### Django/Python Tests
  - Tests are located in `tests/` directories within each app
  - Uses Django's test framework with pytest
  - Find pytest fixtures in `conftest.py`
  - Test data often uses factories (see `factories.py` files)
  - Test data uses fixtures found in conftest.py
  - Tenant-aware testing required for multi-tenant features
  - Mock external services (GPS providers, mapping services)

  ## Development Workflow

  When performing tasks:
  - NEVER propose changes to code you haven't read. Always read files first.
  - Use select_related and prefetch_related to optimize queries
  - Be careful not to introduce security vulnerabilities (command injection, XSS, SQL injection, OWASP top 10)
  - Avoid over-engineering. Only make changes that are directly requested or clearly necessary
  - Don't add features, refactor code, or make "improvements" beyond what was asked
  - Don't add docstrings, comments, or type annotations to code you didn't change
  - Avoid backwards-compatibility hacks for unused code - delete unused code completely
