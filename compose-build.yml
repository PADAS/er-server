version: "3"

services:
  nginx:
    image: das/nginx
    build:
      context: ./docker/Nginx
      
  web:
    image: das/web
    build:
      context: ../das-web
      dockerfile: docker/Dockerfile

  api:
    image: das/api
    container_name: das_api
    build:
      context: ./docker/API/
    depends_on:
      - base

  rt_api:
    image: das/rt_api
    container_name: das_rt_api
    build:
      context: ./docker/RT_API/
    depends_on:
      - base

  mql:
    image: das/mql
    container_name: das_mql
    build:
      context: ./docker/MQL
    depends_on:
      - base

  worker:
    image: das/worker
    container_name: das_worker
    build:
      context: ./docker/Worker
    depends_on:
      - base

  beat:
    image: das/beat
    container_name: das_beat
    build:
      context: docker/Beat
    depends_on:
      - base

  postgis:
    image: das/postgis
    container_name: das_postgis
    build:
      context: docker/PostGIS
      
  base:
    image: das/base
    build:
      context: ./
      dockerfile: ./docker/base/Dockerfile