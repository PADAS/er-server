version: 2.1
commands:
  activate_google_service_account:
    steps:
      - run: 'gcloud auth activate-service-account --key-file=<(echo "$ENCODED_GOOGLE_CREDENTIALS" | base64 --decode)'
  configure_git_for_commit_and_push:
    steps:
      - run: 'git config user.email "circleci@vulcan.com"'
      - run: 'git config user.name "circleci"'
      - run: 'git config push.default current'
      - run: 'mkdir -p ~/.ssh && echo "github.com ssh-rsa " >> ~/.ssh/known_hosts'
      - add_ssh_keys:
          fingerprints:
            - 'fc:dc:b0:e5:df:23:4f:fd:3a:8b:7e:d2:1e:b4:6d:bd'
  add_deploy_key_for_common_terraform_modules:
    steps:
      - add_ssh_keys:
          fingerprints:
            - "ca:a6:a4:87:70:0b:8c:92:b5:06:65:00:13:4d:c9:c4"
  docker_login:
    steps:
      - run: echo "$GCR_PUSH_KEY" | docker login --username _json_key --password-stdin https://gcr.io
  export_google_credentials:
    steps:
      - run: 'echo "export GOOGLE_CREDENTIALS=\"\$(echo \$ENCODED_GOOGLE_CREDENTIALS | base64 --decode)\"" >> $BASH_ENV'
  terraform_plan:
    parameters:
      terraform_workspace:
        type: string
        default: "develop"
      init_args:
        type: string
        default: "-input=false"
      plan_args:
        type: string
        default: '-input=false -out=tfplan -var "is_running_in_automation=true"'
    steps:
      - attach_workspace:
          at: './'
      - 'add_deploy_key_for_common_terraform_modules'
      - 'export_google_credentials'
      - run: 'cd infra-automation && make tf_init init_options="<< parameters.init_args >>"'
      - run: 'cd infra-automation && make tf_workspace_new workspace="<< parameters.terraform_workspace >>" || make tf_workspace_select workspace="<< parameters.terraform_workspace >>"'
      - 'toggle_firewall_for_build_agent_k8s_closure':
          inner_command: 'cd infra-automation && make tf_plan plan_options="<< parameters.plan_args >>"'
      - persist_to_workspace:
          root: './'
          paths:
            - '*'
  terraform_apply_dev:
    parameters:
      apply_args:
        type: string
        default: "-input=false tfplan"
      network:
        type: string
        default: 'dev'
      terraform_workspace:
        type: string
        default: 'develop'
    steps:
      - 'add_deploy_key_for_common_terraform_modules'
      - attach_workspace:
          at: './'
      - 'export_google_credentials'
      - 'toggle_firewall_for_build_agent_k8s_and_proxy_closure':
          inner_command: 'cd infra-automation && make tf_apply apply_options="<< parameters.apply_args >>"'
          network: '<< parameters.network >>'
      - run:
          name: 'Generate Manifest and Render Templates'
          command: |
            cd infra-automation
            make generate_manifest current_branch="$CIRCLE_BRANCH"
            regex="das-2-.*-.*"
            ENVIRONMENT_BRANCH="${CIRCLE_BRANCH}"
            if [[ $CIRCLE_BRANCH =~ $regex ]]; then
              echo "Staging"
              ENVIRONMENT_BRANCH="stage"
            fi
            make render_templates tfvars_environment="$ENVIRONMENT_BRANCH"
      - 'toggle_firewall_for_build_agent_k8s_closure':
          inner_command: 'cd infra-automation && make kubectl_apply_via_proxy'
      - persist_to_workspace:
          root: './'
          paths:
            - '*'
  terraform_apply_feature_branch:
    parameters:
      apply_args:
        type: string
        default: "-input=false tfplan"
      network:
        type: string
        default: 'dev'
    steps:
      - 'add_deploy_key_for_common_terraform_modules'
      - attach_workspace:
          at: './'
      - 'export_google_credentials'
      - 'toggle_firewall_for_build_agent_k8s_and_proxy_closure':
          inner_command: 'cd infra-automation && make tf_apply apply_options="<< parameters.apply_args >>"'
          network: '<< parameters.network >>'
      - run:
          name: 'Generate Manifest and Render Templates'
          command: |
            cd infra-automation
            make generate_manifest current_branch="$CIRCLE_BRANCH"
            make render_templates tfvars_environment="$CIRCLE_BRANCH"
      - 'toggle_firewall_for_build_agent_k8s_closure':
          inner_command: 'cd infra-automation && make kubectl_apply_via_proxy'
      - 'toggle_kubernetes_api_firewall':
          inner_command: 'cd infra-automation && make database_init tfvars_environment="$CIRCLE_BRANCH"'
      - persist_to_workspace:
          root: './'
          paths:
            - '*'
  render_templates:
    steps:
      - attach_workspace:
          at: './'
      - 'export_google_credentials'
      - 'activate_google_service_account'
      - run:
          name: 'Generate Manifest and Render Templates'
          command: |
            cd infra-automation
            make generate_manifest current_branch="$CIRCLE_BRANCH"
            make render_templates tfvars_environment="$CIRCLE_BRANCH"
      - persist_to_workspace:
          root: './'
          paths:
            - '*'
  toggle_firewall_for_build_agent_k8s_and_proxy_closure:
    parameters:
      inner_command:
        type: 'string'
      network:
        type: 'string'
        default: 'dev'
    steps:
      - 'activate_google_service_account'
      - run: "gcloud compute firewall-rules create \"bastion-cci-${CIRCLE_SHA1:0:8}-${CIRCLE_BUILD_NUM}\" --allow=\"tcp:22\" --description=\"for CircleCi... delete by: $(date --date='tomorrow')\" --direction=INGRESS --network=\"<< parameters.network >>\" --priority=899 --source-ranges=\"$(curl --silent ifconfig.me)/32\" --target-tags=\"psql-bastion\" --project=\"earthranger-78ca55ca\" --quiet"
      - run: "gcloud compute firewall-rules create \"k8s-cci-${CIRCLE_SHA1:0:8}-${CIRCLE_BUILD_NUM}\" --allow=\"tcp:$K8S_PROXY_PORT\" --description=\"for CircleCi... delete by: $(date --date='tomorrow')\" --direction=INGRESS --network=\"$K8S_PROXY_NETWORK\" --priority=899 --source-ranges=\"$(curl --silent ifconfig.me)/32\" --target-tags=\"$K8S_PROXY_TARGET_TAG\" --project=\"$K8S_PROXY_PROJECT\" --quiet"
      - run: '<<parameters.inner_command>>'
      - run:
          command: "gcloud compute firewall-rules delete \"bastion-cci-${CIRCLE_SHA1:0:8}-${CIRCLE_BUILD_NUM}\" --project=\"earthranger-78ca55ca\" --quiet"
          when: 'always'
      - run:
          command: "gcloud compute firewall-rules delete \"k8s-cci-${CIRCLE_SHA1:0:8}-${CIRCLE_BUILD_NUM}\" --project=\"$K8S_PROXY_PROJECT\" --quiet"
          when: 'always'
  toggle_firewall_for_build_agent_k8s_closure:
    parameters:
      inner_command:
        type: 'string'
    steps:
      - 'activate_google_service_account'
      - run: "gcloud compute firewall-rules create \"k8s-cci-${CIRCLE_SHA1:0:8}-${CIRCLE_BUILD_NUM}\" --allow=\"tcp:$K8S_PROXY_PORT\" --description=\"for CircleCi... delete by: $(date --date='tomorrow')\" --direction=INGRESS --network=\"$K8S_PROXY_NETWORK\" --priority=899 --source-ranges=\"$(curl --silent ifconfig.me)/32\" --target-tags=\"$K8S_PROXY_TARGET_TAG\" --project=\"$K8S_PROXY_PROJECT\" --quiet"
      - run: '<<parameters.inner_command>>'
      - run:
          command: "gcloud compute firewall-rules delete \"k8s-cci-${CIRCLE_SHA1:0:8}-${CIRCLE_BUILD_NUM}\" --project=\"$K8S_PROXY_PROJECT\" --quiet"
          when: 'always'
  toggle_kubernetes_api_firewall:
    parameters:
      inner_command:
        type: 'string'
    steps:
      - 'activate_google_service_account'
      - run: 'apt-get install -y jq'
      - run: "gcloud config set project earthranger-78ca55ca -q --no-user-output-enabled > /dev/null"
      - run:
          name: 'Get IP address'
          command: echo 'export ALLOWED_IP_ADDRESS=$(gcloud container clusters describe das-dev --zone us-west1-a --format json | jq -r ".masterAuthorizedNetworksConfig.cidrBlocks[] | .cidrBlock" | sed -z "s/\n/,/g;s/,$/\n/")' >> $BASH_ENV
      - run: gcloud container clusters update das-dev --enable-master-authorized-networks --zone us-west1-a --master-authorized-networks $(curl --silent ifconfig.me)/32,${ALLOWED_IP_ADDRESS}
      - run: '<<parameters.inner_command>>'
      - run:
          command: gcloud container clusters update das-dev --enable-master-authorized-networks --zone us-west1-a --master-authorized-networks ${ALLOWED_IP_ADDRESS}
          when: 'always'

executors:
  default:
    docker:
      - image: 'google/cloud-sdk:315.0.0'
        auth:
              username: erdockerhub
              password: $DOCKERHUB_PASSWORD
  circleci_executor:
    docker:
      - image: 'cimg/base:current'
        auth:
              username: erdockerhub
              password: $DOCKERHUB_PASSWORD
      
  docs_executor:
    docker:
      - image: 'cimg/python:3.7'
        auth:
              username: erdockerhub
              password: $DOCKERHUB_PASSWORD
jobs:
  relyance: 
    
    machine:
      image: ubuntu-2004:202010-01
    steps:
      - checkout
      # TODO: Add "RELYANCE_TOKEN" as circleCI environment variable. The token is available in Step 2 on the "Source Code Integration" tab in the platform.
      - run: curl -f --header "x-rel-access-token:$RELYANCE_TOKEN" 'https://allenai.relyance.ai/api/download?type=image' --output relyance_inspector.tar.gz && docker load --input relyance_inspector.tar.gz && docker run --rm -v `pwd`:/repo relyance_inspector:latest && docker image rm relyance_inspector:latest
  check_for_abandoned_workspaces:
    executor: circleci_executor
    steps:
      - checkout
      - 'export_google_credentials'
      - add_deploy_key_for_common_terraform_modules
      - run: 'cd infra-automation && make check_for_abandoned_workspaces'
  terraform_plan:
    parameters:
      terraform_workspace:
        type: string
        default: "develop"
      init_args:
        type: string
        default: "-input=false"
      plan_args:
        type: string
        default: '-input=false -out=tfplan -var "is_running_in_automation=true"'
    environment:
      TF_IN_AUTOMATION: 'not-empty'
    executor: 'default'
    steps:
      - terraform_plan:
          terraform_workspace: << parameters.terraform_workspace >>
          init_args: << parameters.init_args >>
          plan_args: << parameters.plan_args >>

  terraform_apply_dev:
    environment:
      TF_IN_AUTOMATION: 'not-empty'
    parameters:
      terraform_workspace:
        type: string
        default: "develop"
    executor: 'default'
    steps:
      - terraform_apply_dev:
          network: 'dev'
  terraform_apply_feature_branch:
    environment:
      TF_IN_AUTOMATION: 'not-empty'
    executor: 'default'
    steps:
      - terraform_apply_feature_branch:
          network: 'dev'
  build_sphinx_docs:
    executor: 'docs_executor'
    steps:
      - 'checkout'
      - run:
          name: "Generate build files"
          command: |
            mkdir sphinx-docs
            pip3 install -r dependencies/requirements-docs.txt 
            cd docs
            make html
            cp -rf /home/circleci/project/docs/_build/ /home/circleci/project/sphinx-docs
      - persist_to_workspace:
          root: 'sphinx-docs/_build'
          paths:
            - 'html'
  run_api_unittests:
    executor: 'default'
    parallelism: 4
    steps:
      - setup_remote_docker:
          docker_layer_caching: true
          version: 19.03.13
      - checkout
      - docker_login
      - run:
          name: Save test results
          command: |
            mkdir -p ~/unittest-output
          when: always
      - run:
          name: Install Docker Compose
          command: |
            set -x
            curl -L https://github.com/docker/compose/releases/download/1.25.3/docker-compose-`uname -s`-`uname -m` > /usr/local/bin/docker-compose
            chmod +x /usr/local/bin/docker-compose
      - run:
          name: Run Tests using Docker Compose
          command: |
            cd das
            echo ${CIRCLE_NODE_INDEX}
            export SANITIZED_CIRCLE_BRANCH=$(echo $CIRCLE_BRANCH | tr "[:upper:]." "[:lower:]_")
            docker-compose -f test_scripts/compose-unittests.yaml up -d --remove-orphans --force-recreate --quiet-pull dbserver redis
            docker-compose -f test_scripts/compose-unittests.yaml up --remove-orphans --force-recreate --quiet-pull api
            TEST_EXIT_STATUS=$(docker inspect api --format='{{.State.ExitCode}}')
            exit ${TEST_EXIT_STATUS}
  docker_build_image:
    executor: 'default'
    steps:
      - setup_remote_docker:
          docker_layer_caching: true
      - 'docker_login'
      - 'checkout'
      - attach_workspace:
          at: /home/circleci/project/sphinx-docs
      - run: cp -rf /home/circleci/project/sphinx-docs/html /root/project/das/sphinx_docs
      - run: 'cd infra-automation && make build_and_push current_branch="$CIRCLE_BRANCH" unique_gcr_tag="$CIRCLE_WORKFLOW_ID" build_number="$CIRCLE_BUILD_NUM"'
      - 'activate_google_service_account'
      - persist_to_workspace:
          root: './'
          paths:
            - '*'
  install_er_cli:
    executor: 'default'
    steps:
      - run: cd infra-automation && make install_er_cli

workflows:
  version: 2
  build_and_terraform_dev:
  # This is our eager workflow for deploying from our main code branch. So no review step.
    jobs:
      - build_sphinx_docs:
          filters:
            branches:
              only: 'develop'
      - docker_build_image:
          filters:
            branches:
              only: 'develop'
          requires:
            - 'build_sphinx_docs'
      - run_api_unittests:
          filters:
            branches:
              only:
                - 'develop'
          requires:
            - 'docker_build_image'
      - terraform_plan:
          requires:
            - 'docker_build_image'
      - terraform_apply_dev:
          requires:
            - 'terraform_plan'

  build_and_terraform_feature_branch:
  # Build for all branches except develop and release.
  # Include a review step.
    jobs:
      - install_er_cli:
          filters:
            branches:
              ignore:
                - 'develop'
                - /das-2-.*-.*/
      # - build_sphinx_docs:
      #     filters:
      #       branches:
      #         ignore:
      #           - 'develop'
      #           - /das-2-.*-.*/
      # - docker_build_image:
      #     requires:
      #       - 'build_sphinx_docs'
      #     filters:
      #       branches:
      #         ignore:
      #           - 'develop'
      #           - /das-2-.*-.*/
      # - run_api_unittests:
      #     requires:
      #       - 'docker_build_image'
      # - terraform_plan:
      #     requires:
      #       - 'docker_build_image'
      #     terraform_workspace: "$CIRCLE_BRANCH"
      # - review_plan:
      #     requires:
      #       - 'terraform_plan'
      #     type: 'approval'
      # - terraform_apply_feature_branch:
      #     requires:
      #       - 'review_plan'

  build_and_terraform_release_branch:
    jobs:
      - build_sphinx_docs:
          filters:
            branches:
              only:
                - /das-2-.*-.*/
      - docker_build_image:
          requires:
            - 'build_sphinx_docs'
          filters:
            branches:
              only:
                - /das-2-.*-.*/
      - run_api_unittests:
          requires:
            - 'docker_build_image'
      - terraform_plan:
          requires:
            - 'docker_build_image'
          terraform_workspace: "stage"
      - review_plan:
          requires:
            - 'terraform_plan'
          type: 'approval'
      - terraform_apply_dev:
          requires:
            - 'review_plan'
          terraform_workspace: "stage"

  audit:
    jobs:
      - check_for_abandoned_workspaces
    triggers:
      - schedule:
          cron: "0 0 * * 1"
          filters:
            branches:
              only:
                - "develop"
  nightly:
    triggers:
      - schedule:
          # Run against your stable branch nightly
          cron: '0 7 * * *'
          filters:
            branches:
              only:
                - "develop" 
    jobs:
      - relyance:
          context:
            - relyance
