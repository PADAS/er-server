version: 2.1
commands:
  activate_google_service_account:
    steps:
      - run: 'gcloud auth activate-service-account --key-file=<(echo "$ENCODED_GOOGLE_CREDENTIALS" | base64 --decode)'
  configure_git_for_commit_and_push:
    steps:
      - run: 'git config user.email "circleci@vulcan.com"'
      - run: 'git config user.name "circleci"'
      - run: 'git config push.default current'
      - add_ssh_keys:
          fingerprints:
            - 'fc:dc:b0:e5:df:23:4f:fd:3a:8b:7e:d2:1e:b4:6d:bd'
  add_deploy_key_for_common_terraform_modules:
    steps:
      - add_ssh_keys:
          fingerprints:
            - "ca:a6:a4:87:70:0b:8c:92:b5:06:65:00:13:4d:c9:c4"
  docker_login:
    steps:
      - run: echo "$GCR_PUSH_KEY" | docker login --username _json_key --password-stdin https://gcr.io
  export_google_credentials:
    steps:
      - run: 'echo "export GOOGLE_CREDENTIALS=\"\$(echo \$ENCODED_GOOGLE_CREDENTIALS | base64 --decode)\"" >> $BASH_ENV'
  terraform_plan:
    parameters:
      terraform_workspace:
        type: string
        default: "develop"
      init_args:
        type: string
        default: "-input=false"
      plan_args:
        type: string
        default: '-input=false -out=tfplan -var "is_running_in_automation=true"'
    steps:
      - 'checkout'
      - 'add_deploy_key_for_common_terraform_modules'
      - run: 'export GOOGLE_CREDENTIALS="$(echo $ENCODED_GOOGLE_CREDENTIALS | base64 --decode)" && cd terraform && make terraform_init init_args="<< parameters.init_args >>"'
      - run: 'export GOOGLE_CREDENTIALS="$(echo $ENCODED_GOOGLE_CREDENTIALS | base64 --decode)" && cd terraform && make terraform_workspace_new workspace="<< parameters.terraform_workspace >>" || make terraform_workspace_select workspace="<< parameters.terraform_workspace >>"'
      - run: 'export GOOGLE_CREDENTIALS="$(echo $ENCODED_GOOGLE_CREDENTIALS | base64 --decode)" && cd terraform && make terraform_plan plan_args="<< parameters.plan_args >>"'
      - persist_to_workspace:
          root: './'
          paths:
            - '*.*'
            - '*'
  terraform_apply:
    parameters:
      apply_args:
        type: string
        default: "-input=false tfplan"
      network:
        type: string
        default: 'dev'
    steps:
      - 'add_deploy_key_for_common_terraform_modules'
      - attach_workspace:
          at: './'
      - 'export_google_credentials'
      - 'toggle_firewall_for_build_agent_to_bastion_closure':
          inner_command: 'cd terraform && make terraform_apply apply_args="<< parameters.apply_args >>"'
          network: '<< parameters.network >>'
  toggle_firewall_for_build_agent_to_bastion_closure:
    parameters:
      inner_command:
        type: 'string'
      network:
        type: 'string'
        default: 'dev'
    steps:
      - 'activate_google_service_account'
      - run: "gcloud compute firewall-rules create \"cci-${CIRCLE_SHA1:0:8}-${CIRCLE_BUILD_NUM}\" --allow=\"tcp:22\" --description=\"for CircleCi... delete by: $(date --date='tomorrow')\" --direction=INGRESS --network=\"<< parameters.network >>\" --priority=899 --source-ranges=\"$(curl --silent ifconfig.co)/32\" --target-tags=\"psql-bastion\" --project=\"earthranger-78ca55ca\" --quiet"
      - run: '<<parameters.inner_command>>'
      - run:
          command: "gcloud compute firewall-rules delete \"cci-${CIRCLE_SHA1:0:8}-${CIRCLE_BUILD_NUM}\" --project=\"earthranger-78ca55ca\" --quiet"
          when: 'always'
executors:
  default:
    docker:
      - image: 'google/cloud-sdk:269.0.0'
jobs:
  terraform_plan_dev:
    environment:
      TF_IN_AUTOMATION: 'not-empty'
    executor: 'default'
    steps:
      - terraform_plan:
          terraform_workspace: '$CIRCLE_BRANCH'
  terraform_plan_prod1:
    environment:
      TF_IN_AUTOMATION: 'not-empty'
    executor: 'default'
    steps:
      - terraform_plan:
          terraform_workspace: 'prod1'
  terraform_apply_dev:
    environment:
      TF_IN_AUTOMATION: 'not-empty'
    executor: 'default'
    steps:
      - terraform_apply:
          network: 'dev'
  terraform_apply_prod1:
    environment:
      TF_IN_AUTOMATION: 'not-empty'
    executor: 'default'
    steps:
      - terraform_apply:
          network: 'prod1'
  generate_manifest:
    docker:
      - image: circleci/buildpack-deps:stretch
    steps:
      - setup_remote_docker
      - docker_login
      - checkout
      - run: 'cd circleci-docker && make generate_manifest semver_metadata_suffix=$CIRCLE_SHA1'
      - persist_to_workspace:
          root: './'
          paths:
            - '*'
  docker_build:
    docker:
      - image: circleci/buildpack-deps:stretch
    steps:
      - attach_workspace:
          at: './'
      - setup_remote_docker
      - docker_login
      - checkout
      - run: 'manifest_tag=$(cat ./GENERATED_MANIFEST.local | awk -F ''"'' ''$1 ~ /SERVER_VERSION/ {print $2}'') && cd circleci-docker && make earthranger_api_build_and_push tag=$CIRCLE_BRANCH new_tag=$manifest_tag'
      - persist_to_workspace:
          root: './'
          paths:
            - '*'
  commit_and_push_manifest:
    docker:
      - image: circleci/buildpack-deps:stretch
    steps:
      - attach_workspace:
          at: './'
      - setup_remote_docker
      - docker_login
      - checkout
      - configure_git_for_commit_and_push
      - run: 'cd circleci-docker && make commit_and_push_manifest'
workflows:
  version: 2
  build_and_terraform_dev:
  # This is our eager workflow for deploying from our main code branch.
  # So no review step.
    jobs:
      - generate_manifest:
          filters:
            branches:
              only:
                - 'develop'
      - docker_build:
          requires:
            - 'generate_manifest'
          filters:
            branches:
              only: 'develop'
      - commit_and_push_manifest:
          requires:
            - 'docker_build'
          filters:
            branches:
              only: 'develop'
      - terraform_plan_dev:
          requires:
            - 'docker_build'
      - terraform_apply_dev:
          requires:
            - 'terraform_plan_dev'

  build_and_terraform_feature_branch:
  # Build for all branches except develop and release.
  # Include a review step.
    jobs:
      - generate_manifest:
          filters:
            branches:
              ignore:
                - 'develop'
                - /release*/
      - docker_build:
          requires:
            - 'generate_manifest'
          filters:
            branches:
              ignore:
                - 'develop'
                - /release*/
      - commit_and_push_manifest:
          requires:
            - 'docker_build'
          filters:
            branches:
              ignore:
                - 'develop'
                - /release*/
      - terraform_plan_dev:
          requires:
            - 'docker_build'
      - review_plan_dev:
          requires:
            - 'terraform_plan_dev'
          type: 'approval'
      - terraform_apply_dev:
          requires:
            - 'review_plan_dev'

  build_and_terraform_prod1:
  # Build for all release branches
  # Review step for apply
    jobs:
      - generate_manifest:
          filters:
            branches:
              only:
                - /release*/
      - docker_build:
          requires:
            - 'generate_manifest'
          filters:
            branches:
              only: /release*/
      - commit_and_push_manifest:
          requires:
            - 'docker_build'
          filters:
            branches:
              only: /release*/
      - terraform_plan_prod1:
          requires:
            - 'docker_build'
      - review_plan_prod1:
          requires:
            - 'terraform_plan_prod1'
          type: 'approval'
      - terraform_apply_prod1:
          requires:
            - 'review_plan_prod1'
