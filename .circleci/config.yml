version: 2.1
commands:
  activate_google_service_account:
    steps:
      - run: 'gcloud auth activate-service-account --key-file=<(echo "$ENCODED_GOOGLE_CREDENTIALS" | base64 --decode)'
  configure_git_for_commit_and_push:
    steps:
      - run: 'git config user.email "circleci@vulcan.com"'
      - run: 'git config user.name "circleci"'
      - run: 'git config push.default current'
      - run: 'mkdir -p ~/.ssh && echo "github.com ssh-rsa " >> ~/.ssh/known_hosts'
      - add_ssh_keys:
          fingerprints:
            - 'fc:dc:b0:e5:df:23:4f:fd:3a:8b:7e:d2:1e:b4:6d:bd'
  add_deploy_key_for_common_terraform_modules:
    steps:
      - add_ssh_keys:
          fingerprints:
            - "ca:a6:a4:87:70:0b:8c:92:b5:06:65:00:13:4d:c9:c4"
  docker_login:
    steps:
      - run: echo "$GCR_PUSH_KEY" | docker login --username _json_key --password-stdin https://gcr.io
  export_google_credentials:
    steps:
      - run: 'echo "export GOOGLE_CREDENTIALS=\"\$(echo \$ENCODED_GOOGLE_CREDENTIALS | base64 --decode)\"" >> $BASH_ENV'
  terraform_plan:
    parameters:
      terraform_workspace:
        type: string
        default: "develop"
      init_args:
        type: string
        default: "-input=false"
      plan_args:
        type: string
        default: '-input=false -out=tfplan -var "is_running_in_automation=true"'
    steps:
      - attach_workspace:
          at: './'
      - 'add_deploy_key_for_common_terraform_modules'
      - 'export_google_credentials'
      - run: 'cd infra-automation && make tf_init init_options="<< parameters.init_args >>"'
      - run: 'cd infra-automation && make tf_workspace_new workspace="<< parameters.terraform_workspace >>" || make tf_workspace_select workspace="<< parameters.terraform_workspace >>"'
      - 'toggle_firewall_for_build_agent_k8s_closure':
          inner_command: 'cd infra-automation && make tf_plan plan_options="<< parameters.plan_args >>"'
      - persist_to_workspace:
          root: './'
          paths:
            - '*'
  terraform_apply:
    parameters:
      apply_args:
        type: string
        default: "-input=false tfplan"
      network:
        type: string
        default: 'dev'
    steps:
      - 'add_deploy_key_for_common_terraform_modules'
      - attach_workspace:
          at: './'
      - 'export_google_credentials'
      - 'toggle_firewall_for_build_agent_k8s_and_proxy_closure':
          inner_command: 'cd infra-automation && make tf_apply apply_options="<< parameters.apply_args >>"'
          network: '<< parameters.network >>'
      - persist_to_workspace:
          root: './'
          paths:
            - '*'
  toggle_firewall_for_build_agent_k8s_and_proxy_closure:
    parameters:
      inner_command:
        type: 'string'
      network:
        type: 'string'
        default: 'dev'
    steps:
      - 'activate_google_service_account'
      - run: "gcloud compute firewall-rules create \"bastion-cci-${CIRCLE_SHA1:0:8}-${CIRCLE_BUILD_NUM}\" --allow=\"tcp:22\" --description=\"for CircleCi... delete by: $(date --date='tomorrow')\" --direction=INGRESS --network=\"<< parameters.network >>\" --priority=899 --source-ranges=\"$(curl --silent ifconfig.me)/32\" --target-tags=\"psql-bastion\" --project=\"earthranger-78ca55ca\" --quiet"
      - run: "gcloud compute firewall-rules create \"k8s-cci-${CIRCLE_SHA1:0:8}-${CIRCLE_BUILD_NUM}\" --allow=\"tcp:$K8S_PROXY_PORT\" --description=\"for CircleCi... delete by: $(date --date='tomorrow')\" --direction=INGRESS --network=\"$K8S_PROXY_NETWORK\" --priority=899 --source-ranges=\"$(curl --silent ifconfig.me)/32\" --target-tags=\"$K8S_PROXY_TARGET_TAG\" --project=\"$K8S_PROXY_PROJECT\" --quiet"
      - run: '<<parameters.inner_command>>'
      - run:
          command: "gcloud compute firewall-rules delete \"bastion-cci-${CIRCLE_SHA1:0:8}-${CIRCLE_BUILD_NUM}\" --project=\"earthranger-78ca55ca\" --quiet"
          when: 'always'
      - run:
          command: "gcloud compute firewall-rules delete \"k8s-cci-${CIRCLE_SHA1:0:8}-${CIRCLE_BUILD_NUM}\" --project=\"$K8S_PROXY_PROJECT\" --quiet"
          when: 'always'
  toggle_firewall_for_build_agent_k8s_closure:
    parameters:
      inner_command:
        type: 'string'
    steps:
      - 'activate_google_service_account'
      - run: "gcloud compute firewall-rules create \"k8s-cci-${CIRCLE_SHA1:0:8}-${CIRCLE_BUILD_NUM}\" --allow=\"tcp:$K8S_PROXY_PORT\" --description=\"for CircleCi... delete by: $(date --date='tomorrow')\" --direction=INGRESS --network=\"$K8S_PROXY_NETWORK\" --priority=899 --source-ranges=\"$(curl --silent ifconfig.me)/32\" --target-tags=\"$K8S_PROXY_TARGET_TAG\" --project=\"$K8S_PROXY_PROJECT\" --quiet"
      - run: '<<parameters.inner_command>>'
      - run:
          command: "gcloud compute firewall-rules delete \"k8s-cci-${CIRCLE_SHA1:0:8}-${CIRCLE_BUILD_NUM}\" --project=\"$K8S_PROXY_PROJECT\" --quiet"
          when: 'always'
executors:
  default:
    docker:
      - image: 'google/cloud-sdk:269.0.0'
        auth:
              username: erdockerhub
              password: $DOCKERHUB_PASSWORD
  circleci_executor:
    docker:
      - image: 'circleci/buildpack-deps:stretch'
        auth:
              username: erdockerhub
              password: $DOCKERHUB_PASSWORD
  docs_executor:
    docker:
      - image: 'circleci/python:3.6.4'
        auth:
              username: erdockerhub
              password: $DOCKERHUB_PASSWORD
jobs:
  check_for_abandoned_workspaces:
    executor: circleci_executor
    steps:
      - checkout
      - 'export_google_credentials'
      - add_deploy_key_for_common_terraform_modules
      - run: 'cd infra-automation && make check_for_abandoned_workspaces'
  kubectl_apply:
    executor: 'default'
    steps:
      - attach_workspace:
          at: './'
      - 'export_google_credentials'
      - 'activate_google_service_account'
      - 'toggle_firewall_for_build_agent_k8s_closure':
          inner_command: 'cd infra-automation && make kubectl_apply_via_proxy'
      - persist_to_workspace:
          root: './'
          paths:
            - '*'
  database_init:
    executor: 'default'
    steps:
      - attach_workspace:
          at: './'
      - 'export_google_credentials'
      - 'activate_google_service_account'
      - 'toggle_firewall_for_build_agent_k8s_closure':
          inner_command: 'cd infra-automation && make database_init tfvars_environment="$CIRCLE_BRANCH"'
      - persist_to_workspace:
          root: './'
          paths:
            - '*'
  terraform_plan_dev:
    environment:
      TF_IN_AUTOMATION: 'not-empty'
    executor: 'default'
    steps:
      - terraform_plan:
          terraform_workspace: '$CIRCLE_BRANCH'
  terraform_plan_prod1:
    environment:
      TF_IN_AUTOMATION: 'not-empty'
    executor: 'default'
    steps:
      - terraform_plan:
          terraform_workspace: 'prod1'
  terraform_apply_dev:
    environment:
      TF_IN_AUTOMATION: 'not-empty'
    executor: 'default'
    steps:
      - terraform_apply:
          network: 'dev'
  terraform_apply_prod1:
    environment:
      TF_IN_AUTOMATION: 'not-empty'
    executor: 'default'
    steps:
      - terraform_apply:
          network: 'prod1'
  render_templates:
    environment:
      TF_IN_AUTOMATION: 'not-empty'
    executor: 'default'
    steps:
      - attach_workspace:
          at: './'
      - 'export_google_credentials'
      - 'activate_google_service_account'
      - run:
          name: 'Generate Manifest and Render Templates'
          command: |
            cd infra-automation
            make generate_manifest current_branch="$CIRCLE_BRANCH"
            make render_templates tfvars_environment="$CIRCLE_BRANCH"
      - persist_to_workspace:
          root: './'
          paths:
            - '*'

  build_sphinx_docs:
    executor: 'docs_executor'
    steps:
      - 'checkout'
      - run:
          name: "Generate build files"
          command: |
            mkdir sphinx-docs
            sudo pip3 install -r dependencies/requirements-docs.txt 
            cd docs
            make html
            cp -rf /home/circleci/project/docs/_build/ /home/circleci/project/sphinx-docs
      - persist_to_workspace:
          root: 'sphinx-docs/_build'
          paths:
            - 'html'        
  run_api_unittests:
    executor: 'default'
    steps:
      - setup_remote_docker:
          docker_layer_caching: true
          version: 19.03.13
      - checkout
      - docker_login
      - run:
          name: Save test results
          command: |
            mkdir -p ~/unittest-output
          when: always
      - run:
          name: Install Docker Compose
          command: |
            set -x
            curl -L https://github.com/docker/compose/releases/download/1.25.3/docker-compose-`uname -s`-`uname -m` > /usr/local/bin/docker-compose
            chmod +x /usr/local/bin/docker-compose
      - run:
          name: Run Tests using Docker Compose
          command: |
            cd das
            export SANITIZED_CIRCLE_BRANCH=$(echo $CIRCLE_BRANCH | tr "[:upper:]." "[:lower:]_")
            docker-compose -f test_scripts/compose-unittests.yaml up -d --remove-orphans --force-recreate --quiet-pull dbserver redis
            docker-compose -f test_scripts/compose-unittests.yaml up --remove-orphans --force-recreate --quiet-pull api
            TEST_EXIT_CODE=$?
            docker cp dbserver-test:/testresults/result.xml ~/unittest-output/result.xml
            docker-compose -f test_scripts/compose-unittests.yaml down
            exit ${TEST_EXIT_CODE}
      - store_test_results:
          path: ~/unittest-output
      # - store_artifacts:
      #     path: ~/unittest-output
      - run: 
          name: Grep Exit Code from test results
          command: |
            if grep -i 'failures="0"' ~/unittest-output/result.xml; then
                exit 0
            else
                exit 1
            fi
  docker_build_image:
    executor: 'default'
    steps:
      - setup_remote_docker:
          docker_layer_caching: true
      - 'docker_login'
      - 'checkout'
      - attach_workspace:
          at: /home/circleci/project/sphinx-docs
      - run: cp -rf /home/circleci/project/sphinx-docs/html /root/project/das/sphinx_docs
      - run: 'cd infra-automation && make build_and_push current_branch="$CIRCLE_BRANCH" unique_gcr_tag="$CIRCLE_WORKFLOW_ID" build_number="$CIRCLE_BUILD_NUM"'
      - 'activate_google_service_account'
      - persist_to_workspace:
          root: './'
          paths:
            - '*'

workflows:
  version: 2
  build_and_terraform_dev:
  # This is our eager workflow for deploying from our main code branch. So no review step.
    jobs:
      - build_sphinx_docs:
          filters:
            branches:
              only: 'develop'
      - docker_build_image:
          filters:
            branches:
              only: 'develop'
          requires:
            - 'build_sphinx_docs'
      - run_api_unittests:
          filters:
            branches:
              only:
                - 'develop'
          requires:
            - 'docker_build_image'
      - terraform_plan_dev:
          requires:
            - 'docker_build_image'
      - terraform_apply_dev:
          requires:
            - 'terraform_plan_dev'
      - render_templates:
          requires:
            - 'terraform_apply_dev'
      - kubectl_apply:
          requires:
            - 'render_templates'

  build_and_terraform_feature_branch:
  # Build for all branches except develop and release.
  # Include a review step.
    jobs:
      - build_sphinx_docs:
          filters:
            branches:
              ignore:
                - 'develop'
                - /release*/
      - docker_build_image:
          requires:
            - 'build_sphinx_docs'
          filters:
            branches:
              ignore:
                - 'develop'
                - /release*/
      - run_api_unittests:
          requires:
            - 'docker_build_image'
      - terraform_plan_dev:
          requires:
            - 'docker_build_image'
      - review_plan_dev:
          requires:
            - 'terraform_plan_dev'
          type: 'approval'
      - terraform_apply_dev:
          requires:
            - 'review_plan_dev'
      - render_templates:
          requires:
            - 'terraform_apply_dev'
      - kubectl_apply:
          requires:
            - 'render_templates'
      - database_init:
          requires:
            - 'kubectl_apply'
          filters:
            branches:
              ignore:
                - 'develop'
                - /release*/

  build_and_terraform_prod1:
  # Build for all release branches
  # Review step for apply
    jobs:
      - build_sphinx_docs:
          filters:
            branches:
              only: /release*/
      - docker_build_image:
          filters:
            branches:
              only: /release*/
          requires:
            - 'build_sphinx_docs'
      - terraform_plan_prod1:
          requires:
            - 'docker_build_image'
      - review_plan_prod1:
          requires:
            - 'terraform_plan_prod1'
          type: 'approval'
      - terraform_apply_prod1:
          requires:
            - 'review_plan_prod1'
      - render_templates:
          requires:
            - 'terraform_apply_prod1'

  audit:
    jobs:
      - check_for_abandoned_workspaces
    triggers:
      - schedule:
          cron: "0 0 * * 1"
          filters:
            branches:
              only:
                - "develop"
