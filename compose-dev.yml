version: "3.2"

services:
  web:
    image: gcr.io/padas-app/web/develop
    volumes:
      - ../das-web:/var/www/app

  api:
    volumes:
      - ./das:/var/www/app
      - ./dependencies:/workspace/dependencies
      - ./docker/base/wait_for.sh:/startup/wait_for.sh
      - ./docker/API/start.sh:/var/www/app/start.sh

  api-unittest:
    image: gcr.io/padas-app/api
    container_name: das_api_unittest
    env_file: .env
    links:
      - postgis
      - redis
    volumes:
      - ./das:/var/www/app
      - ./dependencies:/workspace/dependencies
      - ./docker/base/wait_for.sh:/startup/wait_for.sh
      - ./docker/api_unittest/start.sh:/var/www/app/start.sh

  notebook:
    volumes:
      - ./das:/var/www/app
      - ./dependencies:/workspace/dependencies
      - ./docker/base/wait_for.sh:/startup/wait_for.sh
      - ./docker/Notebook/start.sh:/var/www/app/start.sh
      - ${DAS_NOTEBOOKS_DIR:-notebooks}:/var/notebooks

  rt-api:
    volumes:
      - ./das:/var/www/app
      - ./dependencies:/workspace/dependencies
      - ./docker/base/wait_for.sh:/startup/wait_for.sh
      - ./docker/RT_API/start.sh:/var/www/app/start.sh

  mql:
    volumes:
      - ./das:/var/www/app
      - ./dependencies:/workspace/dependencies
      - ./docker/base/wait_for.sh:/startup/wait_for.sh
      - ./docker/MQL/start.sh:/var/www/app/start.sh

  worker:
    volumes:
      - ./das:/var/www/app
      - ./dependencies:/workspace/dependencies
      - ./docker/base/wait_for.sh:/startup/wait_for.sh
      - ./docker/Worker/start.sh:/var/www/app/start.sh

  beat:
    volumes:
      - ./das:/var/www/app
      - ./dependencies:/workspace/dependencies
      - ./docker/base/wait_for.sh:/startup/wait_for.sh
      - ./docker/Beat/start.sh:/var/www/app/start.sh

  postgis:
    volumes:
      - ${DAS_POSTGRES_DATA:-pgdata}:/var/lib/postgresql/data/das
    ports:
      - 6432:5432

