{% block extrastyle %}
{% load i18n static %}{% get_current_language_bidi as LANGUAGE_BIDI %}
    <link rel="stylesheet" href="{% static 'openlayers/v6/ol.css' %}"
        type="text/css">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.6.3/css/font-awesome.min.css">


<style class="text/css">
#{{ id }}_map { width: {{ map_width }}px; height: {{ map_height }}px; }
#{{ id }}_map .aligned label { float:inherit; }
#{{ id }}_admin_map { position: relative; vertical-align: top; float: {{ LANGUAGE_BIDI|yesno:"right,left" }}; }

.ol-rotate {
    margin-top: 1.5em;
    top: 11em;
}

.ol-bl{
    right: .5em;
    top: 2.5em;
}


.ol-point {
    right: .5em;
    top: 4.5em;
}

.ol-polygon {
    right: .5em;
    top: 6.5em;
}

.ol-linestring {
    right: .5em;
    top: 8.5em;
}


.ol-modify {
    right: .5em;
    top: 10.5em;
}

.img_1 {
    width: 18px;
    margin-left:1px ;

}

.img_2 {
    width: 12px;

}

.ol-x{
    right: .5em;
    top: 12.5em;
}

.sidepanel  {
  width: 0;
  position: fixed;
  z-index: 1;
  height: 250px;
  top: 0;
  left: 0;
  background-color: #111;
  overflow-x: hidden;
  transition: 0.5s;
  padding-top: 60px;
}

.sidepanel a {
  padding: 8px 8px 8px 32px;
  text-decoration: none;
  font-size: 25px;
  color: #818181;
  display: block;
  transition: 0.3s;
}

.sidepanel a:hover {
  color: #f1f1f1;
}

.sidepanel .closebtn {
  position: absolute;
  top: 0;
  right: 25px;
  font-size: 36px;
}

.openbtn {
  font-size: 20px;
  cursor: pointer;
  background-color: #111;
  color: white;
  padding: 10px 15px;
  border: none;
}

.openbtn:hover {
  background-color:#444;
}

</style>

{% endblock %}

<span id="{{ id }}_admin_map">
    <script type="text/javascript">
    {% block openlayers %}{% include "admin/openlayer/ol.js" %}{% endblock %}
    </script>
    <div id="{{ id }}_map"{% if LANGUAGE_BIDI %} dir="ltr"{% endif %}></div>
    <!-- {% if editable %} -->
    <!-- <a href="javascript:{{ module }}.clearFeatures()">{% trans "Delete all Features" %}</a> -->
    <!-- {% endif %} -->
    <div id="mySidepanel" class="sidepanel">
        <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">×</a>
        <a href="#">b1</a>
        <a href="#">b2</a>
    </div>
    {% if display_wkt %}<p style="color: #777;">{% trans "WKT debugging window:" %} (<span><a class="click-toggle" href="javascript:{{ module }}.showHideWKT()">Show</a></span>) </p>{% endif %}
    <textarea id="{{ id }}" class="vWKTField required" cols="150" rows="10" name="{{ name }}" style="display: none;">{{ wkt }}</textarea>
    <script type="text/javascript">{% block init_function %}{{ module }}.init();{% endblock %}</script>
</span>
