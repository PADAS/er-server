{% block extrastyle %}
{% load i18n static %}{% get_current_language_bidi as LANGUAGE_BIDI %}
    <link rel="stylesheet" href="{% static 'openlayers/v6/ol.css' %}"
        type="text/css">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.6.3/css/font-awesome.min.css">


<style class="text/css">
#{{ id }}_map { width: {{ map_width }}px; height: {{ map_height }}px; }
#{{ id }}_map .aligned label { float:inherit; }
#{{ id }}_admin_map { position: relative; vertical-align: top; float: {{ LANGUAGE_BIDI|yesno:"right,left" }}; }

.ol-rotate {
    margin-top: 1.5em;
    top: 11em;
}

.ol-bl{
    right: .5em;
    top: 2.5em;
}


.ol-point {
    right: .5em;
    top: 4.5em;
}

.ol-polygon {
    right: .5em;
    top: 6.5em;
}

.ol-linestring {
    right: .5em;
    top: 8.5em;
}


.ol-modify {
    right: .5em;
    top: 10.5em;
}

.img_1 {
    width: 18px;
    margin-left:1px ;

}

.img_2 {
    width: 12px;

}

.ol-x{
    right: .5em;
    top: 12.5em;
}

.card {
    border: 1px solid #aad3df;
    background-color: white;
    height: 150px;
    width: 300px;
    display: none;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    z-index: 1000;
    margin-right: 32px;
    /* position: absolute;
    top: 12px; */
    padding-bottom: 12px;
    border-radius: 12px
}

.card:hover {
    background-color: rgba(255,255,255, 255) !important;
}

.item {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    margin: 8px;
    width: 70%;
    white-space: nowrap;
}

#esri_tp{
    width: 50%;
    outline: none;
}

#esri_stl{
    width: 50%;
    outline: none;
}

#ngs_{
    width: 50%;
    outline: none;
}

#osm_{
    width: 50%;
    outline: none;
}

center {
    font-size: 12px;
}

.item:hover {
    background:#e0ebf3;
    /* padding: 8px; */
    border-radius: 8px;
    /* box-shadow: 0 0.5em 0.5em -0.4em var(--hover); */
    /* transform: translateY(0.25em); */
 }
 center:hover{
     text-decoration: underline;
 }

</style>

{% endblock %}

<span id="{{ id }}_admin_map">
    <script type="text/javascript">
    {% block openlayers %}{% include "admin/openlayer/ol.js" %}{% endblock %}
    </script>
    <div id="{{ id }}_map"{% if LANGUAGE_BIDI %} dir="ltr"{% endif %}>
    </div>
    <!-- {% if editable %} -->
    <!-- <a href="javascript:{{ module }}.clearFeatures()">{% trans "Delete all Features" %}</a> -->
    <!-- {% endif %} -->
    {% if display_wkt %}<p style="color: #777;">{% trans "WKT debugging window:" %} (<span><a class="click-toggle" href="javascript:{{ module }}.showHideWKT()">Show</a></span>) </p>{% endif %}
    <textarea id="{{ id }}" class="vWKTField required" cols="150" rows="10" name="{{ name }}" style="display: none;">{{ wkt }}</textarea>
    <script type="text/javascript">{% block init_function %}{{ module }}.init();{% endblock %}</script>
</span>
