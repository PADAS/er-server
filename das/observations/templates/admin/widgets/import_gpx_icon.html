{% load i18n static %}

<div class="related-widget-wrapper">
    {{ rendered_widget }}

    <a class="related-widget-wrapper-link add-related" id="add_id_{{ name }}"
       href="{{ add_related_url }}?{{ url_params }}&subject_id={{ query_id }}"
       title="{% blocktrans %}Add another {{ model }}{% endblocktrans %}">
        <button
                type="submit"
                class="button gpx-btn"
                onMouseOver="this.style.background='#447e9b'"
                onMouseOut="this.style.background='#999'">
      IMPORT GPX DATA
    </button>
    </a>
</div>

<style>
    button.gpx-btn {
        {#margin: 4px 10px;#}
        cursor: pointer;
        padding: 9px 15px;
        background: #999;
        font-weight: 400;
        font-size: 11px;
        letter-spacing: 0.5px;
        color: #fff;
        text-decoration: none;
        display: block;
        float: left;
        border-radius: 10px;
        outline: none;

    }
    #id_import_gpx_data {
        display: None;
    }
</style>
