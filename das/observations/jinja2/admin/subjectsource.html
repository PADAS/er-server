{% for item in subjectsources %}
<div>
    <table style="border-collapse: collapse;" >
        <tr>
            <th><img src="{{ item.active_icon }}" border="0"></th>
            <th>Man. ID: {{ item.manufacturer_id }} </th>
        </tr>
        <tr>
            <td>From:</td>
            <td>{{ item.assigned_range.lower.strftime('%Y-%m-%dT%H:%M:%SZ') }}</td>
        </tr>
        <tr>
            <td>To:</td>
            <td>{{ item.assigned_range.upper.strftime('%Y-%m-%dT%H:%M:%SZ') }}</td>
        </tr>
    </table>
</div>
{% endfor %}
