{% load i18n %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}{% endblock %}</title>
<!--[if mso]>
<style type="text/css">
  .btn-fallback { display: none !important; }
</style>
<![endif]-->
</head>
<body style="margin:0;padding:0;background-color:#F3F3F3;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;">

<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color:#F3F3F3;">
  <tr>
    <td align="center" style="padding:32px 16px;">

      <!-- Outer card -->
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600" style="max-width:600px;width:100%;background-color:#ffffff;border:1px solid #dddddd;border-radius:8px;overflow:hidden;">

        <!-- Header -->
        <tr>
          <td style="background-color:#ffffff;padding:20px 28px 0 28px;">
            <img src="cid:earthranger-logo" width="200" height="37" alt="EarthRanger" style="display:block;border:0;outline:none;text-decoration:none;width:200px;height:37px;" />
          </td>
        </tr>
        <!-- Accent rule -->
        <tr>
          <td style="padding:12px 0 0 0;">
            <div style="height:3px;background-color:#0fcb8c;font-size:0;line-height:0;">&nbsp;</div>
          </td>
        </tr>

        <!-- Body content -->
        <tr>
          <td style="padding:32px 28px 24px 28px;">
            {% block content %}{% endblock %}
          </td>
        </tr>

        <!-- Footer -->
        <tr>
          <td style="padding:16px 28px 28px 28px;border-top:1px solid #dddddd;">
            {% block footer_note %}<p style="margin:0;font-size:12px;line-height:18px;color:#63666a;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;">{% blocktranslate %}If you have any questions, please contact <a href="mailto:support@earthranger.com" style="color:#63666a;">support@earthranger.com</a>{% endblocktranslate %}</p>{% endblock %}
          </td>
        </tr>

      </table>
      <!-- /Outer card -->

    </td>
  </tr>
</table>

</body>
</html>
