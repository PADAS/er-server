{% extends "admin/change_list.html" %}
{% load i18n admin_urls static admin_list %}

{% block extrahead %}
    {{ block.super }}
    <script type="text/javascript">
        django.jQuery(document).ready(function($) {
            // Alert rules data from Django context
            var userAlertRules = {{ user_alert_rules|safe }};
            var formIndexToUserId = {{ form_index_to_user_id|safe }};

            // Track which users have already been warned about
            var warnedUsers = new Set();

            // Function to check if a user has alert rules
            function checkUserAlertRules(userId) {
                return userAlertRules[userId] !== undefined && userAlertRules[userId].has_alerts;
            }

            // Add warning div
            var warningDiv = $('<div id="bulk-alert-rules-warning" style="display: none; background-color: #fff3cd; border: 1px solid #ffeaa7; padding: 15px; margin: 10px 0; border-radius: 4px; color: #856404; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1000; max-width: 600px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">' +
                '<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">' +
                '<strong>⚠️ Warning: Users with Alert Rules</strong>' +
                '<button id="close-warning" style="background: none; border: none; font-size: 18px; cursor: pointer;">&times;</button>' +
                '</div>' +
                '<div id="warning-content"></div>' +
                '<div style="margin-top: 15px; text-align: center; white-space: nowrap;">' +
                '<button id="proceed-anyway" style="background-color: #dc3545; color: white; border: none; padding: 8px 16px; margin-right: 10px; border-radius: 4px; cursor: pointer; display: inline-block;">Proceed Anyway</button>' +
                '<button id="cancel-changes" style="background-color: #6c757d; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; display: inline-block;">Cancel Changes</button>' +
                '</div>' +
                '</div>');

            // Add overlay
            var overlay = $('<div id="warning-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); z-index: 999;"></div>');

            $('body').append(overlay);
            $('body').append(warningDiv);

            // Close warning handlers
            $('#close-warning, #cancel-changes').click(function() {
                warningDiv.hide();
                overlay.hide();
                // Restore original checkbox states for all checkboxes
                $('input[type="checkbox"]').each(function() {
                    $(this).prop('checked', $(this).data('original-checked'));
                });
            });

            // Proceed anyway handler
            $('#proceed-anyway').click(function() {
                warningDiv.hide();
                overlay.hide();
                // Just close the dialog, don't submit the form
                // The checkbox will remain in its current state (unchecked)
            });


            // Store original checkbox states for all checkboxes
            $('input[type="checkbox"]').each(function() {
                $(this).data('original-checked', $(this).is(':checked'));
            });

            // Monitor changes to all checkboxes (we'll filter by name pattern)
            $('input[type="checkbox"]').change(function() {
                var checkboxName = $(this).attr('name');

                // Check if this is an is_active checkbox (pattern: form-X-is_active)
                if (checkboxName && checkboxName.indexOf('form-') === 0 && checkboxName.indexOf('-is_active') !== -1) {
                    // Extract the form index to get the user ID
                    var formIndex = checkboxName.match(/form-(\d+)-is_active/);
                    if (formIndex) {
                        var userId = formIndexToUserId[formIndex[1]];
                        var isChecked = $(this).is(':checked');

                        // If unchecking (deactivating) and user has alert rules
                        if (!isChecked && checkUserAlertRules(userId)) {
                            warnedUsers.add(userId);
                            var content = '<p>You are about to deactivate a user who has alert rules configured.</p>' +
                                '<p><strong>Deactivating this user will prevent their alert rules from being processed.</strong></p>' +
                                '<p><em>Consider reassigning these alert rules to active users before deactivating this account.</em></p>';

                            $('#warning-content').html(content);
                            warningDiv.show();
                            overlay.show();
                        }
                    }
                }
            });

            // Also check when the form is submitted
            $('form#changelist-form').submit(function(e) {
                // If we're proceeding anyway, don't check for warnings
                if ($(this).data('proceeding-anyway')) {
                    return true;
                }

                var usersWithAlertRules = [];
                var hasChanges = false;

                $('input[type="checkbox"]').each(function() {
                    var checkboxName = $(this).attr('name');

                    // Check if this is an is_active checkbox (pattern: form-X-is_active)
                    if (checkboxName && checkboxName.indexOf('form-') === 0 && checkboxName.indexOf('-is_active') !== -1) {
                        var formIndex = checkboxName.match(/form-(\d+)-is_active/);
                        if (formIndex) {
                            var userId = formIndexToUserId[formIndex[1]];
                            var isChecked = $(this).is(':checked');
                            var wasChecked = $(this).data('original-checked') || false;

                            if (isChecked !== wasChecked) {
                                hasChanges = true;
                                if (!isChecked && checkUserAlertRules(userId) && !warnedUsers.has(userId)) {
                                    usersWithAlertRules.push({
                                        id: userId
                                    });
                                }
                            }
                        }
                    }
                });

                if (usersWithAlertRules.length > 0) {
                    e.preventDefault();

                    var content = '<p>You are about to deactivate ' + usersWithAlertRules.length + ' user(s) with alert rules configured.</p>' +
                        '<p><strong>Deactivating these users will prevent their alert rules from being processed.</strong></p>' +
                        '<p><em>Consider reassigning these alert rules to active users before deactivating these accounts.</em></p>';

                    $('#warning-content').html(content);
                    warningDiv.show();
                    overlay.show();
                }
            });
        });
    </script>
{% endblock %}
