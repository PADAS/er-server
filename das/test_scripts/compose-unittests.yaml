version: "3.2"

services:

  api:
    image: gcr.io/padas-app/circleci/das-server/${CIRCLE_BRANCH:-develop}:${CIRCLE_WORKFLOW_ID:-latest}
    container_name: api
    environment:
      - DB_HOST=postgis-test
      - DB_NAME=testdb
      - DB_USER=testuser
      - DB_PASSWORD=fancypassword
      - DB_PORT=5432
    links:
      - postgis-test
      - redis
    command: sh -c "test_scripts/run_unittests.sh"
    volumes:
      - /Users/chris/padas/das/das/test_scripts/run_unittests.sh:/var/www/app/test_scripts/run_unittests.sh
    depends_on:
      - postgis-test
          #condition: service_healthy


  postgis-test:
    image: gcr.io/padas-app/postgis
    container_name: postgis-test
    environment:
      - POSTGRES_USER=testuser
      - POSTGRES_DB=testdb
      - POSTGRES_PASSWORD=fancypassword
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "export PGPASSWORD=fancypassword && pg_isready -U testuser -d testdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:6.0.6
    container_name: redis-test
    environment:
      - FOO=bar
    ports:
      - 6379:6379
    healthcheck:
      test: ["CMD-SHELL", "redis-cli && bash -c '[[ $$(redis-cli PING) == \"PONG\" ]]'"]
      interval: 10s
      timeout: 5s
      retries: 5
