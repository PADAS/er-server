  /api/v1.0/observations/:
    get:
      operationId: v1.0_observations_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: sort_by
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: subject_id
        in: query
        description: filter to a single subject
      - name: source_id
        in: query
        description: filter to a single source
      - name: subjectsource_id
        in: query
        description: filter to a subjectsource_id, rather than source_id + time range
      - name: since
        in: query
        description: get observations after this ISO8061 date, include timezone
      - name: until
        in: query
        description: get observations up to this ISO8061 date, include timezone
      - name: filter
        in: query
        description: filter using exclusion_flags for an observation. one of [null,
          0, 1, 2  or 3].
      - name: include_details
        in: query
        description: ' one of [true,false], default is false. This brings back the
          observation additional field'
      - name: created_after
        in: query
        description: get observations created (saved in EarthRanger) after this ISO8061
          date, include timezone
      - name: use_cursor
        in: query
        description: default is to use a page based paginator, which does not scale
          to a large dataset. Set use_cursor=true to employ a paginator that can handle
          millions of rows by using next/prev urls.
      tags:
      - observations
      - v1.0
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedObservationList'
          description: ''
      summary: null
    post:
      operationId: v1.0_observations_create
      tags:
      - observations
      - v1.0
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Observation'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Observation'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Observation'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Observation'
          description: ''
      summary: "\n         On condition of post body being a list, let it bulk insert.\n\
        \        :param request:\n        :param args:\n        :param kwargs:\n \
        \       :return:\n        "
