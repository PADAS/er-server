components:
  schemas:
    AcceptEula:
      type: object
      properties:
        user:
          type: string
          format: uuid
        eula:
          type: string
          format: uuid
        accept:
          type: boolean
        id:
          type: string
          format: uuid
          readOnly: true
      required:
      - eula
      - id
      - user
    AlertRule:
      type: object
      description: |-
        Notice that 'notification_methods' and 'notification_method_ids' work together to provide clean read-write
        capabilities in this serializer.

        See: https://stackoverflow.com/questions/29950956/drf-simple-foreign-key-assignment-with-nested-serializers
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        reportTypes:
          type: array
          items:
            type: string
        conditions: {}
        schedule: {}
        notification_method_ids:
          type: array
          items:
            type: string
            format: uuid
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        title:
          type: string
          description: A user friendly name for this alert.
          maxLength: 100
        ordernum:
          type: integer
          maximum: 32767
          minimum: -32768
          nullable: true
        is_active:
          type: boolean
        das_tenant:
          type: string
          format: uuid
      required:
      - created_at
      - id
      - notification_method_ids
      - reportTypes
      - updated_at
    AlertSample:
      type: object
      properties:
        acq_date:
          type: string
          format: date
        acq_time:
          type: string
          format: time
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
      required:
      - acq_date
      - acq_time
      - latitude
      - longitude
    Announcement:
      type: object
      description: |-
        This serves as the base class from which all other serializers extend.
        It contains fields common to all API resources in the app.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          nullable: true
          maxLength: 255
        description:
          type: string
          nullable: true
        additional:
          nullable: true
        link:
          type: string
          format: uri
          nullable: true
      required:
      - id
    BlankEnum:
      enum:
      - ''
    CameraTrapPostParameters:
      type: object
      properties:
        location: {}
        file:
          type: string
          format: uri
        camera_name:
          type: string
        time:
          type: string
          format: date-time
        camera_description:
          type: string
        camera_version:
          type: string
        group_id:
          type: string
          format: uuid
      required:
      - file
    CaptursObservation:
      type: object
      properties:
        device:
          type: string
        timestamp:
          type: integer
        time:
          type: integer
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
      required:
      - device
      - latitude
      - longitude
    Choice:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        model:
          allOf:
          - $ref: '#/components/schemas/ModelEnum'
          default: activity.event
        field:
          type: string
        value:
          type: string
        display:
          type: string
        ordernum:
          type: integer
          nullable: true
        icon:
          type: string
          nullable: true
        is_active:
          type: boolean
      required:
      - field
      - id
    ComputedLocation:
      type: object
      properties:
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        radius:
          type: integer
        source:
          type: integer
        status:
          type: integer
      required:
      - lat
      - lng
    Dashboard:
      type: object
      properties:
        ticket:
          type: string
        display_url:
          type: string
        server:
          type: string
      required:
      - display_url
      - server
      - ticket
    DefaultPriorityEnum:
      enum:
      - 0
      - 100
      - 200
      - 300
      type: integer
      description: |-
        * `0` - Gray
        * `100` - Green
        * `200` - Amber
        * `300` - Red
    DefaultStateEnum:
      enum:
      - new
      - active
      - resolved
      type: string
      description: |-
        * `new` - New
        * `active` - Active
        * `resolved` - Resolved
    DownloadUrlsField:
      type: object
      properties:
        csv:
          type: string
          format: uri
        json:
          type: string
          format: uri
      required:
      - csv
      - json
    EndDevice:
      type: object
      properties:
        devAddr:
          type: string
        devEui:
          type: string
          nullable: true
        cluster:
          nullable: true
      required:
      - devAddr
    Eula:
      type: object
      properties:
        id:
          type: string
          format: uuid
        version:
          type: string
          maxLength: 30
        eula_url:
          type: string
          format: uri
          maxLength: 200
      required:
      - eula_url
      - version
    Event:
      type: object
      properties:
        id:
          type: string
          format: uuid
        location:
          type: string
          nullable: true
        time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
          nullable: true
        message:
          type: string
        provenance:
          oneOf:
          - $ref: '#/components/schemas/ProvenanceEnum'
          - $ref: '#/components/schemas/BlankEnum'
        event_type:
          type: string
        event_category:
          type: string
          nullable: true
          readOnly: true
        priority:
          allOf:
          - $ref: '#/components/schemas/PriorityEnum'
          minimum: 0
          maximum: 32767
        priority_label:
          type: string
          readOnly: true
        attributes: {}
        comment:
          type: string
        title:
          type: string
        notes:
          type: array
          items:
            $ref: '#/components/schemas/EventNote'
        reported_by:
          type: string
          nullable: true
        state:
          $ref: '#/components/schemas/StateAdeEnum'
        event_details:
          allOf:
          - $ref: '#/components/schemas/EventDetails'
          default: {}
        contains:
          type: array
          items:
            type: object
