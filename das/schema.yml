  /api/v1.0/gear/:
    get:
      operationId: v1.0_gear_list
      description: |-
        Returns all gears.

        Required query-parameters:
        lat, lon: float

        Optional query-parameters:
        state, where state is either "deployed" or "hauled".
            example: state=deployed
        updated_since, where updated_since is a date-string to limit on updated_at

        page, page number

        page_size, (default is 25, max is 4000)
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: lat
        in: query
        default: 39.7749
        required: true
        description: Include subjects within a range of 5 nautical miles from this
          latitude. This value represents the north-south position of a point and
          is measured in degrees. Latitude ranges from -90.0 to 90.0 are accepted.
      - name: lon
        in: query
        default: 120.4194
        required: true
        description: Include subjects within a range of 5 nautical miles from this
          longitude. This value represents the east-west position of a point and is
          measured in degrees. Longitude ranges from -180.0 to 180.0 are accepted.
      - name: updated_since
        in: query
        required: false
        description: Return Subjects that have been updated since the given timestamp.
      - name: state
        in: query
        required: false
        description: Return Subjects that have the specified state. Use "deployed"
          for gear in the water, or "hauled" for recovered gear.
      tags:
      - buoy
      - v1.0
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedGearsList'
          description: ''
      summary: null
