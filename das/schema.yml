  /api/v1.0/activity/patrols/segments/{patrol_segment}/events/:
    get:
      operationId: v1.0_activity_patrols_segments_events_list
      description: |-
        Returns all events.
        Optional query-params:
        bbox, where bbox is the (west, south, east, north) lon,lat pairs.
            example: bbox=14.24, .41, 15.45, 1.66
        event_type
        state
        include_updates, true to include event updates
        include_notes, true to include notes

        sort_by, valid values are event_time, updated_at, created_at, serial_number (prefix with '-' for reverse order)
        * default is by '-sort_at' which is a special value representing reverse by updated_at.

        page, page number

        page_size, (default is 25, max is 4000)
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: path
        name: patrol_segment
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}-?[0-9a-fA-F]{4}-?4[0-9a-fA-F]{3}-?[89abAB][0-9a-fA-F]{3}-?[0-9a-fA-F]{12}$
        required: true
      - name: sort_by
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: sort_by
        required: false
        description: Sort by (use 'event_time', 'updated_at', 'created_at', 'serial_number')
          with optional minus ('-') prefix to reverse order.
      - name: is_collection
        in: query
        description: true/false whether to include only events that are a collection
      - name: exclude_contained
        in: query
        description: true/false whether to filter out events that are included in
          a collection
      - name: updated_since
        in: query
        description: date-string to limit on updated_at
      - name: event_ids
        in: query
        description: Event IDs, comma-separated
        schema:
          type: array
          items:
            type: string
      - name: event_category
        in: query
        description: Only include this/these categories. can specify one or more
      - name: event_type
        in: query
        description: filter to only events with this event type id
      - name: bbox
        in: query
        description: bounding box including four coordinate values, comma-separated.
          Ex. bbox=-122.4,48.4,-122.95,49.0 (west, south, east, north).
      - name: include_updates
        in: query
        description: Boolean value
      - name: include_files
        in: query
        description: Boolean value
      - name: include_details
        in: query
        description: Boolean value
      - name: include_notes
        in: query
        description: Boolean value
      - name: include_related_events
        in: query
        description: Boolean value
      - name: state
        in: query
        description: 'event states to filter on, ex: new, active, resolved'
      tags:
      - activity
      - v1.0
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEventList'
          description: ''
      summary: null
    post:
      operationId: v1.0_activity_patrols_segments_events_create
      description: |-
        Returns all events.
        Optional query-params:
        bbox, where bbox is the (west, south, east, north) lon,lat pairs.
            example: bbox=14.24, .41, 15.45, 1.66
        event_type
        state
        include_updates, true to include event updates
        include_notes, true to include notes

        sort_by, valid values are event_time, updated_at, created_at, serial_number (prefix with '-' for reverse order)
        * default is by '-sort_at' which is a special value representing reverse by updated_at.

        page, page number

        page_size, (default is 25, max is 4000)
      parameters:
      - in: path
        name: patrol_segment
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}-?[0-9a-fA-F]{4}-?4[0-9a-fA-F]{3}-?[89abAB][0-9a-fA-F]{3}-?[0-9a-fA-F]{12}$
