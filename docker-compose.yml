version: "3.2"

services:
  nginx:
    container_name: das_nginx
    build:
      context: $PWD/docker/Nginx
      dockerfile: $PWD/docker/Nginx/Dockerfile
    env_file: .env
    environment:
      - REACT_APP_MOCK_API_URL=True
    links:
      - api
      - rt-api
      - web
      - admin
    ports:
      - 8000:8000
      - '35729:35729'

  admin:
    image: gcr.io/padas-app/circleci/das-react-admin/master:latest
    container_name: admin

  api:
    image: gcr.io/padas-app/circleci/das-server/develop:latest
    container_name: das_api
    env_file: .env
    environment:
      - SERVICE_NAME=api_server
      - GOOGLE_APPLICATION_CREDENTIALS=/.config/gcloud/application_default_credentials.json
    links:
      - postgis
      - redis
    volumes:
      - user-uploads:/user-uploads
      - www-static:/var/www/static
      - type: bind
        source: ${PWD}/docker/keys/default
        target: /.config/gcloud
        read_only: True
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/api/v1.0/status']
      interval: 30s
      timeout: 1s
      retries: 5

  rt-api:
    image: gcr.io/padas-app/circleci/das-server/develop:latest
    container_name: das_rt_api
    env_file: .env
    environment:
      - SERVICE_NAME=realtime_server
      - GOOGLE_APPLICATION_CREDENTIALS=/.config/gcloud/application_default_credentials.json
    links:
      - postgis
      - redis
    volumes:
      - type: bind
        source: ${PWD}/docker/keys/default
        target: /.config/gcloud
        read_only: True
    depends_on:
      - api

  mql:
    image: gcr.io/padas-app/circleci/das-server/develop:latest
    container_name: das_mql
    env_file: .env
    environment:
      - SERVICE_NAME=mql_server
      - GOOGLE_APPLICATION_CREDENTIALS=/.config/gcloud/application_default_credentials.json
    links:
      - postgis
      - redis
    volumes:
      - type: bind
        source: ${PWD}/docker/keys/default
        target: /.config/gcloud
        read_only: True
    depends_on:
      - rt-api

  worker:
    image: gcr.io/padas-app/circleci/das-server/develop:latest
    container_name: das_worker
    env_file: .env
    environment:
      - SERVICE_NAME=all_in_one_worker
      - GOOGLE_APPLICATION_CREDENTIALS=/.config/gcloud/application_default_credentials.json
    links:
      - postgis
      - redis
    depends_on:
      - rt-api
    volumes:
      - user-uploads:/user-uploads
      - www-static:/var/www/static
      - type: bind
        source: ${PWD}/docker/keys/default
        target: /.config/gcloud
        read_only: True
  
  beat:
    image: gcr.io/padas-app/circleci/das-server/develop:latest
    container_name: das_beat
    env_file: .env
    environment:
      - SERVICE_NAME=beat_service
      - GOOGLE_APPLICATION_CREDENTIALS=/.config/gcloud/application_default_credentials.json
    links:
      - postgis
      - redis
    volumes:
      - type: bind
        source: ${PWD}/docker/keys/default
        target: /.config/gcloud
        read_only: True
    depends_on:
      - rt-api

  postgis:
    image: gcr.io/padas-app/postgis
    container_name: das_postgis
    volumes:
      - pgdata:/var/lib/postgresql/data/das

  redis:
    image: redis
    container_name: das_redis
    ports:
      - 6379:6379

volumes:
  pgdata:
  notebooks:
  user-uploads:
  www-static:
