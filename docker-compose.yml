version: "3"

services:
  nginx:
    image: das/nginx
    container_name: das_nginx
    links:
      - api:api
      - rt_api:rt_api
    ports:
      - 8000:8000

  web:
    image: das/web
    container_name: das_web
    ports:
      - 9000:9000

  api:
    image: das/api
    container_name: das_api
    links:
      - postgis
      - redis

  rt_api:
    image: das/rt_api
    container_name: das_rt_api
    links:
      - postgis
      - redis

  mql:
    image: das/mql
    container_name: das_mql
    links:
      - postgis
      - redis

  worker:
    image: das/worker
    container_name: das_worker
    links:
      - postgis
      - redis

  beat:
    image: das/beat
    container_name: das_beat
    links:
      - postgis
      - redis

  postgis:
    image: das/postgis
    container_name: das_postgis

  redis:
    image: redis
    container_name: das_redis