version: "3"

services:
  nginx:
    image: das/nginx
    container_name: das_nginx
    build:
      context: .
      dockerfile: docker/Nginx/Dockerfile
    links:
      - api:api
      - rt_api:rt_api
    ports:
      - 8000:8000
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf

  web:
    image: das/web
    container_name: das_web
    build:
      context: ../das-web
      dockerfile: docker/Dockerfile

    ports:
      - 9000:9000
    volumes: 
      - ../das-web:/var/www/das

  api:
    image: das/api
    container_name: das_api
    build:
      context: .
      dockerfile: docker/API/Dockerfile
    volumes:
      - ./das:/var/www/das
      - ./dependencies:/workspace/dependencies
    links:
      - postgis
      - redis

  rt_api:
    image: das/rt_api
    container_name: das_rt_api
    build:
      context: .
      dockerfile: docker/RT_API/Dockerfile
    volumes:
      - ./das:/var/www/das
      - ./dependencies:/workspace/dependencies
    links:
      - postgis
      - redis

  mql:
    image: das/mql
    container_name: das_mql
    build:
      context: .
      dockerfile: docker/MQL/Dockerfile
    volumes:
      - ./das:/var/www/das
      - ./dependencies:/workspace/dependencies
    links:
      - postgis
      - redis

  worker:
    image: das/worker
    container_name: das_worker
    build:
      context: .
      dockerfile: docker/Worker/Dockerfile
    volumes:
      - ./das:/var/www/das
      - ./dependencies:/workspace/dependencies
    links:
      - postgis
      - redis

  beat:
    image: das/beat
    container_name: das_beat
    build:
      context: .
      dockerfile: docker/Beat/Dockerfile
    volumes:
      - ./das:/var/www/das
      - ./dependencies:/workspace/dependencies
    links:
      - postgis
      - redis

  postgis:
    image: das/postgis
    container_name: das_postgis
    build:
      context: .
      dockerfile: docker/PostGIS/Dockerfile

  redis:
    image: redis
    container_name: das_redis