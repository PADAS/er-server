version: "3"

services:
  nginx:
    image: grc.io/padas-app/nginx
    container_name: das_nginx
    links:
      - api
      - rt_api
    ports:
      - 8000:8000

  web:
    image: grc.io/padas-app/web
    container_name: das_web
    ports:
      - 9000:9000

  api:
    image: grc.io/padas-app/api
    container_name: das_api
    links:
      - postgis
      - redis

  rt_api:
    image: grc.io/padas-app/rt_api
    container_name: das_rt_api
    links:
      - postgis
      - redis

  mql:
    image: grc.io/padas-app/mql
    container_name: das_mql
    links:
      - postgis
      - redis

  worker:
    image: grc.io/padas-app/worker
    container_name: das_worker
    links:
      - postgis
      - redis

  beat:
    image: grc.io/padas-app/beat
    container_name: das_beat
    links:
      - postgis
      - redis

  postgis:
    image: grc.io/padas-app/postgis
    container_name: das_postgis

  redis:
    image: redis
    container_name: das_redis
