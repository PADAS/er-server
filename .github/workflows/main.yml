name: Build das-server
on:
  push:
    branches:
      - develop
      - 'release-**'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_sphinx_docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Build Sphinx docs
        run: |
          cd docs
          uv venv --python=python3.12
          uv pip install -r requirements-docs.txt
          source .venv/bin/activate
          make html
      - name: Upload Sphinx docs
        uses: actions/upload-artifact@v4
        with:
          name: sphinx_docs
          path: docs/_build/html
  build:
    uses: PADAS/serca-pipelines/.github/workflows/_docker-build.yml@main
    needs: build_sphinx_docs
    with:
      repository: europe-west3-docker.pkg.dev/padas-app/er-mt/das-server
      tag: ${{ github.head_ref || github.ref_name }}-${{ github.run_number }}
      dockerfile: circleci-docker/Dockerfile
      artifact-download: true
      artifact-name: sphinx_docs
      artifact-path: ./das/sphinx_docs
      push: true
      workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
      service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

  unit-test1:
    uses: ./.github/workflows/_unit-tests.yml
    needs: build
    with:
      image: "europe-west3-docker.pkg.dev/padas-app/er-mt/das-server:${{ github.head_ref || github.ref_name }}-${{ github.run_number }}"
      command: |
        pytest --reuse-db --junitxml=/testresults/junit/result_suite_one.xml --maxfail=15 accounts/tests mapping/tests reports/tests rt_api/tests tracking/tests
        pytest --reuse-db --junitxml=/testresults/junit/result_suite_three.xml --maxfail=15 analyzers/tests utils/tests
        pytest --reuse-db --junitxml=/testresults/junit/result_suite_four.xml --maxfail=15 choices/tests das_server/tests observations/tests buoy/tests core/tests schemas/tests

  unit-test2:
    uses: ./.github/workflows/_unit-tests.yml
    needs: build
    with:
      image: "europe-west3-docker.pkg.dev/padas-app/er-mt/das-server:${{ github.head_ref || github.ref_name }}-${{ github.run_number }}"
      command: pytest --reuse-db --junitxml=/testresults/junit/result_suite_two.xml --maxfail=15 activity/tests sensors/tests revision/test

  deploy-dev:
    needs: [unit-test1, unit-test2]
    uses: PADAS/serca-pipelines/.github/workflows/_argocd-deploy.yml@main
    with:
      app-name: das-server
      app-subdir: earthranger
      environment: er-dev
      image-tag: "${{ github.ref_name }}-${{ github.run_number }}"
    secrets:
      ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
      ARGOCD_APPS_SSH_KEY: ${{ secrets.ARGOCD_APPS_SSH_KEY }}
