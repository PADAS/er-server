name: Build das-server
on:
  push:
    branches:
      - era-9426

jobs:
  build:
    uses: PADAS/gundi-workflows/.github/workflows/build_docker.yml@v2
    with:
      environment: padas-app
      repository: europe-west3-docker.pkg.dev/padas-app/er-mt/das-server
      tag: ${{ github.head_ref || github.ref_name }}-${{ github.run_number }}
      dockerfile: circleci-docker/Dockerfile

  vars:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    outputs:
      token: ${{ steps.vars.outputs.token }}
    environment: padas-app
    steps:
      - name: GCP Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}
      - id: vars
        run: |
          echo "token=$(gcloud auth print-access-token)" >> $GITHUB_OUTPUT

  unit-tests:
    runs-on: ubuntu-latest
    needs: [build, vars]
    container: 
      image: europe-west3-docker.pkg.dev/padas-app/er-mt/das-server:${{ github.head_ref || github.ref_name }}-${{ github.run_number }}
      credentials:
        username: oauth2accesstoken
        password: ${{ needs.vars.outputs.token }}
    services:
      postgres:
        image: postgres:16.2
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: fancypassword
          POSTGRES_DATABASE: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.2
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Run tests
        run: |
          cd /das
          export PYTHONPATH=/das/test_scripts:$PYTHONPATH
          python3 -m pip install --upgrade keyrings.alt
          python3 -m pip install -r /das/dependencies/requirements-dev.txt --find-links /das/dependencies/wheelhouse/ --upgrade
          export DJANGO_SETTINGS_MODULE=unittest_settings
          IS_OAUTH2_PROVIDER_MIGRATION=true python3 manage.py migrate
          IS_OAUTH2_PROVIDER_MIGRATION=true pytest --reuse-db --create-db --junitxml=/testresults/result.xml --maxfail=15  core/tests/test_utils.py
          pytest --reuse-db --junitxml=/testresults/junit/result_suite_one.xml --maxfail=15 accounts/tests mapping/tests reports/tests rt_api/tests tracking/tests
        env:
          DB_HOST: postgres
          DB_NAME: testdb
          DB_USER: testuser
          DB_PASSWORD: fancypassword
          DB_PORT: 5432
          FQDN: testing.pamdas.org