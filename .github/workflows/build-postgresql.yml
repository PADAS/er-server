name: Build PostgreSQL Image
on:
  workflow_dispatch:
    inputs:
      tag_suffix:
        description: 'Optional tag suffix (e.g., "1" results in YYYYMMDD-1). Defaults to run number.'
        required: false
        type: string
  push:
    branches:
      - develop
      - 'release-**'
    paths:
      - 'circleci-docker/Dockerfile-db'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  GCS_BACKUP_PATH: gs://padas-app-db-backups/postgresql-init/db-backup.sql

jobs:
  generate-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Generate date tag
        id: tag
        run: |
          DATE=$(date +%Y%m%d)
          SUFFIX="${{ inputs.tag_suffix || github.run_number }}"
          echo "tag=${DATE}-${SUFFIX}" >> $GITHUB_OUTPUT

  prepare:
    runs-on: ubuntu-latest
    environment: padas-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Download database backup from GCS
        run: |
          gsutil cp ${{ env.GCS_BACKUP_PATH }} circleci-docker/db-backup.sql
          ls -lh circleci-docker/db-backup.sql

      - name: Upload build context
        uses: actions/upload-artifact@v4
        with:
          name: db-backup
          path: circleci-docker/db-backup.sql
          retention-days: 1

  build:
    needs: [generate-tag, prepare]
    uses: PADAS/gundi-workflows/.github/workflows/build_docker.yml@v2
    with:
      environment: padas-app
      repository: europe-west3-docker.pkg.dev/padas-app/er-mt/postgresql
      tag: ${{ needs.generate-tag.outputs.tag }}
      dockerfile: circleci-docker/Dockerfile-db
      artifact-download: true
      artifact-name: db-backup
      artifact-path: ./circleci-docker
