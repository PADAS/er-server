name: Build & Deploy das-server (develop)
on:
  push:
    branches:
      - develop
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.tag.outputs.value }}
    steps:
      - name: Generate image tag
        id: tag
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          BRANCH_SAFE=$(echo "${GITHUB_REF_NAME}" | tr '/' '-' | tr '[:upper:]' '[:lower:]')
          echo "value=${BRANCH_SAFE}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build Sphinx docs
        run: |
          cd docs
          uv venv --python=python3.12
          uv pip install -r requirements-docs.txt
          source .venv/bin/activate
          make html
      - uses: actions/upload-artifact@v4
        with:
          name: sphinx_docs
          path: docs/_build/html

  build:
    needs: [config, build-docs]
    uses: PADAS/serca-pipelines/.github/workflows/_docker-build.yml@main
    with:
      repository: europe-west3-docker.pkg.dev/serca-artifact-registry/earthranger/das-server
      secondary-repository: europe-west3-docker.pkg.dev/padas-app/er-mt/das-server
      tag: ${{ needs.config.outputs.image-tag }}
      dockerfile: Dockerfile.mt
      artifact-download: true
      artifact-name: sphinx_docs
      artifact-path: ./das/sphinx_docs
      push: true
      workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
      service_account: ${{ vars.SERVICE_ACCOUNT }}

  test-1:
    needs: [config, build]
    uses: ./.github/workflows/_unit-tests.yml
    with:
      environment: ""
      image: "europe-west3-docker.pkg.dev/serca-artifact-registry/earthranger/das-server:${{ needs.config.outputs.image-tag }}"
      command: |
        pytest --reuse-db --junitxml=/testresults/junit/result_suite_one.xml --maxfail=15 accounts/tests mapping/tests reports/tests rt_api/tests tracking/tests
        pytest --reuse-db --junitxml=/testresults/junit/result_suite_three.xml --maxfail=15 analyzers/tests utils/tests
        pytest --reuse-db --junitxml=/testresults/junit/result_suite_four.xml --maxfail=15 choices/tests das_server/tests observations/tests buoy/tests core/tests schemas/tests

  test-2:
    needs: [config, build]
    uses: ./.github/workflows/_unit-tests.yml
    with:
      environment: ""
      image: "europe-west3-docker.pkg.dev/serca-artifact-registry/earthranger/das-server:${{ needs.config.outputs.image-tag }}"
      command: pytest --reuse-db --junitxml=/testresults/junit/result_suite_two.xml --maxfail=15 activity/tests sensors/tests revision/test

  deploy-dev:
    needs: [config, test-1, test-2]
    uses: PADAS/serca-pipelines/.github/workflows/_argocd-deploy.yml@main
    with:
      app-name: das-server
      app-subdir: earthranger
      environment: er-dev
      image-tag: ${{ needs.config.outputs.image-tag }}
    secrets:
      ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
      ARGOCD_APPS_SSH_KEY: ${{ secrets.ARGOCD_APPS_SSH_KEY }}
