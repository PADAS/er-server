name: Build das-server on Pull Request
on:
  pull_request:
    types:
      - labeled
      - synchronize
      - opened
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  id-token: write
  contents: read

jobs:
  create_tenant:
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'deploy')
    environment:
      name: ${{ github.head_ref }}
      url: "https://${{ github.head_ref }}.dev.pamdas.org"
    steps:
    - id: branch_name
      uses: ASzc/change-string-case-action@v6
      with:
        string: ${{ github.head_ref }}
    - name: Create tenant in TMS
      uses: fjogeleit/http-request-action@v1
      with:
        url: 'https://er-tms-api-gateway-5sf422kw.uc.gateway.dev/v1.0/tenants?key=${{ secrets.TMS_API_KEY }}'
        method: 'POST'
        customHeaders: '{"Content-Type": "application/json"}'
        ignoreStatusCodes: '409'
        timeout: 60000
        data: >
          {"clusterName": "er-dev",
          "clusterNamespace": "${{ steps.branch_name.outputs.lowercase }}",
          "domain": "${{ steps.branch_name.outputs.lowercase }}.dev.pamdas.org",
          "name": "${{ steps.branch_name.outputs.lowercase }}",
          "slugName": "${{ steps.branch_name.outputs.lowercase }}",
          "url": "https://${{ steps.branch_name.outputs.lowercase }}.dev.pamdas.org"}
    - name: AWS login
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-region: us-east-2
        role-to-assume: arn:aws:iam::074677080781:role/GithubOIDC-Role-CvNXPW1G39o4
    - name: create DNS record
      run: |
        aws route53 change-resource-record-sets \
        --hosted-zone-id Z06812903QMRULNOCKPL8 \
        --change-batch '{"Changes":[{"Action":"UPSERT","ResourceRecordSet":{"Name":"${{ steps.branch_name.outputs.lowercase }}.dev.pamdas.org.","Type":"A","TTL":300,"ResourceRecords":[{"Value":"34.102.221.194"}]}}]}'

  build_sphinx_docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Sphinx docs
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          uv sync --group docs
          cd docs
          uv run sphinx-build -b html . _build/html
      - name: Upload Sphinx docs
        uses: actions/upload-artifact@v4
        with:
          name: sphinx_docs
          path: docs/_build/html
  build:
    uses: PADAS/gundi-workflows/.github/workflows/build_docker.yml@v2
    needs: build_sphinx_docs
    with:
      environment: padas-app
      artifact-download: true
      artifact-name: sphinx_docs
      artifact-path: ./das/sphinx_docs
      repository: europe-west3-docker.pkg.dev/padas-app/er-mt/das-server
      tag: ${{ github.event.pull_request.head.sha }}
      dockerfile: circleci-docker/Dockerfile

  unit-test1:
    uses: ./.github/workflows/_unit-tests.yml
    needs: build
    with:
      image: "europe-west3-docker.pkg.dev/padas-app/er-mt/das-server:${{ github.event.pull_request.head.sha }}"
      command: |
        uv run pytest --reuse-db --junitxml=/testresults/junit/result_suite_one.xml --maxfail=15 accounts/tests mapping/tests reports/tests rt_api/tests tracking/tests
        uv run pytest --reuse-db --junitxml=/testresults/junit/result_suite_three.xml --maxfail=15 analyzers/tests utils/tests
        uv run pytest --reuse-db --junitxml=/testresults/junit/result_suite_four.xml --maxfail=15 choices/tests das_server/tests observations/tests core/tests schemas/tests

  unit-test2:
    uses: ./.github/workflows/_unit-tests.yml
    needs: build
    with:
      image: "europe-west3-docker.pkg.dev/padas-app/er-mt/das-server:${{ github.event.pull_request.head.sha }}"
      command: uv run pytest --reuse-db --junitxml=/testresults/junit/result_suite_two.xml --maxfail=15 activity/tests sensors/tests revision/test
