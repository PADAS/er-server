name: Build das-server on Pull Request

on:
  pull_request:
    types:
      - labeled
      - synchronize
      - opened

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  id-token: write
  pull-requests: write

jobs:
  create-tenant:
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'deploy')
    environment:
      name: ${{ github.head_ref }}
      url: "https://${{ github.head_ref }}.dev.pamdas.org"
    steps:
      - name: Branch name to lowercase
        id: branch_name
        uses: ASzc/change-string-case-action@v6
        with:
          string: ${{ github.head_ref }}

      - name: Create tenant in TMS
        uses: fjogeleit/http-request-action@v1
        with:
          url: 'https://er-tms-api-gateway-5sf422kw.uc.gateway.dev/v1.0/tenants?key=${{ secrets.TMS_API_KEY }}'
          method: 'POST'
          customHeaders: '{"Content-Type": "application/json"}'
          ignoreStatusCodes: '409'
          timeout: 60000
          data: >
            {"clusterName": "er-dev",
            "clusterNamespace": "${{ steps.branch_name.outputs.lowercase }}",
            "domain": "${{ steps.branch_name.outputs.lowercase }}.dev.pamdas.org",
            "name": "${{ steps.branch_name.outputs.lowercase }}",
            "slugName": "${{ steps.branch_name.outputs.lowercase }}",
            "url": "https://${{ steps.branch_name.outputs.lowercase }}.dev.pamdas.org"}

      - name: AWS login
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-2
          role-to-assume: arn:aws:iam::074677080781:role/GithubOIDC-Role-CvNXPW1G39o4

      - name: Create DNS record
        run: |
          aws route53 change-resource-record-sets \
            --hosted-zone-id Z06812903QMRULNOCKPL8 \
            --change-batch '{"Changes":[{"Action":"UPSERT","ResourceRecordSet":{"Name":"${{ steps.branch_name.outputs.lowercase }}.dev.pamdas.org.","Type":"A","TTL":300,"ResourceRecords":[{"Value":"34.102.221.194"}]}}]}'

  build_sphinx_docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Build Sphinx docs
        run: |
          cd docs
          uv venv --python=python3.12
          uv pip install -r requirements-docs.txt
          source .venv/bin/activate
          make html
      - name: Upload Sphinx docs
        uses: actions/upload-artifact@v4
        with:
          name: sphinx_docs
          path: docs/_build/html

  pipeline:
    needs: [build_sphinx_docs]
    uses: PADAS/serca-pipelines/.github/workflows/pipeline-kubernetes-pr.yml@main
    with:
      app-name: "das"
      argocd-app-name-template: "pr-das-{branch-slug}"
      repository: "europe-west3-docker.pkg.dev/serca-artifact-registry/earthranger/das-server"
      dockerfile: "Dockerfile.mt"
      build-args: "built_version=${{ github.event.pull_request.head.sha }}"
      base-image-registry: "europe-west3-docker.pkg.dev/serca-artifact-registry"
      artifact-download: true
      artifact-name: sphinx_docs
      artifact-path: ./das/sphinx_docs
      pr-env-url-template: "https://{branch-slug}.dev.pamdas.org"
      wait-timeout: 300
      max-wait-for-app: 180
    secrets: inherit

  unit-test:
    name: "unit-test (${{ matrix.suite }})"
    needs: [pipeline]
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: accounts/tests
            command: pytest --reuse-db --junitxml=/testresults/junit/result.xml --maxfail=15 accounts/tests
          - suite: mapping/tests
            command: pytest --reuse-db --junitxml=/testresults/junit/result.xml --maxfail=15 mapping/tests
          - suite: reports/tests
            command: pytest --reuse-db --junitxml=/testresults/junit/result.xml --maxfail=15 reports/tests
          - suite: rt_api/tests
            command: pytest --reuse-db --junitxml=/testresults/junit/result.xml --maxfail=15 rt_api/tests
          - suite: tracking/tests
            command: pytest --reuse-db --junitxml=/testresults/junit/result.xml --maxfail=15 tracking/tests
          - suite: activity/tests/events+models
            command: pytest --reuse-db --junitxml=/testresults/junit/result.xml --maxfail=15 activity/tests/events activity/tests/models
          - suite: activity/tests/schemas_v2
            command: pytest --reuse-db --junitxml=/testresults/junit/result.xml --maxfail=15 activity/tests/schemas_v2
          - suite: activity/tests
            command: pytest --reuse-db --junitxml=/testresults/junit/result.xml --maxfail=15 --ignore=activity/tests/events --ignore=activity/tests/schemas_v2 --ignore=activity/tests/models activity/tests
          - suite: sensors/tests
            command: pytest --reuse-db --junitxml=/testresults/junit/result.xml --maxfail=15 sensors/tests
          - suite: revision/test
            command: pytest --reuse-db --junitxml=/testresults/junit/result.xml --maxfail=15 revision/test
          - suite: analyzers/tests
            command: pytest --reuse-db --junitxml=/testresults/junit/result.xml --maxfail=15 analyzers/tests
          - suite: utils/tests
            command: pytest --reuse-db --junitxml=/testresults/junit/result.xml --maxfail=15 utils/tests
          - suite: choices/tests
            command: pytest --reuse-db --junitxml=/testresults/junit/result.xml --maxfail=15 choices/tests
          - suite: das_server/tests
            command: pytest --reuse-db --junitxml=/testresults/junit/result.xml --maxfail=15 das_server/tests
          - suite: observations/tests
            command: pytest --reuse-db --junitxml=/testresults/junit/result.xml --maxfail=15 observations/tests
          - suite: buoy/tests
            command: pytest --reuse-db --junitxml=/testresults/junit/result.xml --maxfail=15 buoy/tests
          - suite: core/tests
            command: pytest --reuse-db --junitxml=/testresults/junit/result.xml --maxfail=15 core/tests
          - suite: schemas/tests
            command: pytest --reuse-db --junitxml=/testresults/junit/result.xml --maxfail=15 schemas/tests
    uses: ./.github/workflows/_unit-tests.yml
    with:
      environment: ""
      image: "europe-west3-docker.pkg.dev/serca-artifact-registry/earthranger/das-server:pr-${{ github.event.pull_request.head.sha }}"
      command: ${{ matrix.command }}
      testdb-tag: testdb-develop-latest

  unit-test-gate:
    name: "unit-test-gate"
    needs: [unit-test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - run: |
          if [ "${{ needs.unit-test.result }}" != "success" ]; then
            echo "One or more unit-test matrix jobs failed"
            exit 1
          fi
