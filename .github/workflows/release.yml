name: Release Deploy das-server
on:
  push:
    branches:
      - 'release-**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.tag.outputs.value }}
      testdb-tag: ${{ steps.tag.outputs.testdb }}
    steps:
      - name: Generate image tag
        id: tag
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          BRANCH_SAFE=$(echo "${GITHUB_REF_NAME}" | tr '/' '-' | tr '[:upper:]' '[:lower:]')
          echo "value=${BRANCH_SAFE}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "testdb=testdb-${BRANCH_SAFE}-latest" >> "$GITHUB_OUTPUT"

  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build Sphinx docs
        run: |
          cd docs
          uv venv --python=python3.12
          uv pip install -r requirements-docs.txt
          source .venv/bin/activate
          make html
      - uses: actions/upload-artifact@v4
        with:
          name: sphinx_docs
          path: docs/_build/html

  build:
    needs: [config, build-docs]
    uses: PADAS/serca-pipelines/.github/workflows/_docker-build.yml@main
    with:
      repository: europe-west3-docker.pkg.dev/serca-artifact-registry/earthranger/das-server
      tag: ${{ needs.config.outputs.image-tag }}
      dockerfile: Dockerfile.mt
      artifact-download: true
      artifact-name: sphinx_docs
      artifact-path: ./das/sphinx_docs
      push: true
      workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}

  check-migrations:
    needs: [config]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: GCP Auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/563316706574/locations/global/workloadIdentityPools/github-actions/providers/github-oidc
      - id: check
        run: |
          BEFORE="${{ github.event.before }}"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || [ -z "$BEFORE" ]; then
            CHANGED=true
          elif git diff --name-only "$BEFORE" HEAD | grep -qE 'migrations/[^/]+\.py$'; then
            CHANGED=true
          else
            CHANGED=false
          fi
          if [ "$CHANGED" = "false" ]; then
            TESTDB_IMAGE="europe-west3-docker.pkg.dev/serca-artifact-registry/github-actions-cache/das-testdb:${{ needs.config.outputs.testdb-tag }}"
            if ! gcloud artifacts docker images describe "$TESTDB_IMAGE" >/dev/null; then
              echo "Testdb image $TESTDB_IMAGE not found in Artifact Registry, forcing rebuild"
              CHANGED=true
            fi
          fi
          echo "changed=$CHANGED" >> $GITHUB_OUTPUT

  build-testdb:
    needs: [config, build, check-migrations]
    if: needs.check-migrations.outputs.changed == 'true'
    uses: ./.github/workflows/_build-testdb.yml
    with:
      das-image: "europe-west3-docker.pkg.dev/serca-artifact-registry/earthranger/das-server:${{ needs.config.outputs.image-tag }}"
      testdb-tag: ${{ needs.config.outputs.testdb-tag }}

  unit-test:
    name: "unit-test (${{ matrix.suite }})"
    needs: [config, build, build-testdb]
    if: |
      always() &&
      needs.config.result == 'success' &&
      needs.build.result == 'success' &&
      (needs.build-testdb.result == 'success' || needs.build-testdb.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: accounts/tests
            command: pytest --reuse-db --junitxml=/testresults/junit/result.xml --maxfail=15 accounts/tests
          - suite: mapping/tests
            command: pytest --reuse-db --junitxml=/testresults/junit/result.xml --maxfail=15 mapping/tests
          - suite: reports/tests
            command: pytest --reuse-db --junitxml=/testresults/junit/result.xml --maxfail=15 reports/tests
          - suite: rt_api/tests
            command: pytest --reuse-db --junitxml=/testresults/junit/result.xml --maxfail=15 rt_api/tests
          - suite: tracking/tests
            command: pytest --reuse-db --junitxml=/testresults/junit/result.xml --maxfail=15 tracking/tests
          - suite: activity/tests/events+models
            command: pytest --reuse-db --junitxml=/testresults/junit/result.xml --maxfail=15 activity/tests/events activity/tests/models
          - suite: activity/tests/schemas_v2
            command: pytest --reuse-db --junitxml=/testresults/junit/result.xml --maxfail=15 activity/tests/schemas_v2
          - suite: activity/tests
            command: pytest --reuse-db --junitxml=/testresults/junit/result.xml --maxfail=15 --ignore=activity/tests/events --ignore=activity/tests/schemas_v2 --ignore=activity/tests/models activity/tests
          - suite: sensors/tests
            command: pytest --reuse-db --junitxml=/testresults/junit/result.xml --maxfail=15 sensors/tests
          - suite: revision/test
            command: pytest --reuse-db --junitxml=/testresults/junit/result.xml --maxfail=15 revision/test
          - suite: analyzers/tests
            command: pytest --reuse-db --junitxml=/testresults/junit/result.xml --maxfail=15 analyzers/tests
          - suite: utils/tests
            command: pytest --reuse-db --junitxml=/testresults/junit/result.xml --maxfail=15 utils/tests
          - suite: choices/tests
            command: pytest --reuse-db --junitxml=/testresults/junit/result.xml --maxfail=15 choices/tests
          - suite: das_server/tests
            command: pytest --reuse-db --junitxml=/testresults/junit/result.xml --maxfail=15 das_server/tests
          - suite: observations/tests
            command: pytest --reuse-db --junitxml=/testresults/junit/result.xml --maxfail=15 observations/tests
          - suite: buoy/tests
            command: pytest --reuse-db --junitxml=/testresults/junit/result.xml --maxfail=15 buoy/tests
          - suite: core/tests
            command: pytest --reuse-db --junitxml=/testresults/junit/result.xml --maxfail=15 core/tests
          - suite: schemas/tests
            command: pytest --reuse-db --junitxml=/testresults/junit/result.xml --maxfail=15 schemas/tests
    uses: ./.github/workflows/_unit-tests.yml
    with:
      environment: ""
      image: "europe-west3-docker.pkg.dev/serca-artifact-registry/earthranger/das-server:${{ needs.config.outputs.image-tag }}"
      command: ${{ matrix.command }}
      testdb-tag: ${{ needs.config.outputs.testdb-tag }}

  unit-test-gate:
    name: "unit-test-gate"
    needs: [unit-test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - run: |
          if [ "${{ needs.unit-test.result }}" != "success" ]; then
            echo "One or more unit-test matrix jobs failed"
            exit 1
          fi

  deploy-stage:
    needs: [config, unit-test-gate]
    if: |
      always() &&
      needs.config.result == 'success' &&
      needs.unit-test-gate.result == 'success'
    uses: PADAS/serca-pipelines/.github/workflows/_argocd-deploy.yml@main
    with:
      app-name: das-server
      app-subdir: earthranger
      environment: er-stage
      image-tag: ${{ needs.config.outputs.image-tag }}
    secrets:
      ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
      ARGOCD_APPS_SSH_KEY: ${{ secrets.ARGOCD_APPS_SSH_KEY }}

  approve-prod-me:
    needs: [deploy-stage]
    if: always() && needs.deploy-stage.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 4320
    environment: production-me
    steps:
      - run: echo "Production ME deployment approved"

  approve-prod-us:
    needs: [deploy-stage]
    if: always() && needs.deploy-stage.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 4320
    environment: production-us
    steps:
      - run: echo "Production US deployment approved"

  deploy-prod-me:
    needs: [config, approve-prod-me]
    if: |
      always() &&
      needs.config.result == 'success' &&
      needs.approve-prod-me.result == 'success'
    uses: PADAS/serca-pipelines/.github/workflows/_argocd-deploy.yml@main
    with:
      app-name: das-server
      app-subdir: earthranger
      environment: er-prod-me
      image-tag: ${{ needs.config.outputs.image-tag }}
    secrets:
      ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
      ARGOCD_APPS_SSH_KEY: ${{ secrets.ARGOCD_APPS_SSH_KEY }}

  deploy-prod-us:
    needs: [config, approve-prod-us]
    if: |
      always() &&
      needs.config.result == 'success' &&
      needs.approve-prod-us.result == 'success'
    uses: PADAS/serca-pipelines/.github/workflows/_argocd-deploy.yml@main
    with:
      app-name: das-server
      app-subdir: earthranger
      environment: er-prod-us
      image-tag: ${{ needs.config.outputs.image-tag }}
    secrets:
      ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
      ARGOCD_APPS_SSH_KEY: ${{ secrets.ARGOCD_APPS_SSH_KEY }}

  approve-prod:
    needs: [deploy-stage]
    if: always() && needs.deploy-stage.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 4320
    environment: production
    steps:
      - run: echo "Production EU deployment approved"

  deploy-prod:
    needs: [config, approve-prod]
    if: |
      always() &&
      needs.config.result == 'success' &&
      needs.approve-prod.result == 'success'
    uses: PADAS/serca-pipelines/.github/workflows/_argocd-deploy.yml@main
    with:
      app-name: das-server
      app-subdir: earthranger
      environment: er-prod
      image-tag: ${{ needs.config.outputs.image-tag }}
    secrets:
      ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
      ARGOCD_APPS_SSH_KEY: ${{ secrets.ARGOCD_APPS_SSH_KEY }}

  # Legacy kubectl deployments.
  # Constant infra (project_id, bastion_host/instance/zone) is defaulted in the
  # reusable workflow. Deployment set lives in the LEGACY_DEPLOYMENTS repo var.
  deploy-dev-legacy:
    needs: [config, deploy-stage]
    uses: PADAS/serca-pipelines/.github/workflows/_deploy_legacy_kubectl.yml@main
    with:
      environment: "legacy"
      image_repository: "europe-west3-docker.pkg.dev/serca-artifact-registry/earthranger/das-server"
      image_tag: ${{ needs.config.outputs.image-tag }}
      deployments: ${{ vars.LEGACY_DEPLOYMENTS }}
      cluster_name: "das-dev"
      cluster_zone: "us-west1-a"
      tenants: ${{ vars.LEGACY_TENANTS_DEV }}
      service_account: ${{ vars.LEGACY_DEPLOY_SERVICE_ACCOUNT }}

  # Split the single LEGACY_TENANTS_PROD list into parallel chunks.
  legacy-prod-split:
    needs: [config, deploy-dev-legacy]
    uses: PADAS/serca-pipelines/.github/workflows/_split-list.yml@main
    with:
      list: ${{ vars.LEGACY_TENANTS_PROD }}
      groups: 3

  deploy-prod-legacy:
    needs: [config, legacy-prod-split]
    strategy:
      max-parallel: 3
      fail-fast: false
      matrix:
        chunk: ${{ fromJson(needs.legacy-prod-split.outputs.chunks) }}
    uses: PADAS/serca-pipelines/.github/workflows/_deploy_legacy_kubectl.yml@main
    with:
      environment: "legacy"
      image_repository: "europe-west3-docker.pkg.dev/serca-artifact-registry/earthranger/das-server"
      image_tag: ${{ needs.config.outputs.image-tag }}
      deployments: ${{ vars.LEGACY_DEPLOYMENTS }}
      cluster_name: "das-prod1"
      cluster_zone: "europe-west3-a"
      tenants: ${{ matrix.chunk }}
      service_account: ${{ vars.LEGACY_DEPLOY_SERVICE_ACCOUNT }}
