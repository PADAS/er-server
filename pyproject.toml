[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "DAS"
dynamic = ["version"]
description = "Domain Awareness System, server"
requires-python = ">=3.10,<3.11"
readme = "readme.md"
authors = [
    { name="EarthRanger Developers", email="developers@earthranger.com" }
]
license = { file="LICENSE" }
dependencies = [
    "aiohttp==3.14.0",
    "arcgis==2.4.1.3",
    "arcgis2geojson",
    "async-lru==1.0.3",
    "auth0-python>=5.4.0,<6",
    "authlib>=1.6.12,<2",
    "bleach==6.2.0",
    "boto3",
    "business-rules==1.1.1",
    "celery==5.3.0",
    "celery-once==3.0.1",
    "cryptography==46.0.7",
    "cython==0.29.35",
    "dataclasses-json==0.6.7",
    "datadog==0.36.0",
    "django==4.2.30",
    "django-bitfield==2.2.0",
    "django-cors-headers==4.4.0",
    "django-debug-toolbar==4.3.0",
    "django-docs==0.3.3",
    "django-environ==0.11.2",
    "django-extensions==3.2.3",
    "django-fast-update==0.3.0",
    "django-filter==23.5",
    "django-leaflet==0.33.0",
    "django-model-utils==5.0.0",
    "django-mptt==0.16.0",
    "django-multitenant==4.1.1",
    "django-oauth-toolkit==2.3.0",
    "django-pgviews==0.6.0",
    "django-readonly-field==1.3.0",
    "django-redis==5.2.0",
    "django-rest-framework-condition==0.1.1",
    "django-sendsms==0.5",
    "django-ses==3.5.0",
    "django-storages[google]==1.14.6",
    "django-tagulous==2.1.1",
    "django-treebeard==4.7",
    "django-vectortiles>=1.0.2",
    "django-versatileimagefield==3.1",
    "djangorestframework==3.16.1",
    "djangorestframework-gis==1.2.0",
    "dnspython==2.8.0",
    "docxtpl==0.20.2",
    "drf-extensions==0.8.0",
    "drf-extra-fields==3.7.0",
    "drf-spectacular==0.28.0",
    "drf-spectacular-sidecar==2025.6.1",
    "event-type-schema-migration-tool==0.1.4.1",
    "eventlet==0.40.3",
    "fastkml[lxml]==1.3.0",
    "fonttools>=4.60.2",  # transitive via pillow 12.x; pinned here to prevent resolver from picking an incompatible version
    "gdal==3.12.3",
    "geojson==3.2.0",
    "geopandas==1.1.2",
    "geopy",
    "haversine==2.9.0",
    "gevent==25.9.1",
    "google-cloud-error-reporting==1.14.0",
    "google-cloud-pubsub==2.25.0",
    "greenlet==3.2.4",
    "gunicorn",
    "httplib2",
    "humanize",
    "jinja2",
    "joserfc>=1.6.3,<2",
    "jsonschema",
    "jsonschema-specifications==2023.12.1",
    "jupyterlab==4.5.7",
    "kombu",
    "lxml==6.1.0",
    "markupsafe==2.0.1",
    "nbconvert==7.17.1",
    "numpy>=1.26.4,<2",
    "oauth2client==4.1.3",
    "oauthlib",
    "openpyxl",
    "opentelemetry-exporter-gcp-monitoring",
    "opentelemetry-exporter-gcp-trace",
    "opentelemetry-instrumentation",
    "opentelemetry-instrumentation-celery",
    "opentelemetry-instrumentation-django",
    "opentelemetry-instrumentation-psycopg2",
    "opentelemetry-instrumentation-redis",
    "opentelemetry-instrumentation-requests",
    "opentelemetry-propagator-gcp",
    "opentelemetry-resourcedetector-gcp",
    "packaging>=22.0",
    "phonenumberslite==9.0.6",
    "piexif==1.1.3",
    "pillow==12.2.0",
    "protobuf==5.29.6",  # transitive via google-cloud-* packages; pinned to avoid incompatibility with grpcio/googleapis-common-protos
    "psycopg2",
    "pyasn1==0.6.3",  # transitive via oauth2client/rsa; pinned to avoid version conflicts with pyasn1-modules
    "pycryptodome",
    "pygeoif",
    "pygments",
    "pymet==0.1.26",
    "pyproj==3.7.0",
    "python-dateutil==2.8.2",
    "python-docx==0.8.11",
    "python-engineio",
    "python-json-logger==2.0.7",
    "python-socketio",
    "pyyaml==6.0",
    "rasterio==1.4.4",
    "redis==4.5.5",
    "requests==2.33.0",
    "rsa",
    "shapely==2.1.2",
    "simplejson==3.20.2",
    "simplekml",
    "twilio",
    "urllib3==2.7.0",
    "wheel==0.46.2",  # needed at runtime to install local .whl dependencies (e.g. pymet wheelhouse)
    "whitenoise==6.11.0",
    "xmltodict==0.13.0",
]
keywords = ["django", "python", "gis", "rest", "api"]
classifiers = [
    "Framework :: Django",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Internet",
    "Programming Language :: Python :: 3.10"
]


[tool]
[tool.black]
line-length = 120
target-version = ['py310']
include = '\.pyi?$'

[tool.pylint]
[tool.pylint.master]
fail-under = 10

[tool.pylint.messages_control]
max-line-length = 120
disable = ["missing-docstring"]

[tool.pylint.format]
max-module-lines = 1000
max-line-length = 120

[tool.pylint.design]
max-args = 5
max-locals = 15
max-returns = 6
max-branches = 12
max-statements = 50
max-parents = 7
max-attributes = 7
min-public-methods = 2
max-public-methods = 20

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
explicit = true

[tool.uv.sources]
pymet = { path = "dependencies/wheelhouse/pymet-0.1.26-py3-none-any.whl" }
event-type-schema-migration-tool = { index = "testpypi" }

[tool.setuptools]
packages = ["das"]

[tool.setuptools.dynamic]
version = {attr = "das._version.__version__"}

[dependency-groups]
dev = [
    "autoflake",
    "autopep8",
    "black",
    "coverage",
    "django-fakeredis",
    "django-silk",
    "django-stubs>=6.0.2",
    "factory-boy",
    "faker",
    "flake8",
    "isort",
    "mimesis",
    "mockredispy",
    "pep8",
    "pip-tools",
    "pre-commit",
    "ptvsd",
    "pycodestyle",
    "pylint",
    "pylint-django",
    "pytest",
    "pytest-clarity",
    "pytest-cov",
    "pytest-django",
    "pytest-factoryboy",
    "pytest-xdist",
    "requests-mock",
    "sort-requirements",
    "types-jsonschema>=4.26.0.20260408",
    "xmlunittest",
]

[tool.pyright]
extraPaths = ["das"]
reportFunctionMemberAccess = false
reportAttributeAccessIssue = false

[tool.pyrefly]
search_path = ["das"]

[tool.uv]
no-build-isolation-package = ["rasterio"]
