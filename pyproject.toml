keywords = ["django", "python", "gis", "rest", "api"]
classifiers = [
    "Framework :: Django",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Internet",
    "Programming Language :: Python :: 3.8"
]


[tool]
[tool.black]
line-length = 120
target-version = ['py38']
include = '\.pyi?$'

[tool.pylint]
[tool.pylint.master]
fail-under = 10

[tool.pylint.messages_control]
max-line-length = 120
disable = ["missing-docstring"]

[tool.pylint.format]
max-module-lines = 1000
max-line-length = 120

[tool.pylint.design]
max-args = 5
max-locals = 15
max-returns = 6
max-branches = 12
max-statements = 50
max-parents = 7
max-attributes = 7
min-public-methods = 2
max-public-methods = 20

[tool.uv.sources]
pymet = { path = "dependencies/wheelhouse/pymet-0.1.26-py3-none-any.whl" }

[dependency-groups]
dev = [
    "autoflake",
    "autopep8",
    "black",
    "coverage",
    "django-fakeredis",
    "django-silk",
    "factory-boy",
    "faker",
    "flake8",
    "isort",
    "mimesis",
    "mockredispy",
    "pep8",
    "pip-tools",
    "pre-commit",
    "ptvsd",
    "pycodestyle",
    "pylint",
    "pylint-django",
    "pytest",
    "pytest-clarity",
    "pytest-cov",
    "pytest-django",
    "pytest-factoryboy",
    "pytest-xdist",
    "requests-mock",
    "sort-requirements",
    "xmlunittest",
]
docs = [
    "docutils==0.21.2",
    "pygments-json==0.1",
    "recommonmark==0.7.1",
    "jinja2==3.1.5",
    "sphinxcontrib-httpdomain==1.8.1",
