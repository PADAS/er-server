[pytest]
django_find_project = false
python_files = tests.py test_*.py tests_*.py *_tests.py
DJANGO_SETTINGS_MODULE = test_scripts.unittest_settings
pythonpath = ./das
#testpaths = ./tests ./das
testpaths = ./das
addopts = --reuse-db
norecursedirs = www*

# xunit2 it the new output format, see if our tools support it, otherwise use legacy
junit_family = xunit2
#junit_family=legacy

# Custom markers (run with: pytest -m perf)
markers =
    perf: vector tile speed/reliability tests (excluded from default run; use pytest -m perf)
