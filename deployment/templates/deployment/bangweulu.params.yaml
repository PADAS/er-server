  storage-account-key: "${bangweulu_storage_account_primary_access_key_vault_path}"
  alerts-slack-url: padas-app/main/slack-webhook-url-alertmanager
  email-password: padas-app/main/email-password
  bundle-crt: padas-app/main/bundle-crt
  pamdas-org-ssl-key: padas-app/main/pamdas-org-ssl-key
  pamdas-org-ssl-cert: padas-app/main/pamdas-org-ssl-cert
  pamdas-org-ssl-ca: padas-app/main/pamdas-org-ssl-ca
  
