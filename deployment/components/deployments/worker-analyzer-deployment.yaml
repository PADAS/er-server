apiVersion: apps/v1beta1
kind: Deployment
metadata:
  name: worker-analyzer
spec:
  template:
    metadata:
      labels:
        das.component: worker-analyzer
    spec:
      imagePullSecrets:
        - name: gcr-secret
      containers:
      - image: gcr.io/padas-app/worker-analyzer:<<git-server-version>>
        name: das-worker-analyzer
        resources:
          requests:
            cpu: "100m"
        env:
        - name: API_HOST
          valueFrom:
            configMapKeyRef:
              name: default-configmap
              key: API_HOST
        - name: API_PORT
          valueFrom:
            configMapKeyRef:
              name: default-configmap
              key: API_PORT
