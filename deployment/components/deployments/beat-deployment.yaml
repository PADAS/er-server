apiVersion: apps/v1beta1
kind: Deployment
metadata:
  namespace: <<namespace>>
  name: beat
spec:
  template:
    metadata:
      labels:
        das.component: beat
      annotations:
        prometheus.io/port: "9102"
    spec:
      imagePullSecrets:
        - name: gcr-secret
      containers:
      - image: gcr.io/padas-app/beat:<<server-version>>
        name: das-beat
        resources:
          requests:
            cpu: "25m"
          limits:
            cpu: "50m"
        env:
        - name: API_HOST
          valueFrom:
            configMapKeyRef:
              name: default-configmap
              key: API_HOST
        - name: API_PORT
          valueFrom:
            configMapKeyRef:
              name: default-configmap
              key: API_PORT
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: site-configmap
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: site-configmap
              key: DB_PORT
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: site-configmap
              key: DB_NAME
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: site-configmap
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            configMapKeyRef:
              name: site-configmap
              key: DB_PASSWORD
        - name: USE_AZURE_STORAGE
          valueFrom:
            configMapKeyRef:
              name: site-configmap
              key: USE_AZURE_STORAGE
        - name: STORAGE_ACCOUNT
          valueFrom:
            configMapKeyRef:
              name: site-configmap
              key: STORAGE_ACCOUNT
        - name: STORAGE_ACCOUNT_KEY
          valueFrom:
            configMapKeyRef:
              name: site-configmap
              key: STORAGE_ACCOUNT_KEY
        - name: STORAGE_CONTAINER
          valueFrom:
            configMapKeyRef:
              name: site-configmap
              key: STORAGE_CONTAINER
        - name: CONFIG_ACCOUNT
          valueFrom:
            configMapKeyRef:
              name: site-configmap
              key: CONFIG_ACCOUNT
        - name: CONFIG_ACCOUNT_KEY
          valueFrom:
            configMapKeyRef:
              name: site-configmap
              key: CONFIG_ACCOUNT_KEY
        - name: CONFIG_CONTAINER
          valueFrom:
            configMapKeyRef:
              name: site-configmap
              key: CONFIG_CONTAINER
        - name: EMAIL_PASSWORD
          valueFrom:
            configMapKeyRef:
              name: default-configmap
              key: EMAIL_PASSWORD
      - image: prom/statsd-exporter:v0.8.1
        name: statsd-exporter
        args: ["--statsd.listen-udp=127.0.0.1:8125"]
        ports:
        - containerPort: 9102