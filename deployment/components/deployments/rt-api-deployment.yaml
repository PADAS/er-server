apiVersion: apps/v1beta1
kind: Deployment
metadata:
  name: rt-api
spec:
  template:
    metadata:
      labels:
        das.component: rt-api
      annotations:
        prometheus.io/scrape: 'false'
    spec:
      imagePullSecrets:
        - name: gcr-secret
      containers:
      - image: gcr.io/padas-app/rt_api:<<server-version>>
        name: das-rt-api
        resources:
          requests:
            cpu: "100m"
            memory: "500Mi"
        ports:
          - containerPort: 8000
        env:
        - name: API_HOST
          valueFrom:
            configMapKeyRef:
              name: default-configmap
              key: API_HOST
        - name: API_PORT
          valueFrom:
            configMapKeyRef:
              name: default-configmap
              key: API_PORT
