apiVersion: extensions/v1beta1
kind: DaemonSet
metadata:
  labels:
    name: elasticsearch-ds
  name: elasticsearch-ds
spec:
  selector:
    matchLabels:
      name: elasticsearch-ds
  template:
    metadata:
      labels:
        name: elasticsearch-ds
    spec:
      containers:
      - name: elasticsearch-ds
        image: gcr.io/google-containers/startup-script:v1
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
        env:
        - name: STARTUP_SCRIPT
          value: |
            #! /bin/bash
            sysctl -w vm.max_map_count=262144
            echo "done"
        resources:
          requests:
            cpu: "5m"