apiVersion: v1
kind: ConfigMap
metadata:
  namespace: <<namespace>>
  name: default-configmap
data:
  APIENDPOINT: localhost
  DB_HOST: postgis.<<namespace>>.svc.cluster.local
  DB_PORT: "5432"
  API_HOST: api
  API_PORT: "8000"
  EMAIL_PASSWORD: <<email-password>>
  EMAIL_HOST_USER: <<email-username>>
  EMAIL_HOST: <<email-host>>
  DEFAULT_FROM_EMAIL: <<email-default-from>>
  FROM_EMAIL: <<email-from>>
  WEB_SERVICE_NAME: <<web-service-name>>
  BUNDLE_CRT: "<<bundle-crt>>"
  PAMDAS_ORG_PRIVATE_KEY_PEM: "<<pamdas-org-ssl-key>>"
