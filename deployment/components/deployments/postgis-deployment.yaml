apiVersion: apps/v1beta1
kind: StatefulSet
metadata:
  name: postgis
spec:
  serviceName: "postgis"
  replicas: 1
  template:
    metadata:
      labels:
        das.component: postgis
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port:   '9100'
    spec:
      imagePullSecrets:
        - name: gcr-secret
      containers:
      - image: gcr.io/padas-app/postgis:<<git-utility-version>>
        name: das-postgis
        resources:
          requests:
            cpu: "150m"
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: pgdata
      - image: prom/node-exporter:<<node-exporter-version>>
        name: disk-exporter
        resources:
          requests:
            cpu: "25m"
          limits:
            cpu: "500m"
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: pgdata
        ports:
        - containerPort: 9100
  volumeClaimTemplates:
  - metadata:
      name: pgdata
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "azure"
      resources:
        requests:
          storage: 50Gi
      selector:
        matchLabels:
          das.component: postgis
