apiVersion: "v1"
kind: "PersistentVolume"
metadata:
  annotations:
      volume.beta.kubernetes.io/mount-options: "discard"
  name: alertmanager
  labels:
    component: alertmanager
spec:
  capacity:
    storage: "20Gi"
  accessModes:
    - "ReadWriteOnce"
  persistentVolumeReclaimPolicy: Retain
  storageClassName: "ssd"
  gcePersistentDisk:
    fsType: "ext4"
    pdName: "<<cluster-name>>-alertmanager-0"
