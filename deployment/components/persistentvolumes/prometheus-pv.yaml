apiVersion: "v1"
kind: "PersistentVolume"
metadata:
  annotations:
      volume.beta.kubernetes.io/mount-options: "discard"
  name: prometheus
  labels:
    component: prometheus
spec:
  capacity:
    storage: "30Gi"
  accessModes:
    - "ReadWriteOnce"
  persistentVolumeReclaimPolicy: Retain
  storageClassName: <<persistentvolume-storage-class>>
  azureDisk:
    kind: Managed
    diskURI: "/subscriptions/<<azure-subscription-id>>/resourceGroups/<<iaas-workspace>>/providers/Microsoft.Compute/disks/<<disk-namespace>>-prometheus-0"
    diskName: "<<cluster-name>>-prometheus-0"
  gcePersistentDisk:
    fsType: "ext4"
    pdName: "<<cluster-name>>-prometheus-0"