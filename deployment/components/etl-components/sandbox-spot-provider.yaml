apiVersion: batch/v1beta1
kind: CronJob
metadata:
  namespace: <<namespace>>
  name: sandbox-spot-provider-etl
spec:
  schedule: "*/20 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          imagePullSecrets:
          - name: gcr-secret
          containers:
          - name: skyline-provider-etl
            image: gcr.io/padas-app/etl/skyline-provider:latest
            env:
            - name: DAS_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: etl-configmap
                  key: SANDBOX_DAS_SENSOR_ENDPOINT
            - name: DAS_TOKEN
              valueFrom:
                configMapKeyRef:
                  name: etl-configmap
                  key: SPOT_PROVIDER_DAS_TOKEN
            - name: SOURCE_GROUP
              valueFrom:
                configMapKeyRef:
                  name: etl-configmap
                  key: SOURCE_GROUP
          restartPolicy: Never
