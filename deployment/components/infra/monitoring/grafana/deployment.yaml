apiVersion: apps/v1beta1
kind: Deployment
metadata:
  namespace: <<infra-namespace>>
  name: grafana
spec:
  template:
    metadata:
      labels:
        component: grafana
    spec:
      imagePullSecrets:
        - name: infra-secret
      containers:
      - image: gcr.io/ss-infrastructure/baseimages/monitoring/grafana:<<monitoring-version>>
        name: grafana
        resources:
          requests:
            cpu: "20m"
        env:
        - name: PROMETHEUS_URL
          value: http://prometheus:9090
        volumeMounts:
        - mountPath: /var/lib/grafana/dashboards/custom
          name: custom-dashboards
      volumes:
      - name: custom-dashboards
        configMap:
          name: grafana-configmap
