apiVersion: extensions/v1beta1
kind: Deployment
metadata:
  name: logstash
spec:
  template:
    metadata:
      labels:
        app: logstash
    spec:
      containers:
      - image: docker.elastic.co/logstash/logstash:6.3.1
        name: logstash
        ports:
        - name: k8s-pods
          containerPort: 5044
          protocol: TCP
        volumeMounts:
        - name: pipelines
          mountPath: /usr/share/logstash/pipelines
          readOnly: true
        - name: config
          mountPath: /usr/share/logstash/config/pipelines.yml
          subPath: pipelines.yml
        resources:
          requests:
            memory: 1Gi
            cpu: "50m"
        args:
        - --config.reload.automatic
      volumes:
      - name: pipelines
        configMap:
          name: logstash
      - name: config
        configMap:
          name: logstash
          items:
          - key: pipelines.yml
            path: pipelines.yml
