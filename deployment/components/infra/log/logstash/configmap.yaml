apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash
data:
  pipelines.yml: |-
    - pipeline.id: "das"
      path.config: "/usr/share/logstash/pipelines/das-log-pipeline.yml"
  das-log-pipeline.yml: |-
    input {
      http {
        port => 5044
        ssl => true
        ssl_certificate_authorities => ["/usr/share/logstash/pipelines/ca.pem"]
        ssl_certificate => "/usr/share/logstash/pipelines/ssl.pem"
        ssl_key => "/usr/share/logstash/pipelines/ssl.key"
        ssl_verify_mode => "forced_peer"
      }
    }
    output {
      elasticsearch {
        hosts => "elasticsearch:9200"
        index => "das-%{+YYYY.MM.dd}"
        sniffing => false
      }
    }
  ssl.pem: <<pamdas-org-ssl-cert>>
  ssl.key: <<pamdas-org-ssl-key>>
  ca.pem: <<pamdas-org-ssl-ca>>
