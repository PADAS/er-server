apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash
data:
  pipelines.yml: |-
    - pipeline.id: "das"
      path.config: "/usr/share/logstash/pipelines/das-log-pipeline.yml"
  das-log-pipeline.yml: |-
    input {
      beats {
        port => 5044
      }
    }
    output {
      elasticsearch {
        hosts => "elasticsearch:9200"
        index => "das-%{+YYYY.MM.dd}"
        sniffing => false
      }
    }
