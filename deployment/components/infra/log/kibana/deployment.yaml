apiVersion: apps/v1beta1
kind: Deployment
metadata:
  name: kibana
spec:
  template:
    metadata:
      labels:
        component: kibana
    spec:
      imagePullSecrets:
        - name: infra-secret
      containers:
      - image: gcr.io/ss-infrastructure/services/kibana:0.0.2
        name: kibana
        ports:
          - containerPort: 5601
        env:
        - name: SERVER_HOST
          value: "0.0.0.0"
        - name: ELASTICSEARCH_URL
          value: http://elasticsearch:9200
        - name: INDEX_PATTERNS
          value: "das:das*"
        - name: DEFAULT_INDEX_PATTERN
          value: das 
        resources:
          requests:
            cpu: 50m
