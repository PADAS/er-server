kind: ConfigMap
apiVersion: v1
metadata:
  name: log-ingress-configuration
  labels:
    app.kubernetes.io/name: log-ingress
    app.kubernetes.io/part-of: log-ingress

---
kind: ConfigMap
apiVersion: v1
metadata:
  name: log-ingress-tcp-services
  labels:
    app.kubernetes.io/name: log-ingress
    app.kubernetes.io/part-of: log-ingress
data:
  5044: "default/logstash:5044"
  9200: "default/elasticsearch:9200"
  5601: "default/kibana:5601"

---
kind: ConfigMap
apiVersion: v1
metadata:
  name: log-ingress-udp-services
  labels:
    app.kubernetes.io/name: log-ingress
    app.kubernetes.io/part-of: log-ingress

---
kind: Service
apiVersion: v1
metadata:
  name: log-ingress
  labels:
    app.kubernetes.io/name: log-ingress
    app.kubernetes.io/part-of: log-ingress
spec:
  type: LoadBalancer
  loadBalancerIP: <<logging-static-ip>>
  selector:
    app.kubernetes.io/name: log-ingress
    app.kubernetes.io/part-of: log-ingress
  ports:
    - name: kibana
      port: 5601
      targetPort: 5601
    - name: logstash
      port: 5044
      targetPort: 5044
    - name: elasticsearch
      port: 9200
      targetPort: 9200

---
apiVersion: extensions/v1beta1
kind: Deployment
metadata:
  name: log-ingress-controller
  labels:
    app.kubernetes.io/name: log-ingress
    app.kubernetes.io/part-of: log-ingress
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: log-ingress
      app.kubernetes.io/part-of: log-ingress
  template:
    metadata:
      labels:
        app.kubernetes.io/name: log-ingress
        app.kubernetes.io/part-of: log-ingress
      annotations:
        prometheus.io/port: "10254"
        prometheus.io/scrape: "true"
    spec:
      containers:
        - name: log-ingress-controller
          image: quay.io/kubernetes-ingress-controller/nginx-ingress-controller:0.20.0
          args:
            - /nginx-ingress-controller
            - --configmap=$(POD_NAMESPACE)/log-ingress-configuration
            - --tcp-services-configmap=$(POD_NAMESPACE)/log-ingress-tcp-services
            - --udp-services-configmap=$(POD_NAMESPACE)/log-ingress-udp-services
            - --publish-service=$(POD_NAMESPACE)/log-ingress
            - --annotations-prefix=nginx.ingress.kubernetes.io
            - --ingress-class=nginx-log-ingress
          securityContext:
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
            runAsUser: 33
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: metrics
              containerPort: 10254
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: 10254
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: 10254
              scheme: HTTP
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1

