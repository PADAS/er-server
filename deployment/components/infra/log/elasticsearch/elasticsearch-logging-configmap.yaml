apiVersion: "v1"
kind: "ConfigMap"
metadata:
  name: "elasticsearch-logging-configmap"
  namespace: "<<namespace>>"
data:
# quay.io/pires/docker-elasticsearch-kubernetes presents challenges. This file is copied during container startup. Therefore, any changes below will not be reflected in running containers. To make a change, the containers must be bounced.
  log4j2.properties: |-
    status = error

    appender.console.type = Console
    appender.console.name = console
    appender.console.layout.type = PatternLayout
    appender.console.layout.pattern = [%d{ISO8601}][%-5p][%-25c{1.}] %marker%m%n

    rootLogger.level = warn
    rootLogger.appenderRef.console.ref = console
