kind: "PersistentVolumeClaim"
apiVersion: "v1"
metadata:
  name: "elasticsearch-data-elasticsearch-data-0"
  namespace: "<<namespace>>"
spec:
  accessModes:
    - "ReadWriteOnce"
  resources:
    requests:
      storage: "100Gi"
  storageClassName: "ssd"
  selector:
    matchLabels:
      component: "<<namespace>>-elasticsearch-data-0"
---
