apiVersion: v1
kind: Service
metadata:
  namespace: <<namespace>>
  name: elasticsearch-master
  labels:
    app: elasticsearch-master
    role: master
spec:
  ports:
  - port: 9300
    name: transport
  clusterIP: None
  selector:
    app: elasticsearch-master
    role: master
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  namespace: <<namespace>>
  name: elasticsearch-master
  labels:
    app: elasticsearch-master
    role: master
spec:
  serviceName: elasticsearch-master
  replicas: 3
  selector:
    matchLabels:
      app: elasticsearch-master
  template:
    metadata:
      labels:
        app: elasticsearch-master
        role: master
    spec:
      initContainers:
      - name: init-sysctl
        image: busybox:1.27.2
        command:
        - sysctl
        - -w
        - vm.max_map_count=262144
        securityContext:
          privileged: true
      containers:
      - name: elasticsearch-master
        command:
        - "/bin/sh"
        args:
        - "-c"
        - "cp /tmp/elasticsearch/log4j2.properties /elasticsearch/config/log4j2.properties && chown elasticsearch:elasticsearch /elasticsearch/config/log4j2.properties && /run.sh"
        securityContext:
          privileged: true
          capabilities:
            add:
              - IPC_LOCK
        image: quay.io/pires/docker-elasticsearch-kubernetes:6.3.2
        imagePullPolicy: "IfNotPresent"
        env:
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: DISCOVERY_SERVICE
          value: elasticsearch-master
        - name: "CLUSTER_NAME"
          value: "es-cluster"
        - name: "NUMBER_OF_MASTERS"
          value: "2"
        - name: NODE_MASTER
          value: "true"
        - name: NODE_INGEST
          value: "false"
        - name: NODE_DATA
          value: "false"
        - name: HTTP_ENABLE
          value: "false"
        - name: "ES_JAVA_OPTS"
          value: "-Xms512m -Xmx512m"
        resources:
          requests:
            memory: 1024Mi
        ports:
        - containerPort: 9300
          name: transport
          protocol: TCP
        volumeMounts:
        - name: elasticsearch-master
          mountPath: /data
        - name: "log4j-properties"
          mountPath: "/tmp/elasticsearch"
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - elasticsearch-master
            topologyKey: kubernetes.io/hostname
      volumes:
        - name: "log4j-properties"
          configMap:
            name: "elasticsearch-logging-configmap"
  volumeClaimTemplates:
  - metadata:
      name: elasticsearch-master
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "ssd"
      resources:
        requests:
          storage: 10Gi
      selector:
        matchLabels:
          component: null
