apiVersion: "v1"
kind: "PersistentVolume"
metadata:
  annotations:
      volume.beta.kubernetes.io/mount-options: "discard"
  name: postgis
  labels:
    das.component: postgis
spec:
  capacity:
    storage: "50Gi"
  accessModes:
    - "ReadWriteOnce"
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ssd
  gcePersistentDisk:
    fsType: "ext4"
    pdName: "${DISK_NAMESPACE}-postgres-0"