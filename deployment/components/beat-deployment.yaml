apiVersion: apps/v1beta1
kind: Deployment
metadata:
  name: beat
spec:
  template:
    metadata:
      labels:
        das.component: beat
    spec:
      imagePullSecrets:
        - name: gcr-secret
      containers:
      - image: gcr.io/padas-app/beat:<<git-server-version>>
        name: das-beat
        resources:
          requests:
            cpu: "25m"
        env:
        - name: API_HOST
          valueFrom:
            configMapKeyRef:
              name: default-configmap
              key: API_HOST
        - name: API_PORT
          valueFrom:
            configMapKeyRef:
              name: default-configmap
              key: API_PORT
