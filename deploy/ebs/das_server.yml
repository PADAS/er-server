# See ebs-deploy https://github.com/briandilley/ebs-deploy
# aws account config
aws:
    # override environment variables here
    region: 'us-west-2'
    bucket: 'das-builds'
    bucket_path: 'das_server'

# application configuration
app:
    versions_to_keep: 10 # the number of unused application versions to keep around
    app_name: 'DAS Server' # the name of your application
    description: 'Domain Awareness System' # description of your app

    all_environments:
        solution_stack_name: '64bit Amazon Linux 2015.09 v2.0.8 running Python 3.4'

        # optional information on the tier type
        # check the boto documentation for create_environment
        # for an explanation on the default values.  Most
        # configurations don't need to specify these values
        # at all.
        # Boto: http://docs.pythonboto.org/en/latest/ref/beanstalk.html
        tier_name: 'WebServer'
        tier_type: 'Standard'
        tier_version: '1.0'

        # option_settings contain namespaced key\value pairs that are
        # supported by Beanstalk, follows is an example of some of
        # the values that you might want to set for a python application
        option_settings:
            'aws:elasticbeanstalk:container:python:staticfiles':
                "/static": "/opt/python/current/app/das/www/static"
                "/assets": "/opt/python/current/app/das/www/assets"
                "/app": "/opt/python/current/app/das/www/app"
                "/bower_components": "/opt/python/current/app/das/www/bower_components"
                "/index.html": "/opt/python/current/app/das/www/index.html"
                "/login": "/opt/python/current/app/das/www/index.html"
                "/logout": "/opt/python/current/app/das/www/index.html"
                "/page-speed": "/opt/python/current/app/das/www/index.html"
                "/qa": "/opt/python/current/app/das/www/index.html"
                "/robots.txt": "/opt/python/current/app/das/www/robots.txt"
                "/favicon.ico": "/opt/python/current/app/das/www/favicon.ico"
                "/docs": "/opt/python/current/app/das/docs"


            'aws:autoscaling:launchconfiguration':
              InstanceType: "t2.micro"
              #InstanceType: "m4.large"
              IamInstanceProfile: "arn:aws:iam::074677080781:instance-profile/das_server-dev"
              EC2KeyName: "das-dev"
              SecurityGroups: "sg-e0cf3284,sg-304ee854"
              ImageId: "ami-9fbd53ff"
              #ImageId: "ami-21637d11" - amazon eb

            'aws:autoscaling:asg':
                MinSize: 1
                MaxSize: 1

            'aws:elasticbeanstalk:environment':
              EnvironmentType: "LoadBalanced"

            'aws:elasticbeanstalk:application':
                Application Healthcheck URL: '/api/v1.0/status'

            'aws:elasticbeanstalk:application:environment':
              DJANGO_SETTINGS_MODULE: "das_server.local_settings"
              PYTHONPATH: "/opt/python/current/app/das:$PYTHONPATH"

            'aws:elasticbeanstalk:container:python':
                WSGIPath: 'das/das_server/wsgi.py'
                NumProcesses: 1
                NumThreads: 15

            'aws:ec2:vpc':
              VPCId: "vpc-e774e482"
              Subnets: "subnet-11bf3166,subnet-6910780c,subnet-0074d659"
              AssociatePublicIpAddress: "true"

            # need this to support websockets over 80 and 443 through an ELB
            'aws:elb:listener:80':
                ListenerProtocol: TCP
                InstancePort: 80
                InstanceProtocol: TCP

            'aws:elb:listener:443':
                ListenerProtocol: SSL
                SSLCertificateId: 'arn:aws:iam::074677080781:server-certificate/wildcard-pamdas-org-2015'
                InstancePort: 80
                InstanceProtocol: TCP

            'aws:elb:policies':
                Stickiness Policy: false

            #'aws:elb:policies:EnableProxyProtocol':
            #    ProxyProtocol: true
            #    InstancePorts: 80, 443



        # instructions on how to build the application archive
        archive:
            includes: # files to include, a list of regex
              - '^das\/.*'
              #- '^wheelhouse\/.*'
              - '^requirements\.txt$'
            excludes: # files to exclude, a list of regex
                - '^.gitignore$'
                - '^\.git*'
                - '.*\.egg-info$'
                - '^tests.*'
                - '.*\.zip$'
                - '^venv.*'
                - '.*\.pyc$'
            files:
              - deflate.conf:
                    # permissions of the file
                    permissions: 0644
                    # the content node is important here
                    content: |
                        # mod_deflate configuration
                        <IfModule mod_deflate.c>
                          # Restrict compression to these MIME types
                          AddOutputFilterByType DEFLATE text/plain
                          AddOutputFilterByType DEFLATE text/html
                          AddOutputFilterByType DEFLATE application/xhtml+xml
                          AddOutputFilterByType DEFLATE text/xml
                          AddOutputFilterByType DEFLATE application/xml
                          AddOutputFilterByType DEFLATE application/xml+rss
                          AddOutputFilterByType DEFLATE application/x-javascript
                          AddOutputFilterByType DEFLATE text/javascript
                          AddOutputFilterByType DEFLATE text/css
                          # Level of compression (Highest 9 - Lowest 1)
                          DeflateCompressionLevel 9
                          # Netscape 4.x has some problems.
                          BrowserMatch ^Mozilla/4 gzip-only-text/html
                          # Netscape 4.06-4.08 have some more problems
                          BrowserMatch ^Mozilla/4\.0[678] no-gzip
                          # MSIE masquerades as Netscape, but it is fine
                          BrowserMatch \bMSI[E] !no-gzip !gzip-only-text/html
                        <IfModule mod_headers.c>
                          # Make sure proxies don't deliver the wrong content
                          Header append Vary User-Agent env=!dont-vary
                        </IfModule>
                        </IfModule>

              - celeryconfig.conf:
                    permissions: 0644
                    content: |
                        [program:celeryworker]
                        command=/opt/python/run/venv/bin/celery worker -A das_server -l info -c 4 -P gevent
                        directory=/opt/python/current/app/das
                        environment=DJANGO_SETTINGS_MODULE='das_server.local_settings',PYTHONPATH='/opt/python/current/app/das:$PYTHONPATH'
                        user=wsgi
                        numprocs=1
                        stdout_logfile=/opt/python/log/celery_worker.log
                        stderr_logfile=/opt/python/log/celery_worker_stderr.log
                        redirect_stderr=true
                        autostart=true
                        autorestart=true
                        startsecs=10
                        priority=20
                        killasgroup=true

                        [program:celerybeat]
                        command=/opt/python/run/venv/bin/celery beat -A das_server -l info --schedule=/tmp/das-celery-schedule.db
                        directory=/opt/python/current/app/das
                        environment=DJANGO_SETTINGS_MODULE='das_server.local_settings',PYTHONPATH='/opt/python/current/app/das:$PYTHONPATH'
                        user=wsgi
                        numprocs=1
                        stdout_logfile=/opt/python/log/celery_beat.log
                        stderr_logfile=/opt/python/log/celery_beat_stderr.log
                        redirect_stderr=true
                        autostart=true
                        autorestart=true
                        startsecs=10
                        priority=20
                        killasgroup=true

                        [program:message_queue_listeners]
                        command=/opt/python/run/venv/bin/python manage.py message_queue_listeners
                        directory=/opt/python/current/app/das
                        environment=DJANGO_SETTINGS_MODULE='das_server.local_settings',PYTHONPATH='/opt/python/current/app/das:$PYTHONPATH'
                        user=wsgi
                        numprocs=1
                        stdout_logfile=/opt/python/log/message_queue_listeners.log
                        stderr_logfile=/opt/python/log/message_queue_listeners_stderr.log
                        autostart=true
                        autorestart=true
                        startsecs=10
                        priority=20
                        killasgroup=true

              - realtime.conf:
                    permissions: 0644
                    content: |
                        [program:realtime]
                        command=/opt/python/run/venv/bin/python manage.py rtserver 127.0.0.1:8081 --nothreading --noreload
                        directory=/opt/python/current/app/das
                        environment=DJANGO_SETTINGS_MODULE='das_server.local_settings',PYTHONPATH='/opt/python/current/app/das:$PYTHONPATH',EVENTLET_SHOULDPATCH='True'
                        user=wsgi
                        numprocs=1
                        stdout_logfile=/opt/python/log/realtime.log
                        stderr_logfile=/opt/python/log/realtime_stderr.log
                        autostart=true
                        autorestart=true
                        startsecs=10
                        priority=20
                        killasgroup=true
                        stopsignal=INT
              - realtime_httpd.conf:
                    permissions: 0644
                    content: |
                        LoadModule proxy_wstunnel_module modules/mod_proxy_wstunnel.so

                        RewriteEngine On
                        RewriteCond %%{REQUEST_URI}  ^/socket.io            [NC]
                        RewriteCond %%{QUERY_STRING} transport=websocket    [NC]
                        RewriteRule /(.*)           ws://localhost:8081/$1 [P,L]

                        ProxyPass        /socket.io http://localhost:8081/socket.io
                        ProxyPassReverse /socket.io http://localhost:8081/socket.io

              - 99_supervisord_celeryconfig.sh:
                    permissions: 0755
                    content: |
                        #!/usr/bin/env bash
                        set -e
                        # Add configuration script to supervisord conf (if not there already)
                        if ! grep -Fxq "[include]" /opt/python/etc/supervisord.conf
                            then
                            echo "[include]" | tee -a /opt/python/etc/supervisord.conf
                            echo "files: celeryconfig.conf realtime.conf" | tee -a /opt/python/etc/supervisord.conf
                        fi

                        if ! grep -Fxq "stdout_logfile=/opt/python/log/das.log" /opt/python/etc/supervisord.conf
                          then
                          sed -i '/redirect_stderr=false/ astderr_logfile=\/opt\/python\/log\/das_stderr.log' /opt/python/etc/supervisord.conf
                          sed -i '/redirect_stderr=false/ astdout_logfile=\/opt\/python\/log\/das.log' /opt/python/etc/supervisord.conf

                        fi

                        # Reread the supervisord config
                        /usr/local/bin/supervisorctl -c /opt/python/etc/supervisord.conf reread

                        # Update supervisord in cache without restarting all services
                        /usr/local/bin/supervisorctl -c /opt/python/etc/supervisord.conf update

                        # Start/Restart celery worker and beat through supervisord
                        /usr/local/bin/supervisorctl -c /opt/python/etc/supervisord.conf restart celeryworker celerybeat

                        # Start/Restart realtime socketio api server
                        /usr/local/bin/supervisorctl -c /opt/python/etc/supervisord.conf restart realtime

                        # Start/Restart message_queue_listeners
                        /usr/local/bin/supervisorctl -c /opt/python/etc/supervisord.conf restart message_queue_listeners

              - .ebextensions/01-install_dependencies.config:
                    permissions: 0777
                    yaml:
                        packages:
                            yum:
                                httpd24: []
                                httpd24-devel: []
                                postgresql94-devel: []
                                gcc: []
                                make: []
                                gcc-c++: []
                                libtool: []
                                libxml2-devel: []
                                git: []
                                libjpeg-turbo-devel: []
                                libtiff-devel: []
                            rpm:
                                remi: http://rpms.famillecollet.com/enterprise/remi-release-6.rpm
                        commands:
                          01-install-redis:
                            command: "if [ ! -e /var/lib/redis ]; then yum -y --enablerepo=remi,remi-test install redis; service redis restart; fi"

              - .ebextensions/02-commands.config:
                    permissions: 0666
                    yaml:
                        commands:
                          01-PROJ:
                            command: "if [ ! -e /usr/lib/libproj.so ]; then cd /opt; wget http://download.osgeo.org/proj/proj-4.9.2.tar.gz; tar -xzvf proj-4.9.2.tar.gz; cd proj-4.9.2; ./configure --prefix=/usr; make; make install; fi"
                          02-GDAL:
                            #command: "if [ ! -e /usr/lib/libgdal.so ]; then cd /opt; wget http://download.osgeo.org/gdal/2.0.2/gdal-2.0.2.tar.gz; tar -xzvf gdal-2.0.2.tar.gz; cd gdal-2.0.2; ./configure --prefix=/usr; make; make install; fi"
                            command: "if [ ! -e /usr/lib/libgdal.so ]; then cd /opt; wget http://download.osgeo.org/gdal/1.11.4/gdal-1.11.4.tar.gz; tar -xzvf gdal-1.11.4.tar.gz; cd gdal-1.11.4; ./configure --prefix=/usr; make; make install; fi"
                          03-GEOS:
                            command: "if [ ! -e /usr/local/lib/libgeos_c.so ]; then cd /opt; wget http://download.osgeo.org/geos/geos-3.5.0.tar.bz2; tar -xjf geos-3.5.0.tar.bz2; cd geos-3.5.0; ./configure; make; make install; fi"
                          04-make-media-dir:
                            command: "mkdir -p /var/media/mbtiles; chown wsgi /var/media; chown wsgi /var/media/mbtiles"
                          05-make-tmp-cache-dir:
                            command: "mkdir -p /tmp/django_cache; chown wsgi /tmp/django_cache"
                          06-make-tmp-raster-dir:
                            command: "mkdir -p /tmp/raster; chown wsgi /tmp/raster"
                          07-mod-proxy-protocol:
                            command: "if [ ! -e /etc/httpd/modules/mod_proxy_protocol.so ]; then cd /opt; git clone https://github.com/roadrunner2/mod-proxy-protocol.git; cd mod-proxy-protocol; apxs -i -a -c mod_proxy_protocol.c; fi"
                          08-fix-ld:
                            command: "if ! grep -q /usr/local/lib /etc/ld.so.conf; then sed -i '$a/usr/local/lib' /etc/ld.so.conf; /sbin/ldconfig;fi"

              - .ebextensions/03-commands.config:
                    permissions: 0666
                    yaml:
                        commands:
                          01-timezone:
                            command: "ln -sf /usr/share/zoneinfo/America/Los_Angeles /etc/localtime"
                        container_commands:
                          02-collectstatic:
                            command: "source /opt/python/run/venv/bin/activate && python das/manage.py collectstatic --noinput --settings=das_server.local_settings"
                          03-fix-file-perms:
                            command: "if [ -f /tmp/das.log ]; then chown wsgi /tmp/das.log; fi"
                          04-deflate:
                            command: "cp deflate.conf /etc/httpd/conf.d/"
                          05-celeryconfig:
                            command: "cp celeryconfig.conf /opt/python/etc/"
                          06-realtimeconfig:
                            command: "cp realtime.conf /opt/python/etc/"
                          07-installcelerybeat:
                            command: "cp 99_supervisord_celeryconfig.sh /opt/elasticbeanstalk/hooks/appdeploy/post/"
                          08-installceleryconfig:
                            command: "cp 99_supervisord_celeryconfig.sh /opt/elasticbeanstalk/hooks/configdeploy/post/"
                          09-fix-wsgi-oauth:
                            command: "if ! grep -q WSGIPassAuthorization config.py; then sed -i.bak '/WSGIScriptAlias/ aWSGIPassAuthorization On' config.py; fi"
                            cwd: /opt/elasticbeanstalk/hooks
                          10-cp-realtime-wsgi:
                            command: "cp realtime_httpd.conf /opt/elasticbeanstalk/hooks/"
                          11-fix-realtime-wsgi:
                            command: "if ! grep -q socket.io config.py; then sed -i.bak '/<VirtualHost \\*:%s>/ r realtime_httpd.conf' config.py; fi"
                            cwd: /opt/elasticbeanstalk/hooks
                          #12-fix-proxy-protocol:
                          #  command: "if ! grep -q ProxyProtocol config.py; then sed -i.bak '/WSGIScriptAlias/ aProxyProtocol On' config.py; fi"
                          #  cwd: /opt/elasticbeanstalk/hooks


    # Under the environments node is each environment and their config.
    # Environment specific configuration is determined by first processing
    # the all_environments config and then "overlaying" the environment
    # specific configuration onto it.  Any number of environments can be
    # specified
    environments:
        'das-server-dev':
            cname_prefix: 'das-server-dev'
            option_settings:
              'aws:elasticbeanstalk:application:environment':
                DAS_ENV_NAME: 'dev'
              'aws:autoscaling:launchconfiguration':
                InstanceType: "t2.medium"
        # the odzala version of the app
        'das-server-odzala':
            cname_prefix: 'das-server-odzala'
            option_settings:
              'aws:elasticbeanstalk:application:environment':
                DAS_ENV_NAME: 'odzala'
              'aws:autoscaling:launchconfiguration':
                InstanceType: "t2.medium"
        'das-server-lewa':
            cname_prefix: 'das-server-lewa'
            option_settings:
              'aws:elasticbeanstalk:application:environment':
                DAS_ENV_NAME: 'lewa'
              'aws:autoscaling:launchconfiguration':
                InstanceType: "t2.medium"
        # the demo version of the app
        'das-server-demo':
            cname_prefix: 'das-server-demo'
            option_settings:
              'aws:elasticbeanstalk:application:environment':
                DAS_ENV_NAME: 'demo'
        # the ste version of the app
        'das-server-ste':
            cname_prefix: 'das-server-ste'
            option_settings:
              'aws:elasticbeanstalk:application:environment':
                DAS_ENV_NAME: 'ste'
              'aws:autoscaling:launchconfiguration':
                InstanceType: "t2.medium"
        # the grumeti version of the app
        'das-server-grumeti':
            cname_prefix: 'das-server-grumeti'
            option_settings:
              'aws:elasticbeanstalk:application:environment':
                DAS_ENV_NAME: 'grumeti'
              'aws:autoscaling:launchconfiguration':
                InstanceType: "t2.medium"
        # the bomassa version of the app
        'das-server-bomassa':
            cname_prefix: 'das-server-bomassa'
            option_settings:
              'aws:elasticbeanstalk:application:environment':
                DAS_ENV_NAME: 'bomassa'
              'aws:autoscaling:launchconfiguration':
                InstanceType: "t2.medium"
