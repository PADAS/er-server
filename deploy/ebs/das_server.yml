# See ebs-deploy https://github.com/briandilley/ebs-deploy
# aws account config
aws:
    # override environment variables here
    region: 'us-west-2'
    bucket: 'das-builds'
    bucket_path: 'das_server'

# application configuration
app:
    versions_to_keep: 10 # the number of unused application versions to keep around
    app_name: 'DAS Server' # the name of your application
    description: 'Domain Awareness System' # description of your app

    all_environments:
        solution_stack_name: '64bit Amazon Linux 2015.03 v2.0.1 running Python 3.4'

        # optional information on the tier type
        # check the boto documentation for create_environment
        # for an explanation on the default values.  Most
        # configurations don't need to specify these values
        # at all.
        # Boto: http://docs.pythonboto.org/en/latest/ref/beanstalk.html
        tier_name: 'WebServer'
        tier_type: 'Standard'
        tier_version: '1.0'

        # option_settings contain namespaced key\value pairs that are
        # supported by Beanstalk, follows is an example of some of
        # the values that you might want to set for a python application
        option_settings:
            'aws:elasticbeanstalk:container:python:staticfiles':
                "/static": "/opt/python/current/app/das/www/static"
                "/assets": "/opt/python/current/app/das/www/assets"
                "/app": "/opt/python/current/app/das/www/app"
                "/bower_components": "/opt/python/current/app/das/www/bower_components"
                "/index.html": "/opt/python/current/app/das/www/index.html"
                "/robots.txt": "/opt/python/current/app/das/www/robots.txt"
                "/favicon.ico": "/opt/python/current/app/das/www/favicon.ico"
                "/docs": "/opt/python/current/app/das/docs"


            'aws:autoscaling:launchconfiguration':
              InstanceType: "t2.micro"
              #InstanceType: "m4.large"
              IamInstanceProfile: "arn:aws:iam::074677080781:instance-profile/das_server-dev"
              EC2KeyName: "das-dev"
              SecurityGroups: "sg-e0cf3284,sg-304ee854"
              ImageId: "ami-78bb5b4b"
              #ImageId: "ami-21637d11" - amazon eb

            'aws:autoscaling:asg':
                MinSize: 1
                MaxSize: 1

            'aws:elasticbeanstalk:environment':
              EnvironmentType: "LoadBalanced"

            'aws:elasticbeanstalk:application':
                Application Healthcheck URL: '/api/v1.0/status'

            'aws:elasticbeanstalk:application:environment':
              DJANGO_SETTINGS_MODULE: "das_server.local_settings"
              PYTHONPATH: "/opt/python/current/app/das:$PYTHONPATH"

            'aws:elasticbeanstalk:container:python':
                WSGIPath: 'das/das_server/wsgi.py'
                NumProcesses: 1
                NumThreads: 15

            'aws:ec2:vpc':
              VPCId: "vpc-e774e482"
              Subnets: "subnet-11bf3166,subnet-6910780c,subnet-0074d659"
              AssociatePublicIpAddress: "true"

            'aws:elb:loadbalancer':
                SSLCertificateId: 'arn:aws:iam::074677080781:server-certificate/wildcard-pamdas-org-2015'
                LoadBalancerHTTPSPort: 443

            'aws:elb:policies':
                Stickiness Policy: true


        # instructions on how to build the application archive
        archive:
            includes: # files to include, a list of regex
              - '^das\/.*'
              #- '^wheelhouse\/.*'
              - '^requirements\.txt$'
            excludes: # files to exclude, a list of regex
                - '^.gitignore$'
                - '^\.git*'
                - '.*\.egg-info$'
                - '^tests.*'
                - '.*\.zip$'
                - '^venv.*'
                - '.*\.pyc$'
            files:
              - deflate.conf:
                    # permissions of the file
                    permissions: 0644
                    # the content node is important here
                    content: |
                        # mod_deflate configuration
                        <IfModule mod_deflate.c>
                          # Restrict compression to these MIME types
                          AddOutputFilterByType DEFLATE text/plain
                          AddOutputFilterByType DEFLATE text/html
                          AddOutputFilterByType DEFLATE application/xhtml+xml
                          AddOutputFilterByType DEFLATE text/xml
                          AddOutputFilterByType DEFLATE application/xml
                          AddOutputFilterByType DEFLATE application/xml+rss
                          AddOutputFilterByType DEFLATE application/x-javascript
                          AddOutputFilterByType DEFLATE text/javascript
                          AddOutputFilterByType DEFLATE text/css
                          # Level of compression (Highest 9 - Lowest 1)
                          DeflateCompressionLevel 9
                          # Netscape 4.x has some problems.
                          BrowserMatch ^Mozilla/4 gzip-only-text/html
                          # Netscape 4.06-4.08 have some more problems
                          BrowserMatch ^Mozilla/4\.0[678] no-gzip
                          # MSIE masquerades as Netscape, but it is fine
                          BrowserMatch \bMSI[E] !no-gzip !gzip-only-text/html
                        <IfModule mod_headers.c>
                          # Make sure proxies don't deliver the wrong content
                          Header append Vary User-Agent env=!dont-vary
                        </IfModule>
                        </IfModule>

              - celeryconfig.conf:
                    permissions: 0644
                    content: |
                        [program:celeryworker]
                        command=/opt/python/run/venv/bin/celery worker -A das_server -l info -c 4 -P eventlet
                        directory=/opt/python/current/app/das
                        environment=DJANGO_SETTINGS_MODULE='das_server.local_settings',PYTHONPATH='/opt/python/current/app/das:$PYTHONPATH'
                        user=wsgi
                        numprocs=1
                        stdout_logfile=/opt/python/log/celery_worker.log
                        autostart=true
                        autorestart=true
                        startsecs=10
                        priority=20
                        killasgroup=true

                        [program:celerybeat]
                        command=/opt/python/run/venv/bin/celery beat -A das_server -l info --schedule=/tmp/das-celery-schedule.db
                        directory=/opt/python/current/app/das
                        environment=DJANGO_SETTINGS_MODULE='das_server.local_settings',PYTHONPATH='/opt/python/current/app/das:$PYTHONPATH'
                        user=wsgi
                        numprocs=1
                        stdout_logfile=/opt/python/log/celery_beat.log
                        autostart=true
                        autorestart=true
                        startsecs=10
                        priority=20
                        killasgroup=true

              - 99_supervisord_celeryconfig.sh:
                    permissions: 0755
                    content: |
                        #!/usr/bin/env bash
                        set -e
                        # Add configuration script to supervisord conf (if not there already)
                        if ! grep -Fxq "[include]" /opt/python/etc/supervisord.conf
                            then
                            echo "[include]" | tee -a /opt/python/etc/supervisord.conf
                            echo "files: celeryconfig.conf" | tee -a /opt/python/etc/supervisord.conf
                        fi

                        # Reread the supervisord config
                        /usr/local/bin/supervisorctl -c /opt/python/etc/supervisord.conf reread

                        # Update supervisord in cache without restarting all services
                        /usr/local/bin/supervisorctl -c /opt/python/etc/supervisord.conf update

                        # Start/Restart celery worker and beat through supervisord
                        /usr/local/bin/supervisorctl -c /opt/python/etc/supervisord.conf restart celeryworker celerybeat

              - .ebextensions/01-install_dependencies.config:
                    permissions: 0777
                    yaml:
                        packages:
                            yum:
                                postgresql93-devel: []
                                gcc: []
                                make: []
                                gcc-c++: []
                                libtool: []
                                libxml2-devel: []
                                git: []
                                libjpeg-turbo-devel: []
                                libtiff-devel: []
                            rpm:
                                remi: http://rpms.famillecollet.com/enterprise/remi-release-6.rpm
                        commands:
                          01-install-redis:
                            command: "yum -y --enablerepo=remi,remi-test install redis; service redis restart"

              - .ebextensions/02-commands.config:
                    permissions: 0666
                    yaml:
                        commands:
                          01-PROJ:
                            command: "if [ ! -e /usr/lib/libproj.so ]; then cd /opt; wget http://download.osgeo.org/proj/proj-4.9.2.tar.gz; tar -xzvf proj-4.9.2.tar.gz; cd proj-4.9.2; ./configure --prefix=/usr; make; make install; fi"
                          02-GDAL:
                            command: "if [ ! -e /usr/lib/libgdal.so ]; then cd /opt; wget http://download.osgeo.org/gdal/1.11.3/gdal-1.11.3.tar.gz; tar -xzvf gdal-1.11.3.tar.gz; cd gdal-1.11.3; ./configure --prefix=/usr; make; make install; fi"
                          03-GEOS:
                            command: "if [ ! -e /usr/local/lib/libgeos_c.so ]; then cd /opt; wget http://download.osgeo.org/geos/geos-3.4.2.tar.bz2; tar -xjf geos-3.4.2.tar.bz2; cd geos-3.4.2; ./configure; make; make install; fi"
                          04-make-media-dir:
                            command: "mkdir -p /var/media/mbtiles; chown wsgi /var/media; chown wsgi /var/media/mbtiles"
                          05-make-tmp-cache-dir:
                            command: "mkdir -p /tmp/django_cache; chown wsgi /tmp/django_cache"
                          06-make-tmp-raster-dir:
                            command: "mkdir -p /tmp/raster; chown wsgi /tmp/raster"

              - .ebextensions/03-commands.config:
                    permissions: 0666
                    yaml:
                        commands:
                          01-timezone:
                            command: "ln -sf /usr/share/zoneinfo/America/Los_Angeles /etc/localtime"
                        container_commands:
                          02-collectstatic:
                            command: "source /opt/python/run/venv/bin/activate && python das/manage.py collectstatic --noinput --settings=das_server.local_settings"
                          03-fix-file-perms:
                            command: "chown wsgi /tmp/das.log; chown wsgi /tmp/das-data_input.log"
                          04-deflate:
                            command: "cp deflate.conf /etc/httpd/conf.d/"
                          05-celeryconfig:
                            command: "cp celeryconfig.conf /opt/python/etc/"
                          06-installcelerybeat:
                            command: "cp 99_supervisord_celeryconfig.sh /opt/elasticbeanstalk/hooks/appdeploy/post/"
                          07-installceleryconfig:
                            command: "cp 99_supervisord_celeryconfig.sh /opt/elasticbeanstalk/hooks/configdeploy/post/"
                          08-fix-wsgi-oauth:
                            command: "if ! grep -q WSGIPassAuthorization config.py; then sed -i.bak '/WSGIScriptAlias/ aWSGIPassAuthorization On' config.py; fi"
                            cwd: /opt/elasticbeanstalk/hooks




    # Under the environments node is each environment and their config.
    # Environment specific configuration is determined by first processing
    # the all_environments config and then "overlaying" the environment
    # specific configuration onto it.  Any number of environments can be
    # specified
    environments:
        # the dev version of the app
        'das-server-dev':
            cname_prefix: 'das-server-dev'
            option_settings:
              'aws:elasticbeanstalk:application:environment':
                DAS_ENV_NAME: 'dev'

        'das-server-lewa':
            cname_prefix: 'das-server-lewa'
            option_settings:
              'aws:elasticbeanstalk:application:environment':
                DAS_ENV_NAME: 'lewa'
              'aws:autoscaling:launchconfiguration':
                InstanceType: "t2.medium"

        # the production version of the app
        #'das-server-prod':
        #    cname_prefix: 'das-server-prod'
        #    option_settings:
        #      'aws:elasticbeanstalk:application:environment':
        #        DAS_ENV_NAME: 'prod'

        # the odzala version of the app
        #'das-server-odzala':
