upstream elasticsearch_server{
  server elasticsearch:9200;
}

upstream kibana_server{
  server kibana:5601;
}

upstream alertmanager_server{
  server alertmanager:9093;
}

upstream prometheus_server{
  server prometheus:9090;
}

upstream grafana_server{
  server grafana:3000;
}


server {
  listen 5601;

  server_name _;

  location / {
    proxy_pass http://kibana_server;
  }
}

server {
  listen 9200 ssl;

  ssl_certificate      /etc/ssl/certificate.pem;
  ssl_certificate_key  /etc/ssl/ssl.key;

  server_name _;

  auth_basic "Protected Elasticsearch";
  auth_basic_user_file /etc/nginx/passwords;

  location / {
    proxy_pass http://elasticsearch_server;
    proxy_redirect off;
  }
}

server {
  listen 9093;

  server_name _;

  location / {
    proxy_pass http://alertmanager_server;
  }
}

server {
  listen 9090;

  server_name _;

  location / {
    proxy_pass http://prometheus_server;
  }
}

server {
  listen 3000;

  server_name _;

  location / {
    proxy_pass http://grafana_server;
  }
}