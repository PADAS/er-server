apiVersion: v1
kind: ConfigMap
metadata:
  namespace: "metrics"
  name: metrics-consolidator-configmap
data:
  telegraf_conf: |
      [agent]
        debug = true
      #  precision = "500ms"
      
      [[inputs.http_listener_v2]]
        service_address = ":8086"
      
        path = "/telegraf"
        data_format = "influx"
        methods = ["PUT", "POST"]
      
        read_timeout = "10s"
        write_timeout = "10s"
      
        max_body_size = "2MiB"
        data_source = "body"
      
      [[aggregators.basicstats]]
        # The period on which to flush & clear the aggregator.
        period = "60s"
        drop_original = true
        stats = ["mean", "count"]
      
      [[outputs.file]]
        # Temporary for use during development of metrics.
        files = ["/dev/shm/consolidator_metrics.out"]
        rotation_max_size = "1MB"
        rotation_max_archives = 2
        data_format = "influx"
      
      [[outputs.stackdriver]]
        project = "padas-app"
        namespace = "earthranger"
---
apiVersion: v1
kind: Service
metadata:
  namespace: "metrics"
  name: metrics-consolidator
spec:
  ports:
  - port: 8086
    targetPort: 8086
  selector:
    das.component: metrics-consolidator
--- 
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: "metrics"
  name: metrics-consolidator
spec:
  selector: 
    matchLabels: 
      das.component: metrics-consolidator
  template:
    metadata:
      labels:
        das.component: metrics-consolidator
    spec:
      imagePullSecrets:
        - name: gcr-secret
      # Mount secrets 
      volumes:
      - name: metrics-telegraf-config-volume
        configMap:
          name: metrics-telegraf-configmap
          items:
            - key: telegraf_conf
              path: telegraf.conf
      - name: metrics-writer-credentials
        secret:
          secretName: metrics-writer-credentials
          items:
          - key: credentials_json
            path: "metrics_writer_credentials.json"
      containers:
      - name: telegraf
        image: gcr.io/padas-app/telegraf:1.14.3
        ports:
          - containerPort: 8086
        volumeMounts:
        - name: metrics-telegraf-config-volume
          mountPath: "/etc/telegraf/"
          readOnly: true
        - name: metrics-writer-credentials
          mountPath: "/etc/earthranger/"
          readOnly: true
        env:
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: "/etc/earthranger/metrics_writer_credentials.json"
