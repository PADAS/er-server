apiVersion: apps/v1beta1
kind: Deployment
metadata:
  namespace: "${KUBERNETES_NAMESPACE}"
  name: worker-analyzer
spec:
  template:
    metadata:
      labels:
        das.component: worker-analyzer
      annotations:
        prometheus.io/port: "9102"
    spec:
      imagePullSecrets:
        - name: gcr-secret
      containers:
      - image:  "${SERVER_VERSION}"
        name: das-worker-analyzer
        resources:
          requests:
            cpu: "100m"
        env:
        - name: SERVICE_NAME
          value: "analyzer_worker"
        - name: API_HOST
          value: "${API_HOST}"
        - name: API_PORT
          value: "${API_PORT}"
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: site-configmap
              key: DB_HOST
        - name: DB_PORT
          value: "${DB_PORT}"
        - name: DB_NAME
          value: "${DB_NAME}"
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: site-configmap
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            configMapKeyRef:
              name: site-configmap
              key: DB_PASSWORD
        - name: USE_AZURE_STORAGE
          value: "${USE_AZURE_STORAGE}"
        - name: STORAGE_ACCOUNT
          valueFrom:
            configMapKeyRef:
              name: site-configmap
              key: STORAGE_ACCOUNT
        - name: STORAGE_ACCOUNT_KEY
          valueFrom:
            configMapKeyRef:
              name: site-configmap
              key: STORAGE_ACCOUNT_KEY
        - name: STORAGE_CONTAINER
          value: "${STORAGE_CONTAINER}"
        - name: CONFIG_ACCOUNT
          valueFrom:
            configMapKeyRef:
              name: site-configmap
              key: CONFIG_ACCOUNT
        - name: CONFIG_ACCOUNT_KEY
          valueFrom:
            configMapKeyRef:
              name: site-configmap
              key: CONFIG_ACCOUNT_KEY
        - name: CONFIG_CONTAINER
          value: "${CONFIG_CONTAINER}"
        - name: EMAIL_PASSWORD
          valueFrom:
            configMapKeyRef:
              name: default-configmap
              key: EMAIL_PASSWORD
        - name: EMAIL_HOST_USER
          valueFrom:
            configMapKeyRef:
              name: default-configmap
              key: EMAIL_HOST_USER
        - name: EMAIL_HOST
          valueFrom:
            configMapKeyRef:
              name: default-configmap
              key: EMAIL_HOST
        - name: FROM_EMAIL
          valueFrom:
            configMapKeyRef:
              name: default-configmap
              key: FROM_EMAIL
        - name: DEFAULT_FROM_EMAIL
          valueFrom:
            configMapKeyRef:
              name: default-configmap
              key: DEFAULT_FROM_EMAIL
