apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: "${KUBERNETES_NAMESPACE}"
  name: rt-api
spec:
  selector:
    matchLabels:
      das.component: rt-api
      das.configuration: server
  template:
    metadata:
      labels:
        das.component: rt-api
        das.configuration: server
      annotations:
        prometheus.io/port: "9102"
    spec:
      imagePullSecrets:
        - name: gcr-secret
      # Mount secrets
      volumes:
        - name: google-credentials
          secret:
            secretName: google-application-credentials
            items:
              - key: credentials_json
                path: "google_credentials.json"
        - name: telegraf-config-volume
          configMap:
            name: telegraf-configmap
            items:
              - key: telegraf_conf
                path: telegraf.conf
      containers:
        - image: "${SERVER_VERSION}"
          name: das-rt-api
          resources:
            requests:
              cpu: "200m"
              memory: "500Mi"
#            limits:
#              cpu: "800m"
#              memory: "4000Mi"
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              httpHeaders:
                - name: Host
                  value: "${FQDN}"
                - name: Connection
                  value: "Upgrade"
                - name: Upgrade
                  value: "Websocket"
              path: "/socket.io/"
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
            successThreshold: 1
          livenessProbe:
            httpGet:
              httpHeaders:
                - name: Host
                  value: "${FQDN}"
                - name: Connection
                  value: "Upgrade"
                - name: Upgrade
                  value: "Websocket"
              path: "/socket.io/"
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
            successThreshold: 1
          volumeMounts:
            - name: google-credentials
              mountPath: "/etc/earthranger/"
              readOnly: true
          env:
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: "/etc/earthranger/google_credentials.json"
            - name: SERVICE_NAME
              value: "realtime_server"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws-metrics-credentials
                  key: aws_access_key_id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws-metrics-credentials
                  key: aws_secret_access_key
            - name: GA_MEASUREMENT_ID
              valueFrom:
                secretKeyRef:
                  name: ga-measurement-id
                  key: ga_measurement_id
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: app-db-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-db-credentials
                  key: password
            - name: EMAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: email-password
                  key: value
            - name: EMAIL_HOST_USER
              valueFrom:
                secretKeyRef:
                  name: email-username
                  key: value
            - name: TWILIO_ACCOUNT_SID
              valueFrom:
                secretKeyRef:
                  name: twilio-account-settings
                  key: account_sid
            - name: TWILIO_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: twilio-account-settings
                  key: auth_token
            - name: WHATSAPP_FROM_NUMBER
              valueFrom:
                secretKeyRef:
                  name: twilio-account-settings
                  key: whatsapp_from_number
            - name: UBI_API_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ubi-api-credentials
                  key: ubi_username
            - name: UBI_API_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ubi-api-credentials
                  key: ubi_password
          envFrom:
            - configMapRef:
                name: server-configmap
        - name: telegraf
          image: gcr.io/padas-app/telegraf:1.14.3
          ports:
            - containerPort: 8125
          volumeMounts:
            - name: telegraf-config-volume
              mountPath: "/etc/telegraf/"
              readOnly: true
          env:
            - name: SERVICE_NAME
              value: "realtime_server"
