apiVersion: apps/v1beta1
kind: Deployment
metadata:
  namespace: "${KUBERNETES_NAMESPACE}"
  name: redis
spec:
  template:
    metadata:
      labels:
        das.component: redis
    spec:
      containers:
      - image: redis
        name: das-redis
        resources:
          requests:
            cpu: "50m"
        ports:
          - containerPort: 6379
        readinessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 15
          periodSeconds: 20
