kind: ConfigMap
apiVersion: v1
metadata:
  namespace: "${KUBERNETES_NAMESPACE}"
  name: server-configmap
data:
  API_HOST: "${API_HOST}"
  API_PORT: "${API_PORT}"
  DB_HOST: "${DB_HOST}"
  DB_PORT: "${DB_PORT}"
  dotenv: |
    ACCEPT_EULA="${ACCEPT_EULA}"
    ALERTS_ENABLED="${ALERTS_ENABLED}"
    CORS_ORIGIN_ALLOW_ALL=True
    CORS_REPLACE_HTTPS_REFERER=True
    CSRF_COOKIE_SECURE=True
    DB_NAME="${DB_NAME}"
    DEFAULT_FROM_EMAIL="${DEFAULT_FROM_EMAIL}"
    EMAIL_HOST="${EMAIL_HOST}"
    EMAIL_HOST_USER="${EMAIL_HOST_USER}"
    EMAIL_PORT=2587
    ENABLE_DEBUG="${ENABLE_DEBUG}"
    ENABLE_DEV=False
    EUS_EMAIL="${EUS_EMAIL}"
    EUS_NAME="${EUS_NAME}"
    EUS_ORG="${EUS_ORG}"
    EUS_TYPE="${EUS_TYPE}"
    FQDN="${FQDN}"
    FROM_EMAIL="${FROM_EMAIL}"
    GS_BUCKET_NAME="${GS_BUCKET_NAME}"
    KML_EXPORT="${KML_EXPORT}"
    MAPPING_FEATURES_V2="${MAPPING_FEATURES_V2}"
    SESSION_COOKIE_SECURE=True
    SHOW_STATIONARY_SUBJECTS_ON_MAP="${SHOW_STATIONARY_SUBJECTS_ON_MAP}"
    SHOW_TRACK_DAYS=${SHOW_TRACK_DAYS}
    SMS_ID="${SMS_ID}"
    SMS_TOKEN="${SMS_TOKEN}"
    TIME_ZONE="${TIME_ZONE}"

