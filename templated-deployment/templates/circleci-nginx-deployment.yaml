apiVersion: apps/v1beta1
kind: Deployment
metadata:
  namespace: "${KUBERNETES_NAMESPACE}"
  name: nginx
spec:
  template:
    metadata:
      labels:
        das.component: nginx
    spec:
      imagePullSecrets:
        - name: gcr-secret
      containers:
      - image: "${NGINX_IMAGE}"
        name: das-nginx
        resources:
          requests:
            cpu: "10m"
            memory: "100Mi"
        ports:
        - containerPort: 443
        - containerPort: 8000
        - containerPort: 9001
        env:
        - name: WEB_SERVICE_NAME
          value: "${WEB_SERVICE_NAME}"
        - name: BUNDLE_CRT
          valueFrom:
            configMapKeyRef:
              name: default-configmap
              key: BUNDLE_CRT
        - name: PAMDAS_ORG_PRIVATE_KEY_PEM
          valueFrom:
            configMapKeyRef:
              name: default-configmap
              key: PAMDAS_ORG_PRIVATE_KEY_PEM
