apiVersion: apps/v1beta1
kind: Deployment
metadata:
  namespace: "${KUBERNETES_NAMESPACE}"
  name: beat
spec:
  template:
    metadata:
      labels:
        das.component: beat
      annotations:
        prometheus.io/port: "9102"
    spec:
      imagePullSecrets:
        - name: gcr-secret
      containers:
      - image: "${SERVER_VERSION}"
        name: das-beat
        resources:
          requests:
            cpu: "25m"
          limits:
            cpu: "50m"
        env:
        - name: SERVICE_NAME
          value: "beat_service"
        - name: API_HOST
          value: "${API_HOST}"
        - name: API_PORT
          value: "${API_PORT}"
        - name: DB_HOST
          value: "${DB_HOST}"
        - name: DB_PORT
          value: "${DB_PORT}"
        - name: DB_NAME
          value: "${DB_NAME}"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-password
              key: value
        - name: EMAIL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: email-password
              key: value
        - name: EMAIL_HOST_USER
          valueFrom:
            secretKeyRef:
              name: email-username
              key: value
        - name: EMAIL_HOST
          value: "${EMAIL_HOST}"
        - name: FROM_EMAIL
          value: "${FROM_EMAIL}"
        - name: DEFAULT_FROM_EMAIL
          value: "${DEFAULT_FROM_EMAIL}"
        - name: KML_EXPORT
          value: "${KML_EXPORT}"
