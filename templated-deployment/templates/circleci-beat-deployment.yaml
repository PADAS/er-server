apiVersion: apps/v1beta1
kind: Deployment
metadata:
  namespace: "${KUBERNETES_NAMESPACE}"
  name: beat
spec:
  template:
    metadata:
      labels:
        das.component: beat
        das.configuration: server
      annotations:
        prometheus.io/port: "9102"
    spec:
      imagePullSecrets:
        - name: gcr-secret
      # Mount secrets 
      volumes:
      - name: google-credentials
        secret:
          secretName: google-application-credentials
          items:
          - key: credentials_json
            path: "google_credentials.json"
      - name: server-config-volume
        configMap:
          name: server-configmap
          items:
            - key: dotenv
              path: .env
      containers:
      - image: "${SERVER_VERSION}"
        name: das-beat
        resources:
          requests:
            cpu: "25m"
          limits:
            cpu: "50m"
        volumeMounts:
        - name: google-credentials
          mountPath: "/etc/earthranger/"
          readOnly: true
        - name: .env
          mountPath: "/etc/das/"
          readOnly: true
        env:
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: "/etc/earthranger/google_credentials.json"
        - name: GS_BUCKET_NAME
          value: "${GS_BUCKET_NAME}"
        - name: SERVICE_NAME
          value: "beat_service"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: app-db-credentials
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-db-credentials
              key: password
        - name: EMAIL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: email-password
              key: value
        - name: EMAIL_HOST_USER
          valueFrom:
            secretKeyRef:
              name: email-username
              key: value
        envFrom:
          - configMapRef:
              name: server-configmap

