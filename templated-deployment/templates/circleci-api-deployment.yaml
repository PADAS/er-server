apiVersion: apps/v1beta1
kind: Deployment
metadata:
  namespace: <<namespace>>
  name: api
spec:
  template:
    metadata:
      labels:
        das.component: api
      annotations:
        prometheus.io/port: "9102"
    spec:
      imagePullSecrets:
        - name: gcr-secret
      containers:
      - image:  gcr.io/padas-app/concourse-shim/concourse-earthranger-api:<<server-version>>
        name: das-api
        resources:
          requests:
            cpu: "200m"
            memory: "500Mi"
        ports:
          - containerPort: 8000
        env:
        - name: DB_HOST
          value: "${DB_HOST}"
        - name: DB_PORT
          value: "${DB_PORT}"
        - name: DB_NAME
          value: "${DB_NAME}"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-password
              key: value
        - name: SERVICE_NAME
          value: "api_server"
        - name: EMAIL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: email-password
              key: value
        - name: EMAIL_HOST_USER
          valueFrom:
            secretKeyRef:
              name: email-username
              key: value
        - name: EMAIL_HOST
          value: "${EMAIL_HOST}"
        - name: FROM_EMAIL
          value: "${FROM_EMAIL}"
        - name: DEFAULT_FROM_EMAIL
          value: "${DEFAULT_FROM_EMAIL}"
        - name: KML_EXPORT
          value: "${KML_EXPORT}"
