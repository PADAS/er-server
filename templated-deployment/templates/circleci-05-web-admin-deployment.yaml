apiVersion: v1
kind: Service
metadata:
  namespace: "${KUBERNETES_NAMESPACE}"
  name: web-admin
spec:
  ports:
  - port: 80
    targetPort: 80
  selector:
    das.component: web-admin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: "${KUBERNETES_NAMESPACE}"
  name: web-admin
spec:
  selector:
    matchLabels:
      das.component: web-admin
  template:
    metadata:
      labels:
        das.component: web-admin
    spec:
      imagePullSecrets:
        - name: gcr-secret
      containers:
      - name: web-admin 
        image: "${WEB_ADMIN_VERSION}"
        resources:
          requests:
            cpu: "5m"
            memory: "11Mi"
          limits:
            cpu: "150m"
            memory: "200Mi"
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            port: 80
            path: /alerts/
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
          successThreshold: 1
        livenessProbe:
          httpGet:
            port: 80
            path: /alerts/
          initialDelaySeconds: 15
          periodSeconds: 20
          failureThreshold: 3
          successThreshold: 1
        env:
        - name: APIENDPOINT
          value: "${API_ENDPOINT}"
