apiVersion: apps/v1beta1
kind: Deployment
metadata:
  namespace: "${KUBERNETES_NAMESPACE}"
  name: web
spec:
  template:
    metadata:
      labels:
        das.component: web
    spec:
      imagePullSecrets:
        - name: gcr-secret
      containers:
      - name: das-web
        image: "${WEB_VERSION}"
        resources:
          requests:
            cpu: "75m"
            memory: "100Mi"
          limits:
            cpu: "150m"
            memory: "200Mi"

        ports:
        - containerPort: 9000
        readinessProbe:
          httpGet:
            port: 9000
            path: /
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
          successThreshold: 1
        livenessProbe:
          httpGet:
            port: 9000
            path: /
          initialDelaySeconds: 15
          periodSeconds: 20
          failureThreshold: 3
          successThreshold: 1
        env:
        - name: APIENDPOINT
          value: "${API_ENDPOINT}"
