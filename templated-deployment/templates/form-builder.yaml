image:
  repository: gcr.io/padas-app/efb
#   tag: master-eb7a3dd
  pullPolicy: IfNotPresent
ingress:
  enabled: false
env:
  - name: MSW
    value: "true"
  - name: MSW_ORIGIN
    value: "http://report-form-builder"
  - name: PORT
    value: "3000"
  - name: PATH_BASENAME
    value: "/admin/form-builder"
  - name: SESSION_COOKIE_SECRET
    valueFrom:
      secretKeyRef:
        name: report-form-builder
        key: SESSION_COOKIE_SECRET
livenessProbe:
  enabled: true
  type: tcpSocket
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 1
  successThreshold: 1
  failureThreshold: 3
readinessProbe:
  enabled: true
  type: tcpSocket
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 1
  successThreshold: 1
  failureThreshold: 3
service:
  port: 3000
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
createCookieSecret: true
autoGenerateCookieSecret: true
