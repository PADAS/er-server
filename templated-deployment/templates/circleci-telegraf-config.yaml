apiVersion: v1
kind: ConfigMap
metadata:
  namespace: "${KUBERNETES_NAMESPACE}"
  name: telegraf-configmap
data:
  telegraf_conf: |
         [global_tags]
           site = "${KUBERNETES_NAMESPACE}"
           service_name = "$SERVICE_NAME"

         [agent]
           interval = "10s"
           round_interval = true
           metric_batch_size = 1000
           metric_buffer_limit = 10000
           collection_jitter = "0s"
           flush_interval = "10s"
           flush_jitter = "5s"
           precision = ""
           hostname = ""
           omit_hostname = false

         [[inputs.statsd]]
           protocol = "udp"
           max_tcp_connections = 250
           tcp_keep_alive = false
           service_address = ":8125"
           delete_gauges = true
           delete_counters = true
           delete_sets = true
           delete_timings = true
           percentiles = [50.0, 90.0, 99.0, 99.9, 99.95, 100.0]
           metric_separator = "_"
           parse_data_dog_tags = false
           datadog_extensions = true
           allowed_pending_messages = 10000
           percentile_limit = 1000

         [[outputs.stackdriver]]
           project = "padas-app"
           namespace = "earthranger"
          
          
          [[outputs.file]]
           # Temporary for use during development of metrics.
           files = ["/dev/shm/metrics.out"]
           rotation_max_size = "1MB"
           rotation_max_archives = 2
           data_format = "influx"

          [[aggregators.basicstats]]
           # The period on which to flush & clear the aggregator.
           period = "20s"
         
           # Drop original metric
           drop_original = true
           stats = ["count", "min"]
