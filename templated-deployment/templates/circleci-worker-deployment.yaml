apiVersion: apps/v1beta1
kind: Deployment
metadata:
  namespace: "${KUBERNETES_NAMESPACE}"
  name: worker
spec:
  template:
    metadata:
      labels:
        das.component: worker
        das.configuration: server
      annotations:
        prometheus.io/port: "9102"
    spec:
      imagePullSecrets:
        - name: gcr-secret
      # Mount secrets 
      volumes:
      - name: google-credentials
        secret:
          secretName: google-application-credentials
          items:
          - key: credentials_json
            path: "google_credentials.json"
      containers:
      - image:  "${SERVER_VERSION}"
        name: das-worker
        resources:
          requests:
            cpu: "200m"
        volumeMounts:
        - name: google-credentials
          mountPath: "/etc/earthranger"
          readOnly: true
        env:
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: "/etc/earthranger/google_credentials.json"
        - name: SERVICE_NAME
          value: "default_worker"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-password
              key: value
        - name: EMAIL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: email-password
              key: value
        - name: EMAIL_HOST_USER
          valueFrom:
            secretKeyRef:
              name: email-username
              key: value
        envFrom:
          - configMapRef:
              name: server-configmap
