resources:
- name: git-deployment
  type: versioned-git-resource
  source:
    uri: git@github.com:PADAS/das.git
    branch: ((server-branch-name))
    paths:
      - deployment/*
    private_key: ((das-github))

resource_types:
- name: versioned-git-resource
  type: docker-image
  source:
    email: ((gcr-io-email))
    username: ((gcr-io-username))
    password: ((ss-infrastructure-container-registry-pull))
    repository: gcr.io/ss-infrastructure/concourse/versioned-git-resource

jobs:
- name: deploy-to-k8s
  plan:
  - aggregate:
    - get: git-deployment
  - aggregate:
      - task: ensure-disks-exist
        config:
          platform: linux
          image_resource:
            type: docker-image
            source: {
              repository: gcr.io/ss-infrastructure-public/platform/tools,
              tag: ((vp-tools-container-version)),
            }
          inputs:
          - name: git-deployment
          params: {
            PROJECT: padas-app,
            SERVICE_ACCOUNT_KEY: ((padas-app-boshprovisioner)),
            USERNAME: ((creator)),
            ELASTIC_URL: ((elastic-url)),
            BUILD_PIPELINE_NAME: ((pipeline-name)),
            AZURE_TENANT_ID: ((azure-tenant-id)),
            AZURE_SUBSCRIPTION_ID: ((azure-subscription-id)),
            AZURE_CLIENT_ID: ((azure-client-id)),
            AZURE_CLIENT_SECRET: ((azure-client-secret)),
            LOGSTASH_URL: ((logstash-url))
          }
          run:
            path: /bin/bash
            args:
            - vcloud
            - disks
            - create
            - git-deployment/((disks-spec))
            - --prefix=((cluster-name))
            - --zone=((iaas-zone))
            - --iaas=((iaas))
            - --workspace=((iaas-workspace))
            - --type=ssd
      - task: ensure-cluster-exists
        config:
          platform: linux
          image_resource:
            type: docker-image
            source: {
              repository: gcr.io/ss-infrastructure-public/platform/tools,
              tag: ((vp-tools-container-version)),
            }
          inputs:
          - name: git-deployment
          params: {
            PROJECT: padas-app,
            SERVICE_ACCOUNT_KEY: ((padas-app-cluster-admin)),
            USERNAME: ((creator)),
            VAULT_TOKEN: ((vault-automation-token)),
            VAULT_ADDR: ((vault-address)),
            ELASTIC_URL: ((elastic-url)),
            AZURE_TENANT_ID: ((azure-tenant-id)),
            AZURE_SUBSCRIPTION_ID: ((azure-subscription-id)),
            AZURE_CLIENT_ID: ((azure-client-id)),
            AZURE_CLIENT_SECRET: ((azure-client-secret)),
            LOGSTASH_URL: ((logstash-url))
          }
          run:
            path: /bin/bash
            args:
            - vcloud
            - clusters
            - create
            - git-deployment/((cluster-spec))
            - --name=((cluster-name))
            - --zone=((iaas-zone))
            - --iaas=((iaas))
            - --workspace=((iaas-workspace))
  - do:
      - task: deploy
        config:
          platform: linux
          image_resource:
            type: docker-image
            source: {
              repository: gcr.io/ss-infrastructure-public/platform/tools,
              tag: ((vp-tools-container-version)),
            }
          inputs:
          - name: git-deployment
          params: {
            PROJECT: padas-app,
            SERVICE_ACCOUNT_KEY: ((padas-app-cluster-admin)),
            USERNAME: ((creator)),
            VAULT_TOKEN: ((vault-automation-token)),
            VAULT_ADDR: ((vault-address)),
            ELASTIC_URL: ((elastic-url)),
            VCLOUD_SERVICE_URL: ((vcloud-service-url)),
            STATIC_IP: ((static-ip)),
            AZURE_TENANT_ID: ((azure-tenant-id)),
            AZURE_SUBSCRIPTION_ID: ((azure-subscription-id)),
            AZURE_CLIENT_ID: ((azure-client-id)),
            AZURE_CLIENT_SECRET: ((azure-client-secret)),
            LOGSTASH_URL: ((logstash-url))
          }
          run:
            path: /bin/bash
            args:
            - vcloud
            - clusters
            - deploy
            - git-deployment/deployment/components
            - --params-file=git-deployment/deployment/params/((deploy-params-environment)).params.yaml
            - --name=((cluster-name))
            - --workspace=((iaas-workspace))
            - --iaas=((iaas))
            - --zone=((iaas-zone))
            - --plan=((deployment-plan))
            - --recipe git-deployment/deployment/recipes/((deploy-recipe))
