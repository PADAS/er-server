anchors:
  terraform-image-specification: &terraform-image-specification
    type: docker-image
    source:
      repository: "gcr.io/ss-infrastructure-public/vendor/hashicorp/terraform-0.12.9"
      digest: "sha256:cf9b54657c498378e3fe43f5e36039c9b7d8e620a606fbdc713d63df514fb96d"
  terraform-apply-and-destroy-params: &terraform-apply-and-destroy-params
    CREDENTIALS_FOR_STATE: "((concourse-terraform-state-reader-key))"
    GOOGLE_CREDENTIALS: "((concourse-terraform-state-reader-key))"
    TF_IN_AUTOMATION: "not-empty"
    TF_VAR_infra_namespace: "((infra-namespace))"
    TF_VAR_location: "West Europe"
    TF_VAR_namespace: "((namespace))"
    WORKSPACE: "((pipeline-name))"

resources:
- name: git-deployment
  type: versioned-git-resource
  source:
    uri: git@github.com:PADAS/das.git
    branch: ((server-branch-name))
    paths:
      - deployment/*
    private_key: ((das-github))

- name: git-terraform
  type: versioned-git-resource
  source:
    uri: git@github.com:PADAS/das.git
    branch: ((server-branch-name))
    paths:
      - terraform/*
    private_key: ((das-github))

- name: terraform-saved-plan
  type: gcs-resource
  source:
    bucket: ((plan-bucket))
    json_key: ((temp-concourse-terraform-planner))
    regexp: padas-app/((pipeline-name))/plan-(.?).gpg

resource_types:
- name: versioned-git-resource
  type: docker-image
  source:
    email: ((gcr-io-email))
    username: ((gcr-io-username))
    password: ((ss-infrastructure-container-registry-pull))
    repository: gcr.io/ss-infrastructure/concourse/versioned-git-resource

jobs:
- name: terraform-plan
  max_in_flight: 1
  serial_groups:
    - "terraform"
  plan:
  - do:
    - get: git-terraform
      params:
        submodules: none
    - task: plan
      config:
        platform: linux
        image_resource: *terraform-image-specification
        inputs:
        - name: git-terraform
        params: *terraform-apply-and-destroy-params
        run:
          path: /bin/sh
          args:
          - '-c'
          - 'cp -r ./git-terraform/terraform /tmp &&
            cd /tmp/terraform &&
            echo "$CREDENTIALS_FOR_STATE" > ./credentials-for-state.json &&
            terraform init -input=false -backend-config="credentials=./credentials-for-state.json" &&
            (terraform workspace new "$WORKSPACE" || terraform workspace select "$WORKSPACE") &&
            terraform plan -input=false -out=tfplan &&
            cd "$OLDPWD" &&
            cp -r /tmp/terraform ./plan'
        outputs:
        - name: plan
    - task: zip
      config:
        platform: linux
        image_resource: *terraform-image-specification
        inputs:
        - name: plan
        params:
          PLAN_ENCRYPTION_SECRET: ((plan-encryption-secret))
        run:
          path: /bin/sh
          args:
          - '-c'
          - 'apk update && apk add gnupg &&
          tar c -z ./plan/terraform > ./zip &&
          echo "$PLAN_ENCRYPTION_SECRET" | PASSPHRASE="$PLAN_ENCRYPTION_SECRET" gpg --batch --pinentry-mode loopback --command-fd 0 --symmetric -o ./zipped/plan-$(date +%s).gpg zip'
        outputs:
        - name: zipped
    - put: terraform-saved-plan
      params:
        file: zipped/plan-*.gpg


