resources:
################################################################################
#
# Resources to fetch
#
################################################################################
# git resources

- name: server-base-version
  type: semver
  source:
    driver: git
    uri: git@github.com:PADAS/das.versions.git
    branch: master
    file: ((version-prefix)).server.base.version
    private_key: ((das-versions-github))
    initial_version: ((initial-server-version))

- name: git-earthranger-api
  type: versioned-git-resource
  source:
    uri: git@github.com:PADAS/das.git
    branch: ((server-branch-name))
    private_key: ((das-github))

- name: git-deployment
  type: versioned-git-resource
  source:
    uri: git@github.com:PADAS/das.git
    branch: ((server-branch-name))
    paths:
      - deployment/*
    private_key: ((das-github))

- name: git-web
  type: versioned-git-resource
  source:
    uri: git@github.com:PADAS/das-web.git
    branch: ((web-branch-name))
    private_key: ((das-web-github))

- name: git-web-react
  type: versioned-git-resource
  source:
    uri: git@github.com:PADAS/das-web-react.git
    branch: ((web-react-branch-name))
    private_key: ((das-web-react-github))

- name: git-react-admin
  type: versioned-git-resource
  source:
    uri: git@github.com:PADAS/das-react-admin.git
    branch: ((web-react-admin-branch-name))
    private_key: ((das-react-admin-github))

- name: web-version
  type: semver
  source:
    driver: git
    uri: git@github.com:PADAS/das.versions.git
    branch: master
    file: ((version-prefix)).web.version
    private_key: ((das-versions-github))
    initial_version: ((initial-web-version))

- name: web-react-version
  type: semver
  source:
    driver: git
    uri: git@github.com:PADAS/das.versions.git
    branch: master
    file: ((version-prefix)).web.react.version
    private_key: ((das-versions-github))
    initial_version: ((initial-web-react-version))

- name: git-spot-provider
  type: versioned-git-resource
  source:
    uri: git@github.com:PADAS/das-spot-provider.git
    branch: ((spot-provider-branch-name))
    private_key: ((das-spot-provider-github))

- name: git-sigfox-provider
