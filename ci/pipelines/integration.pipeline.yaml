- name: concourse-earthranger-api-shim
  type: docker-image-with-file-build-args
  source:
    email: ((gcr-io-email))
    username: ((gcr-io-username))
    password: ((padas-app-container-registry-push))
    repository: gcr.io/padas-app/deleteme/concourse-earthranger-api

