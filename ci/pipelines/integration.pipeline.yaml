################################################################################
#
# Custom Resource Types
#
################################################################################
resource_types:
- name: docker-image-with-file-build-args
  type: docker-image
  source:
    email: ((gcr-io-email))
    username: ((gcr-io-username))
    password: ((ss-infrastructure-container-registry-pull))
    repository: gcr.io/ss-infrastructure/concourse/docker-image-with-file-build-args-resource
  privileged: true

- name: versioned-git-resource
  type: docker-image
  source:
    email: ((gcr-io-email))
    username: ((gcr-io-username))
    password: ((ss-infrastructure-container-registry-pull))
    repository: gcr.io/ss-infrastructure/concourse/versioned-git-resource

- name: slack-notification
  type: docker-image
  source:
    repository: cfcommunity/slack-notification-resource
    tag: v1.2.0


################################################################################
#
# Jobs to run
#
################################################################################
jobs:
- name: docker-earthranger-api-shim
  max_in_flight: 1
  plan:
    - get: git-earthranger-api
      params:
        submodules: none
      trigger: false
    - get: earthranger-api-image
      trigger: true
    - put: server-base-version
      params:
        pre: ((version-prefix))
    - get: server-base-version
    - put: concourse-earthranger-api-shim
      params:
        build: git-earthranger-api
        dockerfile: git-earthranger-api/docker/Dockerfile
        tag: server-base-version/version
        tag_as_latest: ((tag-as-latest))
        build_args: {BASE_IMAGE_TAG: latest}

      get_params: {skip_download: true}
    - put: image-postgis
      params:
        build: git-server/docker/PostGIS
        tag: server-base-version/version
        tag_as_latest: ((tag-as-latest))
      get_params: {skip_download: true}
    - put: image-nginx
      params:
        build: git-server/docker/Nginx
        tag: server-base-version/version
        tag_as_latest: ((tag-as-latest))
      get_params: {skip_download: true}
    on_failure:
      do:
      - put: slack-alert
        params:
          channel: ((slack-notification-channel))
          text: |
            :warning: $BUILD_PIPELINE_NAME job $BUILD_JOB_NAME failed
            $ATC_EXTERNAL_URL/teams/$BUILD_TEAM_NAME/pipelines/$BUILD_PIPELINE_NAME/jobs/$BUILD_JOB_NAME
# Web Jobs
- name: docker-build-web-develop
  max_in_flight: 1
  plan:
  - get: git-web
    trigger: true
  - put: web-version
    params:
      pre: ((version-prefix))
  - put: image-web-develop
    params: {
      build: git-web,
      dockerfile: git-web/docker/Dockerfile-develop,
      tag: web-version/version,
      tag_as_latest: ((tag-as-latest)),
    }
    get_params: {skip_download: true}
    on_failure:
      do:
      - put: slack-alert
        params:
          channel: ((slack-notification-channel))
          text: |
            :warning: $BUILD_PIPELINE_NAME job $BUILD_JOB_NAME failed
            $ATC_EXTERNAL_URL/teams/$BUILD_TEAM_NAME/pipelines/$BUILD_PIPELINE_NAME/jobs/$BUILD_JOB_NAME

- name: test-web-unit
  serial: true
  plan:
  - aggregate:
    - get: git-web
      trigger: true
      passed: [docker-build-web-develop]
    - get: image-web-develop
      trigger: true
      passed: [docker-build-web-develop]
      params: {
        save: true
      }
  - task: test
    image: image-web-develop
    config:
      platform: linux
      inputs:
      - name: git-web
      run:
        dir: git-web
        path: ls
    on_failure:
      do:
      - put: slack-alert
        params:
          channel: ((slack-notification-channel))
          text: |
            :warning: $BUILD_PIPELINE_NAME job $BUILD_JOB_NAME failed
            $ATC_EXTERNAL_URL/teams/$BUILD_TEAM_NAME/pipelines/$BUILD_PIPELINE_NAME/jobs/$BUILD_JOB_NAME

- name: docker-build-web-react-develop
  max_in_flight: 1
  plan:
  - get: git-web-react
    trigger: true
  - put: web-react-version
    params:
      pre: ((version-prefix))
  - put: image-web-react-develop
    params: {
      build: git-web-react,
      dockerfile: git-web-react/Dockerfile.dev,
      tag: web-react-version/version,
      tag_as_latest: ((tag-as-latest)),
    }
    get_params: {skip_download: true}
    on_failure:
      do:
      - put: slack-alert
        params:
          channel: ((slack-notification-channel))
          text: |
            :warning: $BUILD_PIPELINE_NAME job $BUILD_JOB_NAME failed
            $ATC_EXTERNAL_URL/teams/$BUILD_TEAM_NAME/pipelines/$BUILD_PIPELINE_NAME/jobs/$BUILD_JOB_NAME

- name: test-web-react-unit
  serial: true
  plan:
  - aggregate:
    - get: git-web-react
      trigger: true
      passed: [docker-build-web-react-develop]
    - get: image-web-react-develop
      trigger: true
      passed: [docker-build-web-react-develop]
      params: {
        save: true
      }
  - task: test
    image: image-web-react-develop
    config:
      platform: linux
      inputs:
      - name: git-web-react
      run:
        dir: git-web-react
        path: ls
    on_failure:
      do:
      - put: slack-alert
        params:
          channel: ((slack-notification-channel))
          text: |
            :warning: $BUILD_PIPELINE_NAME job $BUILD_JOB_NAME failed
            $ATC_EXTERNAL_URL/teams/$BUILD_TEAM_NAME/pipelines/$BUILD_PIPELINE_NAME/jobs/$BUILD_JOB_NAME

- name: docker-build-react-admin
  max_in_flight: 1
  plan:
  - get: git-react-admin
    trigger: true
  - put: image-react-admin
    params: {
      build: git-react-admin,
      dockerfile: git-react-admin/Dockerfile.prod,
      tag: git-react-admin/sha,
      tag_as_latest: ((tag-as-latest))
    }
    get_params: {skip_download: true}
    on_failure:
      do:
      - put: slack-alert
        params:
          channel: ((slack-notification-channel))
          text: |
            :warning: $BUILD_PIPELINE_NAME job $BUILD_JOB_NAME failed
            $ATC_EXTERNAL_URL/teams/$BUILD_TEAM_NAME/pipelines/$BUILD_PIPELINE_NAME/jobs/$BUILD_JOB_NAME

- name: docker-build-web-react-app
  max_in_flight: 1
  plan:
  - aggregate:
    - get: git-web-react
      passed: [test-web-react-unit]
      trigger: true
    - get: image-web-react-develop
      trigger: true
      passed: [test-web-react-unit]
      params: {skip_download: true}
    - get: web-react-version
      passed: [docker-build-web-react-develop]
  - put: image-web-react-app
    params:
      build: git-web-react
      dockerfile: git-web-react/Dockerfile.prod
      tag: web-react-version/version
      tag_as_latest: ((tag-as-latest))
    get_params: {skip_download: true}
    on_failure:
      do:
      - put: slack-alert
        params:
          channel: ((slack-notification-channel))
          text: |
            :warning: $BUILD_PIPELINE_NAME job $BUILD_JOB_NAME failed
            $ATC_EXTERNAL_URL/teams/$BUILD_TEAM_NAME/pipelines/$BUILD_PIPELINE_NAME/jobs/$BUILD_JOB_NAME


- name: docker-build-web-app
  max_in_flight: 1
  serial: true
  plan:
  - aggregate:
    - get: git-web
      passed: [test-web-unit]
      trigger: true
    - get: image-web-develop
      trigger: true
      passed: [test-web-unit]
      params: {skip_download: true}
    - get: image-web-react-develop
      trigger: true
      passed: [test-web-react-unit]
      params: {skip_download: true}
    - get: web-version
      passed: [docker-build-web-develop]
    - get: web-react-version
      passed: [docker-build-web-react-develop]
    - get: image-react-admin
      version: latest
      trigger: true
    - get: image-web-react-app
      version: web-react-version/version
      trigger: true
  - put: image-web-app
    params:
      build: git-web
      dockerfile: git-web/docker/Dockerfile-alerts
      tag:  web-version/version
      tag_as_latest: ((tag-as-latest))
      build_args:
        from_file:
          WEB_REACT_VERSION: web-react-version/version
    get_params: {skip_download: true}
    on_failure:
      do:
      - put: slack-alert
        params:
          channel: ((slack-notification-channel))
          text: |
            :warning: $BUILD_PIPELINE_NAME job $BUILD_JOB_NAME failed
            $ATC_EXTERNAL_URL/teams/$BUILD_TEAM_NAME/pipelines/$BUILD_PIPELINE_NAME/jobs/$BUILD_JOB_NAME

# ETL Jobs
- name: docker-build-skyline-provider
  max_in_flight: 1
