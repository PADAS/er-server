- name: destroy-resources
  disable_manual_trigger: true
  serial: true
  plan:
  - do:
    - get: git-deployment
      params:
        submodules: none
    - task: delete-cluster
      config:
        platform: linux
        image_resource:
          type: docker-image
          source: {
            repository: gcr.io/ss-infrastructure-public/platform/tools,
            tag: ((vp-tools-container-version)),
          }
        inputs:
        - name: git-deployment
        params: {
          PROJECT: padas-app,
          SERVICE_ACCOUNT_KEY: ((padas-app-boshprovisioner)),
          USERNAME: ((creator)),
          VAULT_TOKEN: ((vault-automation-token)),
          VAULT_ADDR: ((vault-address)),
          ELASTIC_URL: ((elastic-url)),
          BUILD_PIPELINE_NAME: ((pipeline-name)),
          AZURE_TENANT_ID: ((azure-tenant-id)),
          AZURE_SUBSCRIPTION_ID: ((azure-subscription-id)),
          AZURE_CLIENT_ID: ((azure-client-id)),
          AZURE_CLIENT_SECRET: ((azure-client-secret)),
          LOGSTASH_URL: ((logstash-url)),
          DELETE_CLUSTER: "no"
        }
        run:
          path: /bin/bash
          args:
          - -ec
          - |
            if [ "$DELETE_CLUSTER" == "yes" ]; then
              echo "Deleting cluster. Project [$PROJECT], Workspace ((iaas-workspace)), Zone ((iaas-zone)), K8s Cluster ((cluster-name))"
              vcloud clusters delete -i ((iaas)) -w ((iaas-workspace)) -z ((iaas-zone)) -n ((cluster-name)) -f || true
            else
              echo "Skipping cluster deletion"
            fi
    - task: delete-namespace
      config:
        platform: linux
        image_resource:
          type: docker-image
          source: {
            repository: gcr.io/ss-infrastructure-public/platform/tools,
            tag: ((vp-tools-container-version)),
          }
        inputs:
        - name: git-deployment
        params: {
          PROJECT: padas-app,
