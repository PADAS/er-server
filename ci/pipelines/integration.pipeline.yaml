resources:
################################################################################
#
# Resources to fetch
#
################################################################################
# git resources
- name: server-version
  type: semver
  source:
    driver: git
    uri: git@github.com:PADAS/das.versions.git
    branch: master
    file: ((version-prefix)).server.version
    private_key: ((das-versions-github))
    initial_version: ((initial-server-version))

- name: server-base-version
  type: semver
  source:
    driver: git
    uri: git@github.com:PADAS/das.versions.git
    branch: master
    file: ((version-prefix)).server.base.version
    private_key: ((das-versions-github))
    initial_version: ((initial-server-version))

- name: server-app-version
  type: semver
  source:
    driver: git
    uri: git@github.com:PADAS/das.versions.git
    branch: master
    file: ((version-prefix)).server.app.version
    private_key: ((das-versions-github))
    initial_version: ((initial-server-version))

- name: git-server-base
  type: versioned-git-resource
  source:
    uri: git@github.com:PADAS/das.git
    branch: ((server-branch-name))
    paths:
      - dependencies/*
      - docker/base/*
    private_key: ((das-github))

- name: git-server
  type: versioned-git-resource
  source:
    uri: git@github.com:PADAS/das.git
    branch: ((server-branch-name))
    ignore_paths:
      - deployment/*
    private_key: ((das-github))

- name: git-deployment
  type: versioned-git-resource
  source:
    uri: git@github.com:PADAS/das.git
    branch: ((server-branch-name))
    paths:
      - deployment/*
    private_key: ((das-github))

- name: git-web
  type: versioned-git-resource
  source:
    uri: git@github.com:PADAS/das-web.git
    branch: ((web-branch-name))
    private_key: ((das-web-github))

- name: web-version
  type: semver
  source:
    driver: git
    uri: git@github.com:PADAS/das.versions.git
    branch: master
    file: ((version-prefix)).web.version
    private_key: ((das-versions-github))
    initial_version: ((initial-web-version))

- name: git-smartconnect-provider
  type: versioned-git-resource
  source:
    uri: git@github.com:PADAS/das-smartconnect-provider.git
    branch: ((smartconnect-provider-branch-name))
    private_key: ((das-smartconnect-provider-github))

- name: smartconnect-version
  type: semver
  source:
    driver: git
    uri: git@github.com:PADAS/das.versions.git
    branch: master
    file: ((version-prefix)).smartconnect.version
    private_key: ((das-versions-github))
    initial_version: ((initial-smartconnect-version))

#base docker resources
- name: image-server-base
  type: docker-image-with-file-build-args
  source:
    tag: $(cat<git-server-base/sha)
    email: ((gcr-io-email))
    username: ((gcr-io-username))
    password: ((padas-app-container-registry-push))
    repository: gcr.io/padas-app/base

- name: image-server-app
  type: docker-image-with-file-build-args
  source:
    tag: $(cat<git-server/sha)
    email: ((gcr-io-email))
    username: ((gcr-io-username))
    password: ((padas-app-container-registry-push))
    repository: gcr.io/padas-app/app

# AIS_Gap, AIS_Track, API, Beat, MQL, RT_AIS_API, RT_API, Worker
- name: image-server-worker
  type: docker-image-with-file-build-args
  source:
    email: ((gcr-io-email))
    username: ((gcr-io-username))
    password: ((padas-app-container-registry-push))
    repository: gcr.io/padas-app/worker

- name: image-server-rt-api
  type: docker-image-with-file-build-args
  source:
    email: ((gcr-io-email))
    username: ((gcr-io-username))
    password: ((padas-app-container-registry-push))
    repository: gcr.io/padas-app/rt_api

- name: image-server-mql
  type: docker-image-with-file-build-args
  source:
    email: ((gcr-io-email))
    username: ((gcr-io-username))
    password: ((padas-app-container-registry-push))
    repository: gcr.io/padas-app/mql

- name: image-server-beat
  type: docker-image-with-file-build-args
  source:
    email: ((gcr-io-email))
    username: ((gcr-io-username))
    password: ((padas-app-container-registry-push))
    repository: gcr.io/padas-app/beat

- name: image-server-api
  type: docker-image-with-file-build-args
  source:
    email: ((gcr-io-email))
    username: ((gcr-io-username))
    password: ((padas-app-container-registry-push))
    repository: gcr.io/padas-app/api


# docker resource images not dependent on base / app
- name: image-postgis
  type: docker-image-with-file-build-args
  source:
    email: ((gcr-io-email))
    username: ((gcr-io-username))
    password: ((padas-app-container-registry-push))
    repository: gcr.io/padas-app/postgis

- name: image-nginx
  type: docker-image-with-file-build-args
  source:
    email: ((gcr-io-email))
    username: ((gcr-io-username))
    password: ((padas-app-container-registry-push))
    repository: gcr.io/padas-app/nginx

- name: image-nginx-utility
  type: docker-image-with-file-build-args
  source:
    email: ((gcr-io-email))
    username: ((gcr-io-username))
    password: ((padas-app-container-registry-push))
    repository: gcr.io/padas-app/nginx-utility

# Web docker resources
- name: image-web-develop
  type: docker-image-with-file-build-args
  source:
    tag: $(cat<git-web/sha)
    email: ((gcr-io-email))
    username: ((gcr-io-username))
    password: ((padas-app-container-registry-push))
    repository: gcr.io/padas-app/web/develop

- name: image-web-app
  type: docker-image-with-file-build-args
  source:
    email: ((gcr-io-email))
    username: ((gcr-io-username))
    password: ((padas-app-container-registry-push))
    repository: gcr.io/padas-app/web/app

- name: image-smartconnect-provider
  type: docker-image-with-file-build-args
  source:
    email: ((gcr-io-email))
    username: ((gcr-io-username))
    password: ((padas-app-container-registry-push))
    repository: gcr.io/padas-app/etl/smartconnect-provider

- name: slack-alert
  type: slack-notification
  source:
    url: ((slack-webhook-url-concourse))


################################################################################
#
# Custom Resource Types
#
################################################################################
resource_types:
- name: docker-image-with-file-build-args
  type: docker-image
  source:
    email: ((gcr-io-email))
    username: ((gcr-io-username))
    password: ((ss-infrastructure-container-registry-pull))
    repository: gcr.io/ss-infrastructure/concourse/docker-image-with-file-build-args-resource
  privileged: true

- name: versioned-git-resource
  type: docker-image
  source:
    email: ((gcr-io-email))
    username: ((gcr-io-username))
    password: ((ss-infrastructure-container-registry-pull))
    repository: gcr.io/ss-infrastructure/concourse/versioned-git-resource

- name: slack-notification
  type: docker-image
  source:
    repository: cfcommunity/slack-notification-resource
    tag: v1.2.0


################################################################################
#
# Jobs to run
#
################################################################################
jobs:
- name: docker-build-server-base
  plan:
  - get: git-server-base
    trigger: true
  - put: server-base-version
    params:
      pre: ((version-prefix))
  - put: image-server-base
    params: {
      build: git-server-base,
      dockerfile: git-server-base/docker/base/Dockerfile,
      tag: server-base-version/version,
      tag_as_latest: ((tag-as-latest))
    }
    get_params: {skip_download: true}
    on_failure:
      do:
      - put: slack-alert
        params:
          channel: ((slack-notification-channel))
          text: |
            :warning: $BUILD_PIPELINE_NAME job $BUILD_JOB_NAME failed
            $ATC_EXTERNAL_URL/teams/$BUILD_TEAM_NAME/pipelines/$BUILD_PIPELINE_NAME/jobs/$BUILD_JOB_NAME

- name: docker-build-server-app
  plan:
  - aggregate:
    - get: git-server-base
      passed: [docker-build-server-base]
    - get: image-server-base
      passed: [docker-build-server-base]
      trigger: true
      params: {
        skip_download: true
      }
    - get: git-server
      trigger: true
    - get: server-base-version
    - put: server-app-version
      params:
        pre: ((version-prefix))
  - put: image-server-app
    params:
      build: git-server
      dockerfile: git-server/docker/App/Dockerfile
      tag: server-app-version/version
      build_args:
        from_file:
          base_tag: server-base-version/version
          version: server-app-version/version
      tag_as_latest: ((tag-as-latest))
    get_params: {skip_download: true}
    on_failure:
      do:
      - put: slack-alert
        params:
          channel: ((slack-notification-channel))
          text: |
            :warning: $BUILD_PIPELINE_NAME job $BUILD_JOB_NAME failed
            $ATC_EXTERNAL_URL/teams/$BUILD_TEAM_NAME/pipelines/$BUILD_PIPELINE_NAME/jobs/$BUILD_JOB_NAME

- name: docker-build-server
  plan:
  - aggregate:
    - get: git-server
    - get: image-server-app
      passed: [docker-build-server-app]
      trigger: true
      params: {skip_download: true}
    - get: server-app-version
    - put: server-version
      params:
        pre: ((version-prefix))
  - aggregate:
    - put: image-server-api
      params:
        build: git-server/docker/API
        tag: server-version/version
        build_args:
          from_file:
            app_tag: server-app-version/version
            version: server-version/version
        tag_as_latest: ((tag-as-latest))
      get_params: {skip_download: true}
    - put: image-server-beat
      params:
        build: git-server/docker/Beat
        tag: server-version/version
        build_args:
          from_file:
            app_tag: server-app-version/version
        tag_as_latest: ((tag-as-latest))
      get_params: {skip_download: true}
    - put: image-server-mql
      params:
        build: git-server/docker/MQL
        tag: server-version/version
        build_args:
          from_file:
            app_tag: server-app-version/version
        tag_as_latest: ((tag-as-latest))
      get_params: {skip_download: true}
    - put: image-server-rt-api
      params:
        build: git-server/docker/RT_API
        tag: server-version/version
        build_args:
          from_file:
            app_tag: server-app-version/version
        tag_as_latest: ((tag-as-latest))
      get_params: {skip_download: true}
    - put: image-server-worker
      params:
        build: git-server/docker/Worker
        tag: server-version/version
        build_args:
          from_file:
            app_tag: server-app-version/version
        tag_as_latest: ((tag-as-latest))
      get_params: {skip_download: true}
    - put: image-postgis
      params:
        build: git-server/docker/PostGIS
        tag: server-version/version
        tag_as_latest: ((tag-as-latest))
      get_params: {skip_download: true}
    - put: image-nginx
      params:
        build: git-server/docker/Nginx
        tag: server-version/version
        tag_as_latest: ((tag-as-latest))
      get_params: {skip_download: true}
    - put: image-nginx-utility
      params:
        build: git-server/docker/Nginx_Utility
        tag: server-version/version
        tag_as_latest: ((tag-as-latest))
      get_params: {skip_download: true}
  on_failure:
    do:
    - put: slack-alert
      params:
        channel: ((slack-notification-channel))
        text: |
          :warning: $BUILD_PIPELINE_NAME job $BUILD_JOB_NAME failed
          $ATC_EXTERNAL_URL/teams/$BUILD_TEAM_NAME/pipelines/$BUILD_PIPELINE_NAME/jobs/$BUILD_JOB_NAME


# Web Jobs
- name: docker-build-web-develop
  plan:
  - get: git-web
    trigger: true
  - put: web-version
    params:
      pre: ((version-prefix))
  - put: image-web-develop
    params: {
      build: git-web,
      dockerfile: git-web/docker/Dockerfile-develop,
      tag: web-version/version,
      tag_as_latest: ((tag-as-latest)),
    }
    get_params: {skip_download: true}
    on_failure:
      do:
      - put: slack-alert
        params:
          channel: ((slack-notification-channel))
          text: |
            :warning: $BUILD_PIPELINE_NAME job $BUILD_JOB_NAME failed
            $ATC_EXTERNAL_URL/teams/$BUILD_TEAM_NAME/pipelines/$BUILD_PIPELINE_NAME/jobs/$BUILD_JOB_NAME

- name: test-web-unit
  serial: true
  plan:
  - aggregate:
    - get: git-web
      trigger: true
      passed: [docker-build-web-develop]
    - get: image-web-develop
      trigger: true
      passed: [docker-build-web-develop]
      params: {
        save: true
      }
  - task: test
    image: image-web-develop
    config:
      platform: linux
      inputs:
      - name: git-web
      run:
        dir: git-web
        path: ls
    on_failure:
      do:
      - put: slack-alert
        params:
          channel: ((slack-notification-channel))
          text: |
            :warning: $BUILD_PIPELINE_NAME job $BUILD_JOB_NAME failed
            $ATC_EXTERNAL_URL/teams/$BUILD_TEAM_NAME/pipelines/$BUILD_PIPELINE_NAME/jobs/$BUILD_JOB_NAME

- name: docker-build-web-app
  serial: true
  plan:
  - aggregate:
    - get: git-web
      passed: [test-web-unit]
      trigger: true
    - get: image-web-develop
      trigger: true
      passed: [test-web-unit]
      params: {skip_download: true}
    - get: web-version
  - put: image-web-app
    params: {
      build: git-web,
      dockerfile: git-web/docker/Dockerfile-app,
      tag:  web-version/version,
      tag_as_latest: ((tag-as-latest)),
    }
    get_params: {skip_download: true}
    on_failure:
      do:
      - put: slack-alert
        params:
          channel: ((slack-notification-channel))
          text: |
            :warning: $BUILD_PIPELINE_NAME job $BUILD_JOB_NAME failed
            $ATC_EXTERNAL_URL/teams/$BUILD_TEAM_NAME/pipelines/$BUILD_PIPELINE_NAME/jobs/$BUILD_JOB_NAME

- name: docker-build-smartconnect-provider
  plan:
  - get: git-smartconnect-provider
    trigger: true
  - put: smartconnect-version
    params:
      pre: ((version-prefix))
  - put: image-smartconnect-provider
    params: {
      build: git-smartconnect-provider,
      tag: smartconnect-version/version,
      tag_as_latest: ((tag-as-latest))
    }
    get_params: {skip_download: true}
    on_failure:
      do:
      - put: slack-alert
        params:
          channel: ((slack-notification-channel))
          text: |
            :warning: $BUILD_PIPELINE_NAME job $BUILD_JOB_NAME failed
            $ATC_EXTERNAL_URL/teams/$BUILD_TEAM_NAME/pipelines/$BUILD_PIPELINE_NAME/jobs/$BUILD_JOB_NAME

- name: deploy-to-k8s
  plan:
    - aggregate:
      - get: server-version
      - get: web-version
      - get: smartconnect-version
      - get: git-web
        passed: [docker-build-web-app]
      - get: git-server
        passed: [docker-build-server]
      - get: git-deployment
        trigger: true
      - get: git-smartconnect-provider
        passed: [docker-build-smartconnect-provider]
      - get: image-server-api
        passed: [docker-build-server]
        trigger: true
        params: {skip_download: true}
      - get: image-server-mql
        passed: [docker-build-server]
        trigger: true
        params: {skip_download: true}
      - get: image-server-beat
        passed: [docker-build-server]
        trigger: true
        params: {skip_download: true}
      - get: image-server-rt-api
        passed: [docker-build-server]
        trigger: true
        params: {skip_download: true}
      - get: image-server-worker
        passed: [docker-build-server]
        trigger: true
        params: {skip_download: true}
      - get: image-nginx
        trigger: true
        params: {skip_download: true}
      - get: image-postgis
        trigger: true
        params: {skip_download: true}
      - get: image-web-app
        passed: [docker-build-web-app]
        trigger: true
        params: {skip_download: true}
    - aggregate:
      - task: ensure-disks-exist
        config:
          platform: linux
          image_resource:
            type: docker-image
            source: {
              repository: gcr.io/ss-infrastructure-public/platform/tools,
              tag: ((vp-tools-container-version)),
            }
          inputs:
          - name: git-deployment
          params: {
            PROJECT: padas-app,
            CLUSTER_NAME: ((cluster-name)),
            IAAS: ((iaas)),
            ZONE: ((iaas-zone)),
            WORKSPACE: ((iaas-workspace)),
            SERVICE_ACCOUNT_KEY: ((padas-app-boshprovisioner)),
            USERNAME: ((creator)),
            ELASTIC_URL: ((elastic-url)),
            BUILD_PIPELINE_NAME: ((pipeline-name)),
            WORKSPACE: ((iaas-workspace)),
            ZONE: ((iaas-zone)),
            AZURE_TENANT_ID: ((azure-tenant-id)),
            AZURE_SUBSCRIPTION_ID: ((azure-subscription-id)),
            AZURE_CLIENT_ID: ((azure-client-id)),
            AZURE_CLIENT_SECRET: ((azure-client-secret)),
            LOGSTASH_URL: ((logstash-url))
          }
          run:
            path: /bin/bash
            args:
            - vcloud
            - disks
            - create
            - git-deployment/((disks-spec))
            - --prefix=((cluster-name))
            - --zone=((iaas-zone))
            - --iaas=((iaas))
            - --workspace=((iaas-workspace))
            - --type=ssd
      - task: ensure-cluster-exists
        config:
          platform: linux
          image_resource:
            type: docker-image
            source: {
              repository: gcr.io/ss-infrastructure-public/platform/tools,
              tag: ((vp-tools-container-version)),
            }
          inputs:
          - name: git-deployment
          params: {
            PROJECT: padas-app,
            CLUSTER_NAME: ((cluster-name)),
            IAAS: ((iaas)),
            ZONE: ((iaas-zone)),
            WORKSPACE: ((iaas-workspace)),
            SERVICE_ACCOUNT_KEY: ((padas-app-cluster-admin)),
            USERNAME: ((creator)),
            VAULT_TOKEN: ((vault-automation-token)),
            VAULT_ADDR: ((vault-address)),
            ELASTIC_URL: ((elastic-url)),
            AZURE_TENANT_ID: ((azure-tenant-id)),
            AZURE_SUBSCRIPTION_ID: ((azure-subscription-id)),
            AZURE_CLIENT_ID: ((azure-client-id)),
            AZURE_CLIENT_SECRET: ((azure-client-secret)),
            LOGSTASH_URL: ((logstash-url))
          }
          run:
            path: /bin/bash
            args:
            - vcloud
            - clusters
            - create
            - git-deployment/((cluster-spec))
            - --name=((cluster-name))
            - --zone=((iaas-zone))
            - --iaas=((iaas))
            - --workspace=((iaas-workspace))
      - task: create-deployment-plan
        config:
          platform: linux
          image_resource:
            type: docker-image
            source: {
              repository: gcr.io/ss-infrastructure-public/platform/tools,
              tag: ((vp-tools-container-version)),
            }
          inputs:
          - name: server-version
          - name: web-version
          - name: smartconnect-version
          - name: git-deployment
          params: {
            PROJECT: padas-app,
            USERNAME: ((creator)),
            VAULT_TOKEN: ((vault-automation-token)),
            VAULT_ADDR: ((vault-address)),
            ELASTIC_URL: ((elastic-url)),
            VCLOUD_SERVICE_URL: ((vcloud-service-url)),
            LOGSTASH_URL: ((logstash-url))
          }
          run:
            path: /bin/bash
            args:
            - vcloud
            - deployment-plans
            - create
            - git-deployment/deployment/default-deployment-plan-spec.yaml
            - --series=((cluster-name))
    - do:
      - task: deploy
        config:
          platform: linux
          image_resource:
            type: docker-image
            source: {
              repository: gcr.io/ss-infrastructure-public/platform/tools,
              tag: ((vp-tools-container-version)),
            }
          inputs:
          - name: git-deployment
          params: {
            PROJECT: padas-app,
            CLUSTER_NAME: ((cluster-name)),
            IAAS: ((iaas)),
            ZONE: ((iaas-zone)),
            WORKSPACE: ((iaas-workspace)),
            SERVICE_ACCOUNT_KEY: ((padas-app-cluster-admin)),
            USERNAME: ((creator)),
            VAULT_TOKEN: ((vault-automation-token)),
            VAULT_ADDR: ((vault-address)),
            ELASTIC_URL: ((elastic-url)),
            VCLOUD_SERVICE_URL: ((vcloud-service-url)),
            STATIC_IP: ((static-ip)),
            AZURE_TENANT_ID: ((azure-tenant-id)),
            AZURE_SUBSCRIPTION_ID: ((azure-subscription-id)),
            AZURE_CLIENT_ID: ((azure-client-id)),
            AZURE_CLIENT_SECRET: ((azure-client-secret)),
            LOGSTASH_URL: ((logstash-url))
          }
          run:
            path: /bin/bash
            args:
            - -exc
            - |
              echo "Finalizing the PV definitions to be used for this IAAS"
              find . -depth -name "*.yaml.$IAAS" -exec sh -c '
                from=yaml.$IAAS
                to=yaml
                shift 2
                for pathname do
                  mv "$pathname" "${pathname%.$from}.$to"
                done' sh "yaml.$IAAS" "yaml" {} +

              find . -name "*.yaml\.*" -type f -delete

              vcloud clusters deploy git-deployment/deployment/components --params-file git-deployment/deployment/params/((deploy-params-environment)).params.yaml --name ((cluster-name)) --workspace ((iaas-workspace)) --iaas ((iaas)) --zone ((iaas-zone)) --plan ((deployment-plan)) --recipe git-deployment/deployment/recipes/((deploy-recipe))
      on_failure:
        do:
        - put: slack-alert
          params:
            channel: ((slack-notification-channel))
            text: |
              :warning: $BUILD_PIPELINE_NAME job $BUILD_JOB_NAME failed
              $ATC_EXTERNAL_URL/teams/$BUILD_TEAM_NAME/pipelines/$BUILD_PIPELINE_NAME/jobs/$BUILD_JOB_NAME

- name: destroy_environment
  serial: true
  plan:
  - aggregate:
    - get: git-deployment
  - do:
    - task: delete_cluster
      config:
        platform: linux
        image_resource:
          type: docker-image
          source: {
            repository: gcr.io/ss-infrastructure-public/platform/tools,
            tag: ((vp-tools-container-version)),
          }
        inputs:
        - name: git-deployment
        params: {
          PROJECT: padas-app,
          CLUSTER_NAME: ((cluster-name)),
          IAAS: ((iaas)),
          ZONE: ((iaas-zone)),
          WORKSPACE: ((iaas-workspace)),
          SERVICE_ACCOUNT_KEY: ((padas-app-boshprovisioner)),
          USERNAME: ((creator)),
          VAULT_TOKEN: ((vault-automation-token)),
          VAULT_ADDR: ((vault-address)),
          ELASTIC_URL: ((elastic-url)),
          BUILD_PIPELINE_NAME: ((pipeline-name)),
          AZURE_TENANT_ID: ((azure-tenant-id)),
          AZURE_SUBSCRIPTION_ID: ((azure-subscription-id)),
          AZURE_CLIENT_ID: ((azure-client-id)),
          AZURE_CLIENT_SECRET: ((azure-client-secret)),
          LOGSTASH_URL: ((logstash-url))
        }
        run:
          path: /bin/bash
          args:
          - -exc
          - |
            echo "Deleting Cluster. Project [$PROJECT], Workspace [$WORKSPACE], Zone [$ZONE], K8s Cluster [$CLUSTER_NAME]"
            vcloud clusters delete -i $IAAS --project $PROJECT -w $WORKSPACE -n=$CLUSTER_NAME -z=$ZONE -f
    - task: delete_disks
      config:
        platform: linux
        image_resource:
          type: docker-image
          source: {
            repository: gcr.io/ss-infrastructure-public/platform/tools,
            tag: ((vp-tools-container-version)),
          }
        inputs:
        - name: git-deployment
        params: {
          PROJECT: padas-app,
          CLUSTER_NAME: ((cluster-name)),
          IAAS: ((iaas)),
          ZONE: ((iaas-zone)),
          WORKSPACE: ((iaas-workspace)),
          SERVICE_ACCOUNT_KEY: ((padas-app-boshprovisioner)),
          USERNAME: ((creator)),
          VAULT_TOKEN: ((vault-automation-token)),
          VAULT_ADDR: ((vault-address)),
          ELASTIC_URL: ((elastic-url)),
          BUILD_PIPELINE_NAME: ((pipeline-name)),
          AZURE_TENANT_ID: ((azure-tenant-id)),
          AZURE_SUBSCRIPTION_ID: ((azure-subscription-id)),
          AZURE_CLIENT_ID: ((azure-client-id)),
          AZURE_CLIENT_SECRET: ((azure-client-secret)),
          LOGSTASH_URL: ((logstash-url))
        }
        run:
          path: /bin/bash
          args:
          - -exc
          - |
            echo "Deleting Disks. Project [$PROJECT], Workspace [$WORKSPACE], Zone [$ZONE], K8s Cluster [$CLUSTER_NAME]"
            vcloud disks delete git-deployment/((disks-spec)) -i $IAAS --project $PROJECT -w $WORKSPACE -p=$CLUSTER_NAME -z=$ZONE -f
            vcloud disks delete git-deployment/((disks-spec)) -i $IAAS --project $PROJECT -w $WORKSPACE -p=pd-$CLUSTER_NAME -z=$ZONE -f
    on_failure:
      do:
      - put: slack-alert
        params:
          channel: ((slack-notification-channel))
          text: |
            :warning: $BUILD_PIPELINE_NAME job $BUILD_JOB_NAME failed
            $ATC_EXTERNAL_URL/teams/$BUILD_TEAM_NAME/pipelines/$BUILD_PIPELINE_NAME/jobs/$BUILD_JOB_NAME
      - try:
          task: ifttt-alert
          config:
            platform: linux
            image_resource:
              type: docker-image
              source: {repository: byrnedo/alpine-curl}
            params: {
              IFTTT_WEBHOOK_KEY: ((ifttt-webhook-key))
            }
            run:
              path: /bin/sh
              args:
              - -exc
              - |
                curl -X POST https://maker.ifttt.com/trigger/shared_services_ci_failed/with/key/$IFTTT_WEBHOOK_KEY
