            :warning: $BUILD_PIPELINE_NAME job $BUILD_JOB_NAME failed
            $ATC_EXTERNAL_URL/teams/$BUILD_TEAM_NAME/pipelines/$BUILD_PIPELINE_NAME/jobs/$BUILD_JOB_NAME

- name: docker-build-smartconnect-provider
  max_in_flight: 1
  plan:
  - get: git-smartconnect-provider
    trigger: true
  - put: smartconnect-version
    params:
      pre: ((version-prefix))
  - put: image-smartconnect-provider
    params: {
      build: git-smartconnect-provider,
      tag: smartconnect-version/version,
      tag_as_latest: ((tag-as-latest))
    }
    get_params: {skip_download: true}
    on_failure:
      do:
      - put: slack-alert
        params:
          channel: ((slack-notification-channel))
          text: |
            :warning: $BUILD_PIPELINE_NAME job $BUILD_JOB_NAME failed
            $ATC_EXTERNAL_URL/teams/$BUILD_TEAM_NAME/pipelines/$BUILD_PIPELINE_NAME/jobs/$BUILD_JOB_NAME

- name: deploy-to-k8s
  max_in_flight: 1
  plan:
    - aggregate:
      - get: server-version
        passed: [docker-build-server]
      - get: web-version
        passed: [docker-build-web-develop]
      - get: smartconnect-version
        passed: [docker-build-smartconnect-provider]
      - get: git-web
        passed: [docker-build-web-app]
      - get: git-server
        passed: [docker-build-server]
        params:
          submodules: none
      - get: git-deployment
        trigger: true
      - get: git-skyline-provider
        passed: [docker-build-skyline-provider]
      - get: git-tracktrace-provider
        passed: [docker-build-tracktrace-provider]
      - get: git-quadratex-provider
        passed: [docker-build-quadratex-provider]
      - get: git-smartconnect-provider
        passed: [docker-build-smartconnect-provider]
      - get: image-server-api
        passed: [docker-build-server]
        trigger: true
        params: {skip_download: true}
      - get: image-server-mql
        passed: [docker-build-server]
        trigger: true
        params: {skip_download: true}
      - get: image-server-beat
        passed: [docker-build-server]
        trigger: true
        params: {skip_download: true}
      - get: image-server-rt-api
        passed: [docker-build-server]
        trigger: true
        params: {skip_download: true}
      - get: image-server-worker
        passed: [docker-build-server]
        trigger: true
        params: {skip_download: true}
      - get: image-server-worker-rt
        passed: [docker-build-server]
        trigger: true
        params: {skip_download: true}
      - get: image-server-worker-analyzer
        passed: [docker-build-server]
        trigger: true
        params: {skip_download: true}
      - get: image-nginx
        passed: [docker-build-server]
        trigger: true
        params: {skip_download: true}
      - get: image-postgis
        passed: [docker-build-server]
        trigger: true
        params: {skip_download: true}
      - get: image-web-app
        passed: [docker-build-web-app]
        trigger: true
        params: {skip_download: true}
    - aggregate:
      - task: ensure-disks-exist
        config:
          platform: linux
          image_resource:
            type: docker-image
            source: {
              repository: gcr.io/ss-infrastructure-public/platform/tools,
              tag: ((vp-tools-container-version)),
            }
          inputs:
          - name: git-deployment
          params: {
            PROJECT: padas-app,
            SERVICE_ACCOUNT_KEY: ((padas-app-boshprovisioner)),
            USERNAME: ((creator)),
            ELASTIC_URL: ((elastic-url)),
            BUILD_PIPELINE_NAME: ((pipeline-name)),
            AZURE_TENANT_ID: ((azure-tenant-id)),
            AZURE_SUBSCRIPTION_ID: ((azure-subscription-id)),
            AZURE_CLIENT_ID: ((azure-client-id)),
            AZURE_CLIENT_SECRET: ((azure-client-secret)),
            LOGSTASH_URL: ((logstash-url))
          }
          run:
            path: /bin/bash
            args:
            - vcloud
            - disks
            - create
            - git-deployment/((disks-spec))
            - --prefix=((cluster-name))-((namespace))
            - --zone=((iaas-zone))
            - --iaas=((iaas))
            - --workspace=((iaas-workspace))
            - --type=ssd
      - task: ensure-infra-disks-exist
        config:
          platform: linux
          image_resource:
            type: docker-image
            source: {
              repository: gcr.io/ss-infrastructure-public/platform/tools,
              tag: ((vp-tools-container-version)),
            }
          inputs:
          - name: git-deployment
          params: {
            PROJECT: padas-app,
            SERVICE_ACCOUNT_KEY: ((padas-app-boshprovisioner)),
            USERNAME: ((creator)),
            ELASTIC_URL: ((elastic-url)),
            BUILD_PIPELINE_NAME: ((pipeline-name)),
            AZURE_TENANT_ID: ((azure-tenant-id)),
            AZURE_SUBSCRIPTION_ID: ((azure-subscription-id)),
            AZURE_CLIENT_ID: ((azure-client-id)),
            AZURE_CLIENT_SECRET: ((azure-client-secret)),
            LOGSTASH_URL: ((logstash-url))
          }
          run:
            path: /bin/bash
            args:
            - vcloud
            - disks
            - create
            - git-deployment/((infra-disks-spec))
            - --prefix=((cluster-name))-((infra-namespace))
            - --zone=((iaas-zone))
            - --iaas=((iaas))
            - --workspace=((iaas-workspace))
            - --type=ssd
      - task: ensure-cluster-exists
        config:
          platform: linux
          image_resource:
            type: docker-image
            source: {
              repository: gcr.io/ss-infrastructure-public/platform/tools,
              tag: ((vp-tools-container-version)),
            }
          inputs:
          - name: git-deployment
          params: {
            PROJECT: padas-app,
            CLUSTER_NAME: ((cluster-name)),
            IAAS: ((iaas)),
            ZONE: ((iaas-zone)),
            WORKSPACE: ((iaas-workspace)),
            SERVICE_ACCOUNT_KEY: ((padas-app-cluster-admin)),
            USERNAME: ((creator)),
            VAULT_TOKEN: ((vault-automation-token)),
            VAULT_ADDR: ((vault-address)),
            ELASTIC_URL: ((elastic-url)),
            AZURE_TENANT_ID: ((azure-tenant-id)),
            AZURE_SUBSCRIPTION_ID: ((azure-subscription-id)),
            AZURE_CLIENT_ID: ((azure-client-id)),
            AZURE_CLIENT_SECRET: ((azure-client-secret)),
            LOGSTASH_URL: ((logstash-url))
          }
          run:
            path: /bin/bash
            args:
            - vcloud
            - clusters
            - create
            - git-deployment/((cluster-spec))
            - --name=((cluster-name))
            - --zone=((iaas-zone))
            - --iaas=((iaas))
            - --workspace=((iaas-workspace))
      - task: create-deployment-plan
        config:
          platform: linux
          image_resource:
            type: docker-image
            source: {
              repository: gcr.io/ss-infrastructure-public/platform/tools,
              tag: ((vp-tools-container-version)),
            }
          inputs:
          - name: server-version
          - name: web-version
          - name: smartconnect-version
          - name: git-deployment
          params: {
            PROJECT: padas-app,
            USERNAME: ((creator)),
            VAULT_TOKEN: ((vault-automation-token)),
            VAULT_ADDR: ((vault-address)),
            ELASTIC_URL: ((elastic-url)),
            VCLOUD_SERVICE_URL: ((vcloud-service-url)),
            LOGSTASH_URL: ((logstash-url))
          }
          run:
            path: /bin/bash
            args:
            - vcloud
            - deployment-plans
            - create
            - git-deployment/deployment/default-deployment-plan-spec.yaml
            - --series=((cluster-name))
    - do:
      - task: deploy
        config:
          platform: linux
          image_resource:
            type: docker-image
            source: {
              repository: gcr.io/ss-infrastructure-public/platform/tools,
              tag: ((vp-tools-container-version)),
            }
          inputs:
          - name: git-deployment
          params: {
            PROJECT: padas-app,
            CLUSTER_NAME: ((cluster-name)),
            IAAS: ((iaas)),
            ZONE: ((iaas-zone)),
            WORKSPACE: ((iaas-workspace)),
            SERVICE_ACCOUNT_KEY: ((padas-app-cluster-admin)),
            USERNAME: ((creator)),
            VAULT_TOKEN: ((vault-automation-token)),
            VAULT_ADDR: ((vault-address)),
            ELASTIC_URL: ((elastic-url)),
            VCLOUD_SERVICE_URL: ((vcloud-service-url)),
            DAS_STATIC_IP: ((das-static-ip)),
            AZURE_TENANT_ID: ((azure-tenant-id)),
            AZURE_SUBSCRIPTION_ID: ((azure-subscription-id)),
            AZURE_CLIENT_ID: ((azure-client-id)),
            AZURE_CLIENT_SECRET: ((azure-client-secret)),
            LOGSTASH_URL: ((logstash-url)),
            NAMESPACE: ((namespace)),
            INFRA_NAMESPACE: ((infra-namespace)),
            IAAS_WORKSPACE: ((iaas-workspace))
          }
          run:
            path: /bin/bash
            args:
            - -ec
            - |
              echo "Finalizing the PV definitions to be used for this IAAS"
              find . -name "*.yaml.$IAAS" -exec bash -c 'mv "$1" "${1%.yaml.$IAAS}".yaml' - '{}' \;
              find . -type f -name '*.yaml\.*' -exec rm {} +

              vcloud clusters deploy git-deployment/deployment/components --params-file git-deployment/deployment/params/default.params.yaml git-deployment/deployment/params/((deploy-params-environment)).params.yaml --name ((cluster-name)) --workspace ((iaas-workspace)) --iaas ((iaas)) --zone ((iaas-zone)) --plan ((cluster-name)) --recipe git-deployment/deployment/recipes/((deploy-recipe))
      on_failure:
        do:
        - put: slack-alert
          params:
            channel: ((slack-notification-channel))
            text: |
              :warning: $BUILD_PIPELINE_NAME job $BUILD_JOB_NAME failed
              $ATC_EXTERNAL_URL/teams/$BUILD_TEAM_NAME/pipelines/$BUILD_PIPELINE_NAME/jobs/$BUILD_JOB_NAME

- name: destroy-cluster
  serial: true
  disable_manual_trigger: true
  plan:
  - get: git-deployment
  - do:
    - task: delete-cluster
      config:
        platform: linux
        image_resource:
          type: docker-image
          source: {
            repository: gcr.io/ss-infrastructure-public/platform/tools,
            tag: ((vp-tools-container-version)),
          }
        inputs:
        - name: git-deployment
        params: {
          PROJECT: padas-app,
          SERVICE_ACCOUNT_KEY: ((padas-app-boshprovisioner)),
          USERNAME: ((creator)),
          VAULT_TOKEN: ((vault-automation-token)),
          VAULT_ADDR: ((vault-address)),
          ELASTIC_URL: ((elastic-url)),
          BUILD_PIPELINE_NAME: ((pipeline-name)),
          AZURE_TENANT_ID: ((azure-tenant-id)),
          AZURE_SUBSCRIPTION_ID: ((azure-subscription-id)),
          AZURE_CLIENT_ID: ((azure-client-id)),
          AZURE_CLIENT_SECRET: ((azure-client-secret)),
          LOGSTASH_URL: ((logstash-url))
        }
        run:
          path: /bin/bash
          args:
          - -ec
          - |
            echo "Deleting cluster. Project [$PROJECT], Workspace ((iaas-workspace)), Zone ((iaas-zone)), K8s Cluster ((cluster-name))"
            vcloud clusters delete -i ((iaas)) --project $PROJECT -w ((iaas-workspace)) -n ((cluster-name)) -z ((iaas-zone)) -f

