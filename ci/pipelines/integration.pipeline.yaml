          LOGSTASH_URL: ((logstash-url)),
          DELETE_CLUSTER: "no"
        }
        run:
          path: /bin/bash
          args:
          - -ec
          - |
            if [ "$DELETE_CLUSTER" == "yes" ]; then
              echo "Deleting Disks. Project [$PROJECT], Workspace ((iaas-workspace)), Zone ((iaas-zone)), K8s Cluster ((cluster-name)) Namespace ((namespace))"
              vcloud disks delete git-deployment/((infra-disks-spec)) -i ((iaas)) --project $PROJECT -w ((iaas-workspace)) -p=((cluster-name))-((infra-namespace)) -z=((iaas-zone)) -f || true
