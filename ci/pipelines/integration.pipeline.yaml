          AZURE_SUBSCRIPTION_ID: ((azure-subscription-id)),
          AZURE_CLIENT_ID: ((azure-client-id)),
          AZURE_CLIENT_SECRET: ((azure-client-secret)),
          LOGSTASH_URL: ((logstash-url))
        }
        run:
          path: /bin/bash
          args:
          - -ec
          - |
            echo "Deleting Disks. Project [$PROJECT], Workspace ((iaas-workspace)), Zone ((iaas-zone)), K8s Cluster ((cluster-name)) Namespace ((namespace))"
            vcloud disks delete git-deployment/((disks-spec)) -i ((iaas)) --project $PROJECT -w ((iaas-workspace)) -p=((cluster-name))-((namespace)) -z=((iaas-zone)) -f || true
    - task: delete-infra-disks
      config:
